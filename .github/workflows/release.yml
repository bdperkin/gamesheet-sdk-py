name: Version and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  version:
    name: Create Version and Tag
    runs-on: ubuntu-latest
    # Don't run on release commits to avoid loops
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Use PAT with permissions to bypass branch protection
          # Falls back to GITHUB_TOKEN if PAT is not configured
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: |
            3.11
            3.12
            3.13
            3.14

          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install python-semantic-release
        run: pip install "build" "pre-commit" "python-semantic-release"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run semantic-release
        id: release
        env:
          # Use PAT with permissions to bypass branch protection
          # Falls back to GITHUB_TOKEN if PAT is not configured
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # Run semantic-release version to:
          # 1. Analyze commits since last release
          # 2. Determine next version
          # 3. Update version in pyproject.toml
          # 4. Update CHANGELOG.md
          # 5. Commit changes
          # 6. Create and push tag
          semantic-release version --changelog

          # Check if a release was created
          if git describe --exact-match HEAD 2>/dev/null; then
            TAG=$(git describe --exact-match HEAD)
            VERSION=${TAG#v}
            echo "released=true" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "✅ Released version $VERSION"
          else
            echo "released=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No release needed (no releasable commits)"
          fi

  build:
    name: Build sdist + wheel
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build
        run: pip install build

      - name: Build distributions
        run: python -m build

      - name: Verify built version matches the tag
        run: |
          set -euo pipefail
          TAG_VERSION="${{ needs.version.outputs.version }}"
          WHEEL=$(ls dist/*.whl)
          BUILT_VERSION=$(basename "$WHEEL" | sed -n 's/^gamesheet_sdk_py-\(.*\)-py3-none-any.whl$/\1/p')
          echo "Tag version:   $TAG_VERSION"
          echo "Built version: $BUILT_VERSION"
          if [ "$TAG_VERSION" != "$BUILT_VERSION" ]; then
            echo "::error::Tag-vs-built version mismatch"
            exit 1
          fi

      - name: Upload built distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 30

  publish-test-pypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/gamesheet-sdk-py
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: publish-test-pypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/gamesheet-sdk-py
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: [version, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Extract changelog for this version
        run: |
          VERSION="${{ needs.version.outputs.version }}"

          # Read CHANGELOG.md and extract the section for this version
          if [ -f CHANGELOG.md ]; then
            # Try both formats: ## v0.1.5 and ## [0.1.5]
            CHANGELOG_CONTENT=$(awk "/^## (v${VERSION}|\[${VERSION}\])/,/^## (v|\\[)/" CHANGELOG.md | sed '$d' | tail -n +2)

            if [ -n "$CHANGELOG_CONTENT" ]; then
              echo "Found changelog content for version $VERSION"
              echo "$CHANGELOG_CONTENT" > /tmp/release_notes.md
            else
              echo "No specific changelog found for $VERSION, using auto-generated notes"
              echo "" > /tmp/release_notes.md
            fi
          else
            echo "CHANGELOG.md not found, using auto-generated notes"
            echo "" > /tmp/release_notes.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.version.outputs.tag }}"

          # Check if release already exists
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, uploading assets"
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          elif [ -s /tmp/release_notes.md ]; then
            # Use changelog content if available
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes-file /tmp/release_notes.md \
              dist/*
          else
            # Fall back to auto-generated notes
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes \
              dist/*
          fi
