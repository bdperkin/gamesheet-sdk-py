---
name: Version and Release

on:
  push:
    branches: [main]
  pull_request:
    branches-ignore: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: Create Version and Tag
    runs-on: ubuntu-latest
    # Don't run on release commits to avoid loops.
    # The paths-ignore filter was intentionally removed because it prevented
    # the workflow from running when semantic-release commits CHANGELOG.md
    # and pyproject.toml changes, causing build/publish jobs to be skipped.
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    permissions:
      contents: write # Required to create commits and tags
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          # Use PAT with permissions to bypass branch protection
          # Falls back to GITHUB_TOKEN if PAT is not configured
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: |
            3.11
            3.12
            3.13
            3.14

          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install python-semantic-release
        run: pip install "build" "pre-commit" "python-semantic-release"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run semantic-release
        id: release
        env:
          # Use PAT with permissions to bypass branch protection
          # Falls back to GITHUB_TOKEN if PAT is not configured
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # Run semantic-release version to:
          # 1. Analyze commits since last release
          # 2. Determine next version
          # 3. Update version in pyproject.toml
          # 4. Update CHANGELOG.md
          # 5. Commit changes
          # 6. Create and push tag
          semantic-release version --changelog

          # Check if a release was created
          if git describe --exact-match HEAD 2>/dev/null; then
            TAG=$(git describe --exact-match HEAD)
            VERSION=${TAG#v}
            echo "released=true" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "✅ Released version $VERSION"
          else
            echo "released=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No release needed (no releasable commits)"
          fi

  build:
    name: Build sdist + wheel
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build
        run: pip install build

      - name: Build distributions
        run: python -m build

      - name: Verify built version matches the tag
        run: |
          set -euo pipefail
          TAG_VERSION="${NEEDS_VERSION_OUTPUTS_VERSION}"
          WHEEL=$(ls dist/*.whl)
          BUILT_VERSION=$(basename "$WHEEL" | sed -n 's/^gamesheet_sdk_py-\(.*\)-py3-none-any.whl$/\1/p')
          echo "Tag version:   $TAG_VERSION"
          echo "Built version: $BUILT_VERSION"
          if [ "$TAG_VERSION" != "$BUILT_VERSION" ]; then
            echo "::error::Tag-vs-built version mismatch"
            exit 1
          fi
        env:
          NEEDS_VERSION_OUTPUTS_VERSION: ${{ needs.version.outputs.version }}

      - name: Upload built distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 30

  publish-test-pypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/gamesheet-sdk-py
    permissions:
      id-token: write # Required for trusted publishing to TestPyPI
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.12.2
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: publish-test-pypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/gamesheet-sdk-py
    permissions:
      id-token: write # Required for trusted publishing to PyPI
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.12.2

  build-container:
    name: Build and Publish Container
    needs: [version, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read # Read repo for build context
      packages: write # Push to GitHub Container Registry
      id-token: write # Sign container with Sigstore/cosign
      security-events: write # Upload Trivy SARIF results
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/bdperkin/gamesheet-sdk-py
          tags: |
            # latest tag for main branch
            type=raw,value=latest,enable={{is_default_branch}}
            # version tag (e.g., 2.1.0)
            type=semver,pattern={{version}},value=${{ needs.version.outputs.version }}
            # major.minor tag (e.g., 2.1)
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }}
            # major tag (e.g., 2)
            type=semver,pattern={{major}},value=${{ needs.version.outputs.version }}
            # branch-sha tag for traceability
            type=raw,value=${{ github.ref_name }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=gamesheet-sdk-py
            org.opencontainers.image.description=Unofficial Python SDK and CLI for the GameSheet Inc. platform
            org.opencontainers.image.vendor=bdperkin
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/bdperkin/gamesheet-sdk-py:${{ needs.version.outputs.version }}
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: trivy-results.sarif

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/bdperkin/gamesheet-sdk-py:${{ needs.version.outputs.version }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90

  github-release:
    name: Create GitHub Release
    needs: [version, build-container]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create GitHub release with artifacts
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Extract changelog for this version
        run: |
          VERSION="${NEEDS_VERSION_OUTPUTS_VERSION}"

          # Read CHANGELOG.md and extract the section for this version
          if [ -f CHANGELOG.md ]; then
            # Try both formats: ## v0.1.5 and ## [0.1.5]
            CHANGELOG_CONTENT=$(awk "/^## (v${VERSION}|\[${VERSION}\])/,/^## (v|\\[)/" CHANGELOG.md | sed '$d' | tail -n +2)

            if [ -n "$CHANGELOG_CONTENT" ]; then
              echo "Found changelog content for version $VERSION"
              echo "$CHANGELOG_CONTENT" > /tmp/release_notes.md
            else
              echo "No specific changelog found for $VERSION, using auto-generated notes"
              echo "" > /tmp/release_notes.md
            fi
          else
            echo "CHANGELOG.md not found, using auto-generated notes"
            echo "" > /tmp/release_notes.md
          fi
        env:
          NEEDS_VERSION_OUTPUTS_VERSION: ${{ needs.version.outputs.version }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEEDS_VERSION_OUTPUTS_TAG: ${{ needs.version.outputs.tag }}
        run: |
          TAG="${NEEDS_VERSION_OUTPUTS_TAG}"

          # Check if release already exists
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, uploading assets"
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          elif [ -s /tmp/release_notes.md ]; then
            # Use changelog content if available
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes-file /tmp/release_notes.md \
              dist/*
          else
            # Fall back to auto-generated notes
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes \
              dist/*
          fi
