---
# Automated Version Bumping, Release, and PyPI Publication
#
# Purpose:
#   Fully automates version bumping, CHANGELOG generation, PyPI publication, container builds,
#   and GitHub Release creation using python-semantic-release (PSR). Analyzes Conventional Commits
#   since last release, determines next version, updates pyproject.toml and CHANGELOG.md, creates
#   a tag, builds sdist+wheel, publishes to TestPyPI then PyPI, builds/publishes a container to
#   GitHub Container Registry, and creates a GitHub Release with changelog notes.
#
# Triggers:
#   - push: ONLY on push to main branch (different from other workflows that run on all branches)
#   - pull_request: Explicitly disabled via branches-ignore: ["**"] (only runs on main push)
#   - workflow_dispatch: Allows manual trigger for ad-hoc releases
#
# Concurrency:
#   - Scoped to workflow + branch name
#   - Never cancels in-progress runs (cancel-in-progress: false) to preserve release sequence
#
# Permissions:
#   - contents: read (default for most jobs)
#   - contents: write (version job: creates commits/tags; github-release job: creates release)
#   - id-token: write (publish-test-pypi, publish-pypi, build-container: trusted publishing)
#   - packages: write (build-container: push to GitHub Container Registry)
#   - security-events: write (build-container: upload Trivy SARIF results)
#
# Jobs (6-step pipeline):
#   1. version: Analyzes commits, bumps version, updates CHANGELOG, creates tag (PSR)
#   2. build: Builds sdist+wheel, verifies version matches tag, uploads dist/ artifact
#   3. publish-test-pypi: Publishes to TestPyPI (validation step before prod)
#   4. publish-pypi: Publishes to PyPI (production release)
#   5. build-container: Builds multi-arch container, scans with Trivy, publishes to ghcr.io
#   6. github-release: Creates GitHub Release with changelog notes and dist/ attachments
#
# Version Job:
#   - Skips on release commits (if: !startsWith(..., 'chore(release):')) to avoid loops
#   - Uses RELEASE_TOKEN (PAT with bypass-branch-protection) or GITHUB_TOKEN fallback
#   - Runs semantic-release version --changelog to analyze, bump, commit, tag
#   - Outputs: released (true/false), version (X.Y.Z), tag (vX.Y.Z)
#   - Version is stored in pyproject.toml:project.version (managed by PSR via version_toml)
#   - CHANGELOG.md is updated with new entries (managed by PSR)
#   - Creates commit: "chore(release): X.Y.Z" and tag "vX.Y.Z"
#   - Pushes commit and tag to main (triggers GitHub workflows again, but skipped by if filter)
#
# Build Job:
#   - Runs ONLY if version.outputs.released == 'true' (gates all downstream jobs)
#   - Checks out the exact tag created by version job (ref: needs.version.outputs.tag)
#   - Builds sdist+wheel with python -m build (uses hatchling backend)
#   - Verifies built version matches tag version (parses wheel filename, fails on mismatch)
#   - Uploads dist/ artifact (30-day retention, consumed by publish + github-release jobs)
#
# Publish Jobs:
#   - publish-test-pypi: Publishes to test.pypi.org (environment: testpypi, trusted publishing)
#   - publish-pypi: Publishes to pypi.org (environment: pypi, trusted publishing, needs test-pypi)
#   - Both use PyPA's gh-action-pypi-publish with id-token write (no password/token required)
#
# Container Job:
#   - Builds multi-arch container (linux/amd64, linux/arm64) with Docker Buildx
#   - Tags: latest (main only), semver (X.Y.Z, X.Y, X), branch-sha (traceability)
#   - Publishes to ghcr.io/bdperkin/gamesheet-sdk-py
#   - Runs Trivy vulnerability scanner, uploads SARIF to GitHub Security
#   - Generates SBOM (SPDX JSON), uploads as artifact (90-day retention)
#   - Uses GitHub Container Registry (ghcr.io) with GITHUB_TOKEN (no separate PAT)
#
# GitHub Release Job:
#   - Checks out main branch (not tag) to access latest CHANGELOG.md
#   - Extracts changelog section for this version (supports both "## vX.Y.Z" and "## [X.Y.Z]")
#   - Creates GitHub Release with extracted notes or falls back to --generate-notes
#   - Attaches dist/ artifacts (sdist + wheel) to the release
#   - If release already exists, uploads assets with --clobber (idempotent retry logic)
#
# Versioning Strategy:
#   - Standard semver: feat: → minor, fix:/perf: → patch
#   - major_on_zero = false: breaking changes produce minor bumps while on 0.x (no auto-1.0.0)
#   - Version source: pyproject.toml:project.version (single source of truth)
#   - Conventional Commits format enforced by conventional-pre-commit hook (all commits)
#
# Outputs:
#   - pyproject.toml (version bumped)
#   - CHANGELOG.md (new entries added)
#   - Git tag: vX.Y.Z (pushed to main)
#   - PyPI package: https://pypi.org/project/gamesheet-sdk-py/X.Y.Z
#   - TestPyPI package: https://test.pypi.org/project/gamesheet-sdk-py/X.Y.Z
#   - Container image: ghcr.io/bdperkin/gamesheet-sdk-py:X.Y.Z (and :latest, :X.Y, :X)
#   - GitHub Release: https://github.com/bdperkin/gamesheet-sdk-py/releases/tag/vX.Y.Z
#   - SBOM artifact (uploaded to GitHub Actions, 90-day retention)
#
# Related Workflows:
#   - docs.yml (triggered by main push after release commit, rebuilds docs with new version)
#   - codecov.yml (triggered by main push after release commit, uploads coverage for new version)
#
# Configuration Files:
#   - pyproject.toml ([tool.semantic_release], [project.version], [build-system])
#   - CHANGELOG.md (managed by PSR, extracted by github-release job)
#   - Dockerfile (container build context)
#   - .trivyignore.yaml (suppressed container base image CVEs, with expiry dates)
#
# Maintenance Notes:
#   - RELEASE_TOKEN (PAT) is optional; falls back to GITHUB_TOKEN if not configured
#   - RELEASE_TOKEN must have bypass-branch-protection permissions to push to protected main
#   - Trusted publishing is configured on PyPI/TestPyPI (no manual token setup required)
#   - Container tags follow OCI best practices (semver + latest + traceability)
#   - SBOM generation uses Anchore sbom-action (SPDX JSON format)
#   - Trivy scans use .trivyignore.yaml to suppress unfixable base image CVEs; that filename is
#     NOT auto-detected by Trivy, so every scan must pass `trivyignores:` explicitly
#   - Keep semantic-release config in sync with CLAUDE.md's versioning strategy docs
name: Version and Release

on:
  workflow_dispatch:  # Allow manual trigger
  pull_request:
    branches-ignore:
      - '**'
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}

jobs:
  version:
    name: Create Version and Tag
    permissions:
      contents: write  # Required to create commits and tags
    runs-on: ubuntu-latest
    # Don't run on release commits to avoid loops.
    # The paths-ignore filter was intentionally removed because it prevented
    # the workflow from running when semantic-release commits CHANGELOG.md
    # and pyproject.toml changes, causing build/publish jobs to be skipped.
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          # Use PAT with permissions to bypass branch protection
          # Falls back to GITHUB_TOKEN if PAT is not configured
          persist-credentials: false
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run semantic-release
        id: release
        run: |
          # Run semantic-release version to:
          # 1. Analyze commits since last release
          # 2. Determine next version
          # 3. Update version in pyproject.toml
          # 4. Update CHANGELOG.md
          # 5. Commit changes
          # 6. Create and push tag
          uv run --extra python-semantic-release --extra dev semantic-release version --changelog
          # Check if a release was created
          if git describe --exact-match HEAD 2>/dev/null; then
            TAG=$(git describe --exact-match HEAD)
            VERSION=${TAG#v}
            echo "released=true" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "✅ Released version $VERSION"
          else
            echo "released=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No release needed (no releasable commits)"
          fi
        env:
          # Use PAT with permissions to bypass branch protection
          # Falls back to GITHUB_TOKEN if PAT is not configured
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
  build:
    name: Build sdist + wheel
    needs: version
    runs-on: ubuntu-latest
    if: needs.version.outputs.released == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.version.outputs.tag }}
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          python-version: '3.11'
      - name: Build distributions
        run: uv build
      - name: Verify built version matches the tag
        run: |
          set -euo pipefail
          TAG_VERSION="${NEEDS_VERSION_OUTPUTS_VERSION}"
          WHEEL=$(ls dist/*.whl)
          BUILT_VERSION=$(basename "$WHEEL" | sed -n 's/^gamesheet_sdk_py-\(.*\)-py3-none-any.whl$/\1/p')
          echo "Tag version:   $TAG_VERSION"
          echo "Built version: $BUILT_VERSION"
          if [ "$TAG_VERSION" != "$BUILT_VERSION" ]; then
            echo "::error::Tag-vs-built version mismatch"
            exit 1
          fi
        env:
          NEEDS_VERSION_OUTPUTS_VERSION: ${{ needs.version.outputs.version }}
      - name: Upload built distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 30
  publish-test-pypi:
    name: Publish to TestPyPI
    needs: build
    environment:
      name: testpypi
      url: https://test.pypi.org/p/gamesheet-sdk-py
    permissions:
      id-token: write  # Required for trusted publishing to TestPyPI
    runs-on: ubuntu-latest
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.12.2
        with:
          repository-url: https://test.pypi.org/legacy/
  publish-pypi:
    name: Publish to PyPI
    needs: publish-test-pypi
    environment:
      name: pypi
      url: https://pypi.org/p/gamesheet-sdk-py
    permissions:
      id-token: write  # Required for trusted publishing to PyPI
    runs-on: ubuntu-latest
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.12.2
  build-container:
    name: Build and Publish Container
    needs:
      - version
      - publish-pypi
    permissions:
      contents: read  # Read repo for build context
      id-token: write  # Sign container with Sigstore/cosign
      packages: write  # Push to GitHub Container Registry
      security-events: write  # Upload Trivy SARIF results
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.version.outputs.tag }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/bdperkin/gamesheet-sdk-py
          labels: |
            org.opencontainers.image.title=gamesheet-sdk-py
            org.opencontainers.image.description=Unofficial Python SDK and CLI for the GameSheet Inc. platform
            org.opencontainers.image.vendor=bdperkin
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          tags: |
            # latest tag for main branch
            type=raw,value=latest,enable={{is_default_branch}}
            # version tag (e.g., 2.1.0)
            type=semver,pattern={{version}},value=${{ needs.version.outputs.version }}
            # major.minor tag (e.g., 2.1)
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }}
            # major tag (e.g., 2)
            type=semver,pattern={{major}},value=${{ needs.version.outputs.version }}
            # branch-sha tag for traceability
            type=raw,value=${{ github.ref_name }}-${{ github.sha }}
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          format: sarif
          image-ref: ghcr.io/bdperkin/gamesheet-sdk-py:${{ needs.version.outputs.version }}
          output: trivy-results.sarif
          # Must be passed explicitly: Trivy auto-loads a plain `.trivyignore`
          # but NOT `.trivyignore.yaml`. Dropping this input silently disables
          # every suppression in that file.
          trivyignores: .trivyignore.yaml
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4.37.7
        with:
          category: trivy-image
          sarif_file: trivy-results.sarif
          # Shared with security-trivy-image.yml so both workflows write to one
          # analysis stream and refresh each other's findings. Omitting this makes
          # GitHub derive a per-workflow category (".github/workflows/<file>:<job>"),
          # which produces two parallel alert sets for the same image.
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          format: spdx-json
          image: ghcr.io/bdperkin/gamesheet-sdk-py:${{ needs.version.outputs.version }}
          output-file: sbom.spdx.json
      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90
  github-release:
    name: Create GitHub Release
    needs:
      - version
      - build-container
    permissions:
      contents: write  # Create GitHub release with artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Extract changelog for this version
        run: |
          VERSION="${NEEDS_VERSION_OUTPUTS_VERSION}"
          # Read CHANGELOG.md and extract the section for this version
          if [ -f CHANGELOG.md ]; then
            # Try both formats: ## v0.1.5 and  ## [0.1.5]
            CHANGELOG_CONTENT=$(awk "/^## (v${VERSION}|\[${VERSION}\])/,/^## (v|\\[)/" CHANGELOG.md | \
              sed '$d' | tail -n +2)
            if [ -n "$CHANGELOG_CONTENT" ]; then
              echo "Found changelog content for version $VERSION"
              echo "$CHANGELOG_CONTENT" > /tmp/release_notes.md
            else
              echo "No specific changelog found for $VERSION, using auto-generated notes"
              echo "" > /tmp/release_notes.md
            fi
          else
            echo "CHANGELOG.md not found, using auto-generated notes"
            echo "" > /tmp/release_notes.md
          fi
        env:
          NEEDS_VERSION_OUTPUTS_VERSION: ${{ needs.version.outputs.version }}
      - name: Create GitHub Release
        run: |-
          TAG="${NEEDS_VERSION_OUTPUTS_TAG}"
          # Check if release already exists
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, uploading assets"
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          elif [ -s /tmp/release_notes.md ]; then
            # Use changelog content if available
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes-file /tmp/release_notes.md \
              dist/*
          else
            # Fall back to auto-generated notes
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes \
              dist/*
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEEDS_VERSION_OUTPUTS_TAG: ${{ needs.version.outputs.tag }}
