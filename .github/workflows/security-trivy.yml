---
# ╔══════════════════════════════════════════════════════════════════════════════════════════╗
# ║ GitHub Actions Workflow                                                                  ║
# ╠══════════════════════════════════════════════════════════════════════════════════════════╣
# ║ Name      │ Security - Trivy Vulnerability Scanning                                      ║
# ║ Category  │ Security - Container & Dependency Vulnerability Scanning                     ║
# ║ Purpose   │ Run Trivy vulnerability scanner for filesystem dependencies, configuration   ║
# ║           │ files, and Python packages; includes pip-audit for Python-specific CVEs     ║
# ╠══════════════════════════════════════════════════════════════════════════════════════════╣
# ║ Action    │ aquasecurity/trivy-action (multi-mode scanner)                               ║
# ║ Trigger   │ push: branches-ignore=["**"] (effectively disabled for push events)          ║
# ║           │ pull_request: types=[opened, reopened]                                       ║
# ║           │ schedule: weekly on Mondays at 9:00 AM UTC                                   ║
# ║ Runs on   │ ubuntu-latest                                                                ║
# ║ Jobs      │ trivy-fs (filesystem scan), trivy-config (config files),                     ║
# ║           │ pip-audit (Python dependency vulnerabilities across py3.11-3.14)             ║
# ╠══════════════════════════════════════════════════════════════════════════════════════════╣
# ║ Permissions                                                                              ║
# ╟──────────────────────────────────────────────────────────────────────────────────────────╢
# ║ • contents: read         │ Checkout repository                                           ║
# ║ • security-events: write │ Upload SARIF results to GitHub Security tab (trivy jobs)      ║
# ╠══════════════════════════════════════════════════════════════════════════════════════════╣
# ║ Key Features                                                                             ║
# ╟──────────────────────────────────────────────────────────────────────────────────────────╢
# ║ • trivy-fs job:                                                                          ║
# ║   - Scans filesystem for vulnerabilities in dependencies (pyproject.toml, lock files)    ║
# ║   - Severity: CRITICAL, HIGH, MEDIUM (SARIF report uploaded to Security tab)             ║
# ║   - Second pass fails workflow on CRITICAL/HIGH findings (exit-code: 1)                  ║
# ║   - Passes .trivyignore.yaml explicitly (that filename is not auto-detected)             ║
# ║ • trivy-config job:                                                                      ║
# ║   - Scans configuration files (YAML, Dockerfile, etc.) for misconfigurations             ║
# ║   - Reports findings without failing build (exit-code: 0)                                ║
# ║ • pip-audit job:                                                                         ║
# ║   - Matrix across Python 3.11, 3.12, 3.13, 3.14                                          ║
# ║   - Installs package with all extras ([all]) for full dependency tree                    ║
# ║   - Runs pip-audit --desc --skip-editable                                                ║
# ║   - continue-on-error: true (reports findings without failing workflow)                  ║
# ╠══════════════════════════════════════════════════════════════════════════════════════════╣
# ║ Output Artifacts                                                                         ║
# ╟──────────────────────────────────────────────────────────────────────────────────────────╢
# ║ • trivy-fs-results.sarif     │ Filesystem scan SARIF (category: trivy-fs)                ║
# ║ • trivy-config-results.sarif │ Config scan SARIF (category: trivy-config)                ║
# ║ • GitHub Security tab        │ Uploaded SARIF findings from both Trivy jobs              ║
# ║ • pip-audit console output   │ Vulnerability descriptions for each Python version        ║
# ╠══════════════════════════════════════════════════════════════════════════════════════════╣
# ║ Notes                                                                                    ║
# ╟──────────────────────────────────────────────────────────────────────────────────────────╢
# ║ • .trivyignore.yaml suppresses unfixable container base image CVEs, each with a          ║
# ║   `statement` rationale and an `expired_at` date (see CLAUDE.md security section)        ║
# ║ • Container image scanning lives in security-trivy-image.yml (PR-gated) and release.yml  ║
# ║ • trivy-fs double-scan pattern: SARIF upload (all severities) + fail-on-critical/high    ║
# ║ • pip-audit complements Trivy (Python-specific OSV/CVE database)                         ║
# ║ • pip-audit runs continue-on-error to avoid blocking on advisory-only findings           ║
# ║ • Weekly scheduled scan ensures fresh CVE database lookups                               ║
# ╚══════════════════════════════════════════════════════════════════════════════════════════╝
name: Security - Trivy Vulnerability Scanning

on:
  pull_request:
    types:
      - opened
      - reopened
  push:
    branches-ignore:
      - '**'
  schedule:
    # Run weekly on Mondays at 9:00 AM UTC
    - cron: 0 9 * * 1

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}

jobs:
  trivy-fs:
    name: Trivy filesystem scan
    permissions:
      contents: read
      security-events: write  # For uploading SARIF results
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@bfa4b33a029b9aa80ddb784b45574c30e072c59e  # master
        with:
          exit-code: '0' # Don't fail build, just report
          # Required: Trivy auto-loads `.trivyignore` but not `.trivyignore.yaml`
          format: sarif
          output: trivy-fs-results.sarif
          scan-ref: .
          scan-type: fs
          severity: CRITICAL,HIGH,MEDIUM
          trivyignores: .trivyignore.yaml
      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3  # v4.37.6
        with:
          category: trivy-fs
          sarif_file: trivy-fs-results.sarif
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Trivy filesystem scan (fail on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@bfa4b33a029b9aa80ddb784b45574c30e072c59e  # master
        with:
          exit-code: '1' # Fail on critical/high
          # Required: Trivy auto-loads `.trivyignore` but not `.trivyignore.yaml`
          format: table
          scan-ref: .
          scan-type: fs
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore.yaml
  trivy-config:
    name: Trivy config scan
    permissions:
      contents: read
      security-events: write  # For uploading SARIF results
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@bfa4b33a029b9aa80ddb784b45574c30e072c59e  # master
        with:
          exit-code: '0' # Don't fail build, just report
          format: sarif
          output: trivy-config-results.sarif
          scan-ref: .
          scan-type: config
      - name: Upload Trivy config results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3  # v4.37.6
        with:
          category: trivy-config
          sarif_file: trivy-config-results.sarif
          token: ${{ secrets.GITHUB_TOKEN }}
  pip-audit:
    name: pip-audit Python dependency scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with all dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
      - name: Run pip-audit
        run: |-
          pip install pip-audit
          pip-audit --desc --skip-editable
        continue-on-error: true  # Report findings but don't fail build
