---
# ╔══════════════════════════════════════════════════════════════════════════════════════════╗
# ║ GitHub Actions Workflow                                                                  ║
# ╠══════════════════════════════════════════════════════════════════════════════════════════╣
# ║ Name      │ GitGuardian Secret Scanner                                                   ║
# ║ Category  │ Security - Secret Detection / Credential Scanning                            ║
# ║ Purpose   │ Scan commits for hardcoded secrets, API keys, credentials, tokens, and       ║
# ║           │ other sensitive data to prevent accidental credential exposure               ║
# ╠══════════════════════════════════════════════════════════════════════════════════════════╣
# ║ Action    │ GitGuardian/ggshield-action (ggshield CLI wrapper)                           ║
# ║ Trigger   │ push: branches=[main] (paths-ignore: CHANGELOG.md, pyproject.toml)          ║
# ║           │ pull_request: branches=[main] (no paths-ignore - must gate every PR)        ║
# ║ Runs on   │ ubuntu-latest                                                                ║
# ║ Scope     │ Full commit history (fetch-depth: 0) to scan all commits in PR diff         ║
# ╠══════════════════════════════════════════════════════════════════════════════════════════╣
# ║ Permissions                                                                              ║
# ╟──────────────────────────────────────────────────────────────────────────────────────────╢
# ║ • contents: read         │ Checkout repository with full history                         ║
# ║ • security-events: write │ Upload SARIF results to GitHub Security tab                   ║
# ╠══════════════════════════════════════════════════════════════════════════════════════════╣
# ║ Key Features                                                                             ║
# ╟──────────────────────────────────────────────────────────────────────────────────────────╢
# ║ • Scans all commits in PR diff using GitGuardian's secret detection engine               ║
# ║ • Detects 350+ types of secrets (AWS keys, GitHub tokens, DB credentials, etc.)          ║
# ║ • --show-secrets flag reveals matched secrets in output for review                       ║
# ║ • --exit-zero prevents build failures (reports findings without blocking)                ║
# ║ • --all-policies applies all GitGuardian detection policies                              ║
# ║ • Skips dependabot PRs and external forks (conditional if check)                         ║
# ╠══════════════════════════════════════════════════════════════════════════════════════════╣
# ║ Environment Variables                                                                    ║
# ╟──────────────────────────────────────────────────────────────────────────────────────────╢
# ║ • GITGUARDIAN_API_KEY        │ API key for GitGuardian service (secret)                  ║
# ║ • GITHUB_PUSH_BEFORE_SHA     │ Commit SHA before push (for diff context)                 ║
# ║ • GITHUB_PUSH_BASE_SHA       │ Base SHA for push events                                  ║
# ║ • GITHUB_PULL_BASE_SHA       │ Base SHA for pull request events                          ║
# ║ • GITHUB_DEFAULT_BRANCH      │ Default branch name (main)                                ║
# ╠══════════════════════════════════════════════════════════════════════════════════════════╣
# ║ Output Artifacts                                                                         ║
# ╟──────────────────────────────────────────────────────────────────────────────────────────╢
# ║ • .gitguardian.yaml          │ Scan results config/report (uploaded as artifact)         ║
# ║ • Artifact retention         │ 30 days                                                   ║
# ╠══════════════════════════════════════════════════════════════════════════════════════════╣
# ║ Notes                                                                                    ║
# ╟──────────────────────────────────────────────────────────────────────────────────────────╢
# ║ • Requires GITGUARDIAN_API_KEY secret configured in repository settings                  ║
# ║ • Full history fetch required to scan all commits in PR (fetch-depth: 0)                 ║
# ║ • exit-zero mode reports findings without failing workflow                               ║
# ║ • Skips external fork PRs and dependabot (security: fork PRs can't access secrets)       ║
# ║ • Complements CodeQL's clear-text-logging checks                                         ║
# ╚══════════════════════════════════════════════════════════════════════════════════════════╝
name: GitGuardian Secret Scanner

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - CHANGELOG.md
      - pyproject.toml

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}

jobs:
  gitguardian:
    name: GitGuardian Secret Scan
    permissions:
      contents: read
      security-events: write  # Required for uploading SARIF results
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # Full history to scan all commits in PR diff
          persist-credentials: false
      - name: Run GitGuardian ggshield scan
        if: |
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.actor != 'dependabot[bot]') ||
          github.event_name == 'push'
        uses: GitGuardian/ggshield-action@2002482fb5990b486be5598ebcf48a8eba393fce  # v1.53.0
        with:
          args: --show-secrets --exit-zero --all-policies
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          if-no-files-found: ignore
          name: gitguardian-results
          path: .gitguardian.yaml
          retention-days: 30
