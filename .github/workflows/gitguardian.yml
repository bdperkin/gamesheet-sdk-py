name: GitGuardian Secret Scanner

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write # Required for uploading SARIF results

jobs:
  gitguardian:
    name: GitGuardian Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0 # Full history to scan all commits in PR diff
          persist-credentials: false

      - name: Run GitGuardian ggshield scan
        uses: GitGuardian/ggshield-action@ad41d391f42450e9e6bb34961e3b1cf73398f250 # v1.51.0
        if: (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') || github.event_name == 'push'
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          args: --show-secrets --exit-zero --all-policies

      - name: Upload scan results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gitguardian-results
          path: .gitguardian.yaml
          retention-days: 30
          if-no-files-found: ignore
