---
# ==============================================================================
# CI - Build and Install Sanity Check
# ==============================================================================
# Purpose: Quick sanity check that the package builds and installs correctly
#          across all supported Python versions. This is a fast smoke test
#          that catches basic packaging/dependency issues early.
#
# Triggers:
#   - push to main branch (skip if only CHANGELOG/version changes)
#   - pull_request (opened, reopened, synchronize)
#   - Concurrency: Cancels previous runs for the same branch
#
# Jobs: 1 job × 4 Python versions = 4 total runs
#   - sanity: install + console-script smoke test via uv
#
# Each job runs: uv run gamesheet-admin --version and uv run gamesheet-teams
# --version, which installs the project and proves both entry points import.
# ==============================================================================
name: CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main
    paths-ignore:
      - CHANGELOG.md
      - pyproject.toml

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}

jobs:
  sanity:
    name: sanity (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Run sanity check via uv
        run: |-
          uv run gamesheet-admin --version
          uv run gamesheet-teams --version
