---
# ==============================================================================
# CI - Build and Install Sanity Check
# ==============================================================================
# Purpose: Quick sanity check that the package builds and installs correctly
#          across all supported Python versions. This is a fast smoke test
#          that catches basic packaging/dependency issues early.
#
# Triggers:
#   - push to main branch (skip if only CHANGELOG/version changes)
#   - pull_request (opened, reopened, synchronize)
#   - Concurrency: Cancels previous runs for the same branch
#
# Jobs: 1 job × 4 Python versions = 4 total runs
#   - sanity: pip install + basic import test via tox
#
# Each job runs: tox -e py3XX (installs package and runs --version check)
# ==============================================================================

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "CHANGELOG.md"
      - "pyproject.toml"
  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore:
      - "CHANGELOG.md"
      - "pyproject.toml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sanity:
    name: sanity (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install tox
        run: pip install tox-workdir

      - name: Run tests via tox
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: tox -e "py$(echo "$PYTHON_VERSION" | tr -d .)"
