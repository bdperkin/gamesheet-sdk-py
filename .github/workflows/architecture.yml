---
# ==============================================================================
# Dependencies, Complexity Metrics, and Code Quality
# ==============================================================================
# Purpose: Analyzes codebase dependencies for unused, missing, or transitive
# dependencies with deptry, checks code quality and duplication with pylint,
# and computes complexity / maintainability metrics (Cyclomatic Complexity,
# Raw Metrics, Maintainability Index, Halstead) with Radon.
#
# Triggers:
#   - push to main branch (skip if only CHANGELOG/version changes)
#   - pull_request (opened, reopened, synchronize)
#   - Concurrency: Cancels previous runs for the same branch
#
# Jobs:
#   - deptry: Validates Python dependencies (4 Python versions)
#   - pylint: Validates code quality and duplicate code (4 Python versions)
#   - radon: Computes 4 code metrics across 4 Python versions (16 runs):
#     - cc: Cyclomatic complexity analysis
#     - raw: Raw metrics (LOC, LLOC, SLOC, comments, blanks)
#     - mi: Maintainability index calculation
#     - hal: Halstead complexity metrics
#
# Each job runs: uv run --extra [tool] [tool]
# ==============================================================================
name: Dependencies and Complexity Metrics

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main
    paths-ignore:
      - CHANGELOG.md
      - pyproject.toml

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}

jobs:
  deptry:
    name: deptry (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Run deptry via uv
        run: uv run --extra deptry deptry
  pylint:
    name: pylint (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Run pylint via uv
        run: uv run --extra pylint pylint .
  radon:
    name: radon ${{ matrix.analyzer }} analysis (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        analyzer:
          - cc
          - raw
          - mi
          - hal
        python-version:
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Run radon-${{ matrix.analyzer }} via uv
        run: uv run --extra radon radon "$RADON_ANALYZER" .
        env:
          RADON_ANALYZER: ${{ matrix.analyzer }}
