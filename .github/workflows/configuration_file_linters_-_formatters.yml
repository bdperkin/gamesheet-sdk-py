---
# ==============================================================================
# Configuration File Linters & Formatters
# ==============================================================================
# Purpose: Validates and formats project configuration files (YAML, TOML, INI,
# .editorconfig) to ensure correctness, consistency, and adherence to specs.
# Catches syntax errors, schema violations, and style inconsistencies early.
#
# Triggers:
#   - push to main branch (skip if only CHANGELOG/version changes)
#   - pull_request (opened, reopened, synchronize)
#   - Concurrency: Cancels previous runs for the same branch
#
# Jobs: 6 tools × 4 Python versions = 24 total runs
#   - editorconfig-checker: Validates files match .editorconfig rules (indentation,
#                          line endings, trailing whitespace, final newline)
#   - yamllint: Lints YAML files (-d relaxed mode for workflow compatibility)
#   - tox-ini-fmt: Formats and validates tox.ini structure and ordering
#   - pyproject-fmt: Formats pyproject.toml (sorts sections, normalizes spacing)
#   - validate-pyproject: Validates pyproject.toml against PEP 517/518/621 schemas
#   - pyroma: Rates project metadata quality and packaging best practices
#
# Note: pyroma introspects the build backend via `python -m build` and requires
# the full project install, so it skips pre-commit.ci (tier limitations) but runs
# in GitHub Actions where dependencies are available.
#
# Each job runs: tox -e [tool]
# ==============================================================================
name: Configuration File Linters & Formatters

on:
  pull_request:
    paths-ignore:
      - "CHANGELOG.md"
      - "pyproject.toml"

    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main
    paths-ignore:
      - "CHANGELOG.md"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  cancel-in-progress: true

  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}

jobs:
  editorconfig-checker:
    name: editorconfig-checker (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Run editorconfig-checker via uv
        run: uv run --extra editorconfig-checker ec

  yamllint:
    name: yamllint (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Run yamllint via uv
        run: uv run --extra yamllint yamllint -d relaxed .

  pyproject-fmt:
    name: pyproject-fmt (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Run pyproject-fmt via uv
        run: uv run --extra pyproject-fmt pyproject-fmt --check pyproject.toml

  validate-pyproject:
    name: validate-pyproject (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Run validate-pyproject via uv
        run: uv run --extra validate-pyproject validate-pyproject pyproject.toml

  pyroma:
    name: pyroma (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Run pyroma via uv
        run: uv run --extra pyroma pyroma .
