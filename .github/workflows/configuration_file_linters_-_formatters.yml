---
# ==============================================================================
# Configuration File Linters & Formatters
# ==============================================================================
# Purpose: Validates and formats project configuration files (YAML, TOML, INI,
# .editorconfig) to ensure correctness, consistency, and adherence to specs.
# Catches syntax errors, schema violations, and style inconsistencies early.
#
# Triggers:
#   - push to main branch (skip if only CHANGELOG/version changes)
#   - pull_request (opened, reopened, synchronize)
#   - Concurrency: Cancels previous runs for the same branch
#
# Jobs: 6 tools × 4 Python versions = 24 total runs
#   - editorconfig-checker: Validates files match .editorconfig rules (indentation,
#                          line endings, trailing whitespace, final newline)
#   - yamllint: Lints YAML files (-d relaxed mode for workflow compatibility)
#   - tox-ini-fmt: Formats and validates tox.ini structure and ordering
#   - pyproject-fmt: Formats pyproject.toml (sorts sections, normalizes spacing)
#   - validate-pyproject: Validates pyproject.toml against PEP 517/518/621 schemas
#   - pyroma: Rates project metadata quality and packaging best practices
#
# Note: pyroma introspects the build backend via `python -m build` and requires
# the full project install, so it skips pre-commit.ci (tier limitations) but runs
# in GitHub Actions where dependencies are available.
#
# Each job runs: tox -e [tool]
# ==============================================================================
name: Configuration File Linters & Formatters

on:
  push:
    branches: [main]
    paths-ignore:
      - "CHANGELOG.md"
      - "pyproject.toml"
  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore:
      - "CHANGELOG.md"
      - "pyproject.toml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  editorconfig-checker:
    name: editorconfig-checker (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install tox
        run: pip install tox-workdir
      - name: Run editorconfig-checker via tox
        run: tox -e editorconfig-checker

  yamllint:
    name: yamllint (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install tox
        run: pip install tox-workdir
      - name: Run yamllint via tox
        run: tox -e yamllint

  tox-ini-fmt:
    name: tox-ini-fmt (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install tox
        run: pip install tox-workdir
      - name: Run tox-ini-fmt via tox
        run: tox -e tox-ini-fmt

  pyproject-fmt:
    name: pyproject-fmt (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install tox
        run: pip install tox-workdir
      - name: Run pyproject-fmt via tox
        run: tox -e pyproject-fmt

  validate-pyproject:
    name: validate-pyproject (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install tox
        run: pip install tox-workdir
      - name: Run validate-pyproject via tox
        run: tox -e validate-pyproject

  pyroma:
    name: pyroma (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
