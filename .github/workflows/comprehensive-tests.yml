name: Comprehensive Testing

on:
  schedule:
    # Run every night at 2 AM UTC
    - cron: "0 2 * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprehensive-test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0 # Full history for comprehensive testing
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache tool directories
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .pytest_cache
            .mypy_cache
          key: >-
            tools-${{ runner.os }}-py${{ matrix.python-version }}-
            ${{ hashFiles('src/**/*.py', 'tests/**/*.py') }}
          restore-keys: |
            tools-${{ runner.os }}-py${{ matrix.python-version }}-
            tools-${{ runner.os }}-
      - name: Install dependencies
        run: pip install -e ".[pytest]"
      - name: Run full test suite
        run: |
          pytest -v --cov --cov-report=xml --cov-report=term
      - name: Compute Codecov per-version flag
        if: success()
        id: pyflag
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          pyflag="py$(echo "$PYTHON_VERSION" | tr '.' '-')"
          echo "value=${pyflag}" >> "$GITHUB_OUTPUT"
      # Codecov requires one flag per upload. Upload the same coverage.xml
      # three times so the same data feeds the `nightly` aggregate, the
      # per-OS flag, and the per-Python-version flag.
      - name: Upload coverage to Codecov (nightly)
        if: success()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: nightly
          name: nightly-${{ matrix.os }}-py${{ matrix.python-version }}-nightly

      - name: Upload coverage to Codecov (${{ matrix.os }})
        if: success()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: ${{ matrix.os }}
          name: nightly-${{ matrix.os }}-py${{ matrix.python-version }}-os

      - name: Upload coverage to Codecov (${{ steps.pyflag.outputs.value }})
        if: success()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: ${{ steps.pyflag.outputs.value }}
          name: nightly-${{ matrix.os }}-py${{ matrix.python-version }}-pyver

  retry-on-failure:
    name: Retry Failed Jobs
    needs: comprehensive-test
    if: failure()
    runs-on: ubuntu-latest
    outputs:
      should_create_issue: ${{ steps.check-attempt.outputs.should_create_issue }}
    steps:
      - name: Check if this is first attempt
        id: check-attempt
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          echo "run_attempt=$RUN_ATTEMPT" >> $GITHUB_OUTPUT
          if [ "$RUN_ATTEMPT" = "1" ]; then
            echo "should_create_issue=false" >> $GITHUB_OUTPUT
            echo "🔄 First failure detected - will retry automatically"
          else
            echo "should_create_issue=true" >> $GITHUB_OUTPUT
            echo "❌ Retry also failed - will create issue"
          fi
      - name: Trigger automatic retry (first attempt only)
        if: github.run_attempt == 1
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            console.log('🔄 Triggering automatic retry of failed jobs...');
            // Wait 60 seconds before retrying to allow transient issues to resolve
            await new Promise(resolve => setTimeout(resolve, 60000));
            // Re-run only the failed jobs
            await github.rest.actions.reRunWorkflowFailedJobs({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });
            console.log('✅ Retry triggered successfully');
