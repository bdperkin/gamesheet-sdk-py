---
# Comprehensive Multi-OS Test Suite with Codecov Upload
#
# Purpose:
#   Runs the full pytest test suite across all supported operating systems (Ubuntu, macOS, Windows)
#   and all supported Python versions (3.11-3.14) on a nightly schedule. Uploads coverage to Codecov
#   with nightly, OS, and per-Python-version flags for cross-platform coverage tracking.
#
# Triggers:
#   - schedule: Runs daily at 2:00 AM UTC (nightly builds)
#   - workflow_dispatch: Allows manual trigger for ad-hoc comprehensive testing
#   - push: Explicitly disabled via branches-ignore: ["**"] (only runs on schedule/manual)
#   - pull_request: Explicitly disabled via branches-ignore: ["**"] (only runs on schedule/manual)
#
# Concurrency:
#   - Scoped to workflow + branch name
#   - Cancels in-progress runs unconditionally (always true)
#
# Permissions:
#   - contents: read (required to checkout repository)
#
# Matrix Strategy:
#   - Operating systems: ubuntu-latest, macos-latest, windows-latest
#   - Python versions: 3.11, 3.12, 3.13, 3.14
#   - Total jobs: 12 (3 OS × 4 Python versions)
#   - fail-fast: false (continue running all jobs even if one fails)
#   - Each job uploads coverage THREE times with different flags:
#     1. nightly (aggregate flag for all nightly builds)
#     2. ${matrix.os} (per-OS flag, e.g., ubuntu-latest, macos-latest, windows-latest)
#     3. py${PYTHON_VERSION} (per-Python-version flag, e.g., py3-11, py3-12, computed dynamically)
#
# Architecture:
#   - Minimal install ([pytest] extras only, no full [all] to keep CI fast)
#   - Caches .pytest_cache and .mypy_cache for faster runs
#   - Runs full pytest suite with coverage: pytest -v --cov --cov-report=xml --cov-report=term
#   - Uploads coverage.xml THREE times (once per flag) because Codecov requires one flag per upload
#     to populate the nightly aggregate view, the per-OS breakdown, and the per-Python-version view
#   - Uploads only on success (if: success()) to avoid polluting Codecov with failed-run artifacts
#   - Computes per-Python-version flag dynamically via shell script (py3-11, py3-12, etc.)
#   - Retry logic: On first failure, waits 60s and re-runs failed jobs via reRunWorkflowFailedJobs API
#
# Codecov Flags:
#   - nightly: Aggregate coverage for all nightly builds (cross-platform baseline)
#   - ubuntu-latest, macos-latest, windows-latest: Per-OS coverage (platform-specific trends)
#   - py3-11, py3-12, py3-13, py3-14: Per-version coverage (Python release trends)
#
# Retry Strategy:
#   - The retry-on-failure job runs ONLY if comprehensive-test fails
#   - On first attempt (github.run_attempt == 1), waits 60s and triggers automatic retry
#   - On second attempt (retry also failed), outputs should_create_issue: true for alerting
#   - Uses actions/github-script to invoke reRunWorkflowFailedJobs API
#
# Outputs:
#   - coverage.xml (uploaded to Codecov with nightly, OS, and Python-version flags)
#   - Codecov trends for cross-platform coverage (visible in Codecov dashboard)
#   - should_create_issue output from retry-on-failure job (can be consumed by issue-creation job)
#
# Related Workflows:
#   - codecov.yml (per-PR test suite with Codecov uploads, Ubuntu-only)
#   - tests.yml (CI matrix without Codecov uploads, runs tool-per-job)
#
# Configuration Files:
#   - pyproject.toml ([tool.coverage.run], [tool.coverage.report], [tool.pytest.ini_options])
#   - .codecov.yml (coverage targets, flaky-test alert thresholds, patch/project gates)
#
# Maintenance Notes:
#   - Nightly schedule avoids overloading CI on every PR (comprehensive matrix is expensive)
#   - Codecov uploads use verbose: false (less noisy than codecov.yml's verbose: true)
#   - The py-flag computation uses shell expansion to convert "3.11" -> "py3-11" (tr '.' '-')
#   - Keep the matrix in sync with codecov.yml's Python version matrix
#   - Retry logic adds resilience against flaky external dependencies (network, package mirrors)
name: Comprehensive Testing

on:
  workflow_dispatch:
  pull_request:
    branches-ignore:
      - "**"
  push:
    branches-ignore:
      - "**"
  schedule:
    # Run daily at 2:00 AM UTC
    - cron: "0 2 * * *"

permissions:
  contents: read

concurrency:
  cancel-in-progress: true

  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}

jobs:
  comprehensive-test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history for comprehensive testing
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Run full test suite
        run: |
          uv run --extra pytest pytest -v --cov --cov-report=xml --cov-report=term
      - name: Compute Codecov per-version flag
        id: pyflag
        if: success()
        run: |
          pyflag="py$(echo "$PYTHON_VERSION" | tr '.' '-')"
          echo "value=${pyflag}" >> "$GITHUB_OUTPUT"
      # Codecov requires one flag per upload. Upload the same coverage.xml
      # three times so the same data feeds the `nightly` aggregate, the
      # per-OS flag, and the per-Python-version flag.
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        shell: bash
      - name: Upload coverage to Codecov (nightly)
        if: success()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          flags: nightly
          name: nightly-${{ matrix.os }}-py${{ matrix.python-version }}-nightly

          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload coverage to Codecov (${{ matrix.os }})
        if: success()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          flags: ${{ matrix.os }}
          name: nightly-${{ matrix.os }}-py${{ matrix.python-version }}-os

          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload coverage to Codecov (${{ steps.pyflag.outputs.value }})
        if: success()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          flags: ${{ steps.pyflag.outputs.value }}
          name: nightly-${{ matrix.os }}-py${{ matrix.python-version }}-pyver

          token: ${{ secrets.CODECOV_TOKEN }}
  retry-on-failure:
    name: Retry Failed Jobs
    needs: comprehensive-test
    runs-on: ubuntu-latest
    if: failure()
    outputs:
      should_create_issue: ${{ steps.check-attempt.outputs.should_create_issue }}
    steps:
      - name: Check if this is first attempt
        id: check-attempt
        run: |
          echo "run_attempt=$RUN_ATTEMPT" >> $GITHUB_OUTPUT
          if [ "$RUN_ATTEMPT" = "1" ]; then
            echo "should_create_issue=false" >> $GITHUB_OUTPUT
            echo "First failure detected - will retry automatically"
          else
            echo "should_create_issue=true" >> $GITHUB_OUTPUT
            echo "Retry also failed - will create issue"
          fi
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
      - name: Trigger automatic retry (first attempt only)
        if: github.run_attempt == 1
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |-
            console.log('🔄 Triggering automatic retry of failed jobs...');
            // Wait 60 seconds before retrying to allow transient issues to resolve
            await new Promise(resolve => setTimeout(resolve, 60000));
            // Re-run only the failed jobs
            await github.rest.actions.reRunWorkflowFailedJobs({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });
            console.log('✅ Retry triggered successfully');
