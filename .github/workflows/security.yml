---
# ==============================================================================
# Secret and Vulnerability Scans
# ==============================================================================
# Purpose: Scans code for security vulnerabilities, insecure patterns, and
# potential secrets using Semgrep static analysis.
#
# Triggers:
#   - push to main branch (skip if only CHANGELOG/version changes)
#   - pull_request (opened, reopened, synchronize)
#   - Concurrency: Cancels previous runs for the same branch
#
# Jobs: 1 tool across Python 3.11-3.14 (4 total runs)
#   - semgrep: Static analysis to find bugs and security vulnerabilities
#
# Each job runs: uv run --extra [tool] [tool]
# ==============================================================================
name: Secret and Vulnerability Scans

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main
    paths-ignore:
      - CHANGELOG.md
      - pyproject.toml

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}

jobs:
  semgrep:
    name: semgrep (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Run semgrep via uv
        run: uv run --extra semgrep semgrep --config auto .
