---
# ╔══════════════════════════════════════════════════════════════════════════════════════════╗
# ║ GitHub Actions Workflow                                                                  ║
# ╠══════════════════════════════════════════════════════════════════════════════════════════╣
# ║ Name      │ Semgrep SAST                                                                 ║
# ║ Category  │ Security - Static Application Security Testing (SAST)                        ║
# ║ Purpose   │ Run Semgrep security-focused static analysis to detect vulnerabilities,      ║
# ║           │ insecure patterns, hardcoded secrets, and code smells in Python/Dockerfile   ║
# ╠══════════════════════════════════════════════════════════════════════════════════════════╣
# ║ Action    │ semgrep/semgrep Docker image (OSS version) run as container                  ║
# ║ Trigger   │ push: branches=[main] (paths-ignore: CHANGELOG.md, pyproject.toml)          ║
# ║           │ pull_request: branches=[main] (paths-ignore: CHANGELOG.md, pyproject.toml)  ║
# ║ Runs on   │ ubuntu-latest (in semgrep/semgrep:1.101.0 Docker container)                 ║
# ║ Scope     │ Python source code, Dockerfiles, and security-sensitive patterns             ║
# ╠══════════════════════════════════════════════════════════════════════════════════════════╣
# ║ Permissions                                                                              ║
# ╟──────────────────────────────────────────────────────────────────────────────────────────╢
# ║ • contents: read         │ Checkout repository with full history                         ║
# ║ • security-events: write │ Upload SARIF results to GitHub Security tab                   ║
# ╠══════════════════════════════════════════════════════════════════════════════════════════╣
# ║ Key Features                                                                             ║
# ╟──────────────────────────────────────────────────────────────────────────────────────────╢
# ║ • Runs Semgrep OSS engine with multiple security-focused rule packs:                     ║
# ║   - p/security-audit   │ General security vulnerabilities                                ║
# ║   - p/secrets          │ Hardcoded secrets and credentials                               ║
# ║   - p/python           │ Python-specific security and best practices                     ║
# ║   - p/dockerfile       │ Dockerfile security misconfigurations                           ║
# ║ • Generates SARIF output uploaded to GitHub Security tab                                 ║
# ║ • Full commit history for accurate analysis (fetch-depth: 0)                             ║
# ║ • --verbose flag for detailed scan logging                                               ║
# ╠══════════════════════════════════════════════════════════════════════════════════════════╣
# ║ Environment Variables                                                                    ║
# ╟──────────────────────────────────────────────────────────────────────────────────────────╢
# ║ • SEMGREP_APP_TOKEN │ Optional token for Semgrep Cloud integration (secret)              ║
# ╠══════════════════════════════════════════════════════════════════════════════════════════╣
# ║ Output Artifacts                                                                         ║
# ╟──────────────────────────────────────────────────────────────────────────────────────────╢
# ║ • semgrep-results.sarif │ SARIF-format scan results                                      ║
# ║ • GitHub Security tab   │ Uploaded SARIF findings (category: semgrep)                    ║
# ║ • Artifact retention    │ 30 days (semgrep-sarif artifact)                               ║
# ╠══════════════════════════════════════════════════════════════════════════════════════════╣
# ║ Notes                                                                                    ║
# ╟──────────────────────────────────────────────────────────────────────────────────────────╢
# ║ • Runs in Docker container for isolated, reproducible scans                              ║
# ║ • Full history fetch required for accurate incremental analysis (fetch-depth: 0)         ║
# ║ • SARIF upload runs with if: always() to report findings even on scan failures           ║
# ║ • Complements CodeQL (Semgrep faster, CodeQL more thorough semantic analysis)            ║
# ║ • SEMGREP_APP_TOKEN optional (enables cloud features but not required for OSS)           ║
# ╚══════════════════════════════════════════════════════════════════════════════════════════╝

name: Semgrep SAST

on:
  push:
    branches: [main]
    paths-ignore:
      - "CHANGELOG.md"
      - "pyproject.toml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "CHANGELOG.md"
      - "pyproject.toml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Required for uploading SARIF results to GitHub Security tab

    container:
      # Semgrep OSS Docker image
      image: semgrep/semgrep:1.101.0@sha256:a2917a82fec40f4d165fd701abb3937677b900105f3e909861fa03844a8e00db

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # Full history for accurate analysis
          persist-credentials: false

      - name: Run Semgrep SAST scan
        run: |
          semgrep scan \
            --config=p/security-audit \
            --config=p/secrets \
            --config=p/python \
            --config=p/dockerfile \
            --sarif \
            --output=semgrep-results.sarif \
            --verbose
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload SARIF results to GitHub Security
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        if: always()
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

      - name: Upload SARIF as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: semgrep-sarif
          path: semgrep-results.sarif
          retention-days: 30
