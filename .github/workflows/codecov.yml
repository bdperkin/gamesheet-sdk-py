---
# Test Suite with Codecov Coverage Upload
#
# Purpose:
#   Runs the pytest test suite across Python 3.11-3.14 on every PR and main push,
#   uploading coverage.xml and JUnit test results to Codecov for coverage tracking,
#   Test Analytics (flaky-test detection), and per-Python-version trend analysis.
#
# Triggers:
#   - push: Runs on push to main branch (after PR merge)
#   - pull_request: Runs on all PR activity targeting main
#   - Ignores changes to CHANGELOG.md and pyproject.toml (managed by release workflow)
#
# Concurrency:
#   - Scoped to workflow + branch name
#   - Cancels in-progress runs unconditionally (always true)
#
# Permissions:
#   - contents: read (default, required to checkout repository)
#
# Matrix Strategy:
#   - Python versions: 3.11, 3.12, 3.13, 3.14 (each runs as separate job)
#   - Each version uploads coverage THREE times with different flags:
#     1. unittests (aggregate flag across all Python versions)
#     2. py3-XX (per-Python-version flag, e.g., py3-11, py3-12)
#     3. JUnit XML (test_results report type for Test Analytics)
#
# Architecture:
#   - Minimal install ([pytest] extras only, no full [all] to keep CI fast)
#   - Caches .pytest_cache, .mypy_cache, .ruff_cache for faster runs
#   - Runs pytest with --cov --cov-report=xml --cov-report=term --junitxml=junit-py${PYTHON_VERSION}.xml
#   - Uploads coverage.xml twice (once with unittests flag, once with py3-XX flag) because
#     Codecov requires one flag per upload to populate both the aggregate view and the
#     per-version breakdown
#   - Uploads JUnit XML separately for Codecov Test Analytics (flaky-test detection,
#     test performance tracking)
#   - Sets override_commit to pull_request.head.sha on PR events so Codecov's commit page
#     shows coverage attributed to the PR head SHA (not the synthesized merge commit)
#
# Codecov Flags:
#   - unittests: Aggregate coverage across all Python versions (project-wide baseline)
#   - py3-11, py3-12, py3-13, py3-14: Per-version coverage (trend analysis per Python release)
#
# Outputs:
#   - coverage.xml (uploaded to Codecov with unittests and py3-XX flags)
#   - junit-py${PYTHON_VERSION}.xml (uploaded to Codecov Test Analytics)
#   - Codecov comment on PRs with coverage diff and trend charts
#
# Related Workflows:
#   - comprehensive-tests.yml (nightly multi-OS test suite, also uploads to Codecov)
#   - tests.yml (CI matrix without Codecov uploads, runs tool-per-job)
#
# Configuration Files:
#   - pyproject.toml ([tool.coverage.run], [tool.coverage.report], [tool.pytest.ini_options])
#   - .codecov.yml (coverage targets, flaky-test alert thresholds, patch/project gates)
#
# Maintenance Notes:
#   - Codecov uploads use fail_ci_if_error: false to avoid blocking CI on Codecov API issues
#   - verbose: true logs upload details for debugging Codecov flag/commit attribution issues
#   - The matrix.py-flag field is computed from matrix.python-version (e.g., "3.11" -> "py3-11")
#   - Keep the matrix in sync with comprehensive-tests.yml's Python version matrix
name: Tests with Codecov

on:
  push:
    branches: [main]
    paths-ignore:
      - "CHANGELOG.md"
      - "pyproject.toml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "CHANGELOG.md"
      - "pyproject.toml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - python-version: "3.11"
            py-flag: "py3-11"
          - python-version: "3.12"
            py-flag: "py3-12"
          - python-version: "3.13"
            py-flag: "py3-13"
          - python-version: "3.14"
            py-flag: "py3-14"

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # Full history for comprehensive testing
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache tool directories
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .pytest_cache
            .mypy_cache
            .ruff_cache
          key: >-
            tools-${{ runner.os }}-py${{ matrix.python-version }}-
            ${{ hashFiles('src/**/*.py', 'tests/**/*.py') }}
          restore-keys: |
            tools-${{ runner.os }}-py${{ matrix.python-version }}-
            tools-${{ runner.os }}-

      - name: Install dependencies
        run: |
          pip install -e ".[pytest]"

      - name: Run tests with coverage
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          pytest --cov --cov-report=xml --cov-report=term \
            --junitxml=junit-py${PYTHON_VERSION}.xml

      # Codecov requires one flag per upload. Upload the same coverage.xml
      # twice so the same data feeds both the `unittests` aggregate and
      # the per-Python-version (py3-XX) flag.
      - name: Upload coverage to Codecov (unittests)
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.python-version }}-unittests
          # On pull_request events, $GITHUB_SHA is a synthesized merge
          # commit; attribute the upload to the PR head SHA instead so
          # the Codecov UI's commit page (which uses head SHA) shows it.
          override_commit: ${{ github.event.pull_request.head.sha || github.sha }}
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage to Codecov (${{ matrix.py-flag }})
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: ${{ matrix.py-flag }}
          name: codecov-${{ matrix.py-flag }}
          override_commit: ${{ github.event.pull_request.head.sha || github.sha }}
          fail_ci_if_error: false
          verbose: true

      - name: Upload test results to Codecov
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit-py${{ matrix.python-version }}.xml
          report_type: test_results
          override_commit: ${{ github.event.pull_request.head.sha || github.sha }}
          fail_ci_if_error: false
          verbose: true
