---
# ==============================================================================
# pre-commit
# ==============================================================================
# Purpose: Runs the full pre-commit hook suite in CI to validate code quality,
# formatting, linting, type checking, and security across all files. Mirrors
# the local pre-commit environment to catch any issues before merge.
#
# Triggers:
#   - push to main branch (skip if only CHANGELOG/version changes)
#   - pull_request (opened, reopened, synchronize)
#   - Concurrency: Cancels previous runs for the same branch
#
# Jobs: 1 job running pre-commit across all configured hooks
#   - Runs: pre-commit run --all-files
#   - Python versions: 3.11, 3.12, 3.13, 3.14 (all available)
#   - Executes all hooks from .pre-commit-config.yaml except:
#     - no-commit-to-branch (skipped via SKIP env var — already validated locally)
#
# Special Notes:
#   - no-commit-to-branch is skipped in CI because GitHub Actions checks out
#     main by name on push events, so HEAD is on main and the hook would always
#     fail. The guard already ran locally on pre-commit/pre-push.
#   - Three hooks are skipped on pre-commit.ci but run here:
#     - pyright (dependencies exceed 250 MiB tier limit on pre-commit.ci)
#     - flake8 (flake8-plugins pulls fastapi, flake8-django, etc., exceeding limit)
#     - pyroma (requires python -m venv, which fails on pre-commit.ci's Python build)
#
# This workflow ensures all quality gates pass before code reaches main.
# ==============================================================================
name: pre-commit

on:
  push:
    branches: [main]
    paths-ignore:
      - "CHANGELOG.md"
      - "pyproject.toml"
  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore:
      - "CHANGELOG.md"
      - "pyproject.toml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: |
            3.11
            3.12
            3.13
            3.14

          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        env:
          # On push events to main, GitHub Actions checks the branch out by
          # name, so HEAD is on main and `no-commit-to-branch` would always
          # fail in CI. The guard already ran locally on pre-commit/pre-push
          # — skipping it here keeps every other hook active without
          # blocking pushes that have legitimately reached main.
          SKIP: no-commit-to-branch
