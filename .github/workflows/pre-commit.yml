name: pre-commit

on:
  push:

  pull_request:
    types: [opened, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Skip on release commits to avoid duplicate runs
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: |
            3.11
            3.12
            3.13
            3.14

          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: pre-commit/action@v3.0.1
        env:
          # On push events to main, GitHub Actions checks the branch out by
          # name, so HEAD is on main and `no-commit-to-branch` would always
          # fail in CI. The guard already ran locally on pre-commit/pre-push
          # — skipping it here keeps every other hook active without
          # blocking pushes that have legitimately reached main.
          SKIP: no-commit-to-branch
