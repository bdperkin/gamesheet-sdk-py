---
# ==============================================================================
# Documentation & Docstring Tools
# ==============================================================================
# Purpose: Validates docstring quality, spelling, and documentation formatting
# across code and embedded code blocks. Enforces documentation completeness
# standards and checks for common spelling/grammar issues.
#
# Triggers:
#   - push to main branch (skip if only CHANGELOG/version changes)
#   - pull_request (opened, reopened, synchronize)
#   - Concurrency: Cancels previous runs for the same branch
#
# Jobs: 7 tools × 4 Python versions = 28 total runs
#   - codespell: Spell checker for code, comments, and documentation
#   - blacken-docs: Formats Python code blocks in documentation (reST, Markdown)
#   - docformatter: Formats docstrings to PEP 257 standard
#   - interrogate: Checks docstring coverage percentage
#   - pydocstyle: Enforces PEP 257 docstring conventions
#
# Each job runs: tox -e [tool]
# ==============================================================================
name: Documentation & Docstring Tools

on:
  pull_request:
    paths-ignore:
      - "CHANGELOG.md"
      - "pyproject.toml"

    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main
    paths-ignore:
      - "CHANGELOG.md"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  cancel-in-progress: true

  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}

jobs:
  codespell:
    name: codespell (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Run codespell via uv
        run: uv run --extra codespell codespell

  blacken-docs:
    name: blacken-docs (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Run blacken-docs via uv
        run: uv run --extra blacken-docs blacken-docs --target-version py311 $(git ls-files '*.md' '*.rst')

  docformatter:
    name: docformatter (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Run docformatter via uv
        run: uv run --extra docformatter docformatter --check --recursive src/ tests/ tools/

  interrogate:
    name: interrogate (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Run interrogate via uv
        run: uv run --extra interrogate interrogate src/

  pydocstyle:
    name: pydocstyle (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Run pydocstyle via uv
        run: uv run --extra pydocstyle pydocstyle src/
