---
# ==============================================================================
# Documentation & Docstring Tools
# ==============================================================================
# Purpose: Validates docstring quality, spelling, and documentation formatting
# across code and embedded code blocks. Enforces documentation completeness
# standards and checks for common spelling/grammar issues.
#
# Triggers:
#   - push to main branch (skip if only CHANGELOG/version changes)
#   - pull_request (opened, reopened, synchronize)
#   - Concurrency: Cancels previous runs for the same branch
#
# Jobs: 7 tools × 4 Python versions = 28 total runs
#   - codespell: Spell checker for code, comments, and documentation
#   - blacken-docs: Formats Python code blocks in documentation (reST, Markdown)
#   - docformatter: Formats docstrings to PEP 257 standard
#   - interrogate: Checks docstring coverage percentage
#   - pydocstyle: Enforces PEP 257 docstring conventions
#   - sphinx-lint: Lints Sphinx documentation source files
#   - docconvert: Converts docstring styles (available in CI, not pre-commit)
#
# Each job runs: tox -e [tool]
# ==============================================================================
name: Documentation & Docstring Tools

on:
  push:
    branches: [main]
    paths-ignore:
      - "CHANGELOG.md"
      - "pyproject.toml"
  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore:
      - "CHANGELOG.md"
      - "pyproject.toml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codespell:
    name: codespell (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install tox
        run: pip install tox-workdir
      - name: Run codespell via tox
        run: tox -e codespell

  sphinx-lint:
    name: sphinx-lint (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
