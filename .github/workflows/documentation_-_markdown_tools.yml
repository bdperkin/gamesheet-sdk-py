---
# ==============================================================================
# Documentation & Markdown Tools
# ==============================================================================
# Purpose: Lints and formats Markdown files for consistent style, valid syntax,
# and proper structure. Ensures documentation adheres to CommonMark/GFM standards.
#
# Triggers:
#   - push to main branch (skip if only CHANGELOG/version changes)
#   - pull_request (opened, reopened, synchronize)
#   - Concurrency: Cancels previous runs for the same branch
#
# Jobs: 2 tools (pymarkdown: 4 Python versions; mdformat: single version)
#   - pymarkdown: Lints Markdown files for style and syntax violations
#   - mdformat: Auto-formats Markdown files (GFM plugin enabled)
#
# Tools run in check mode in CI. To apply fixes locally:
#   - make markdown (runs mdformat in write mode)
#   - mdformat (formats in place)
#   - pre-commit run --all-files (auto-fixes Markdown files)
#
# Each job runs: uv run --extra [tool] [tool]
# ==============================================================================
name: Documentation & Markdown Tools

on:
  pull_request:
    paths-ignore:
      - CHANGELOG.md
      - pyproject.toml

    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main
    paths-ignore:
      - CHANGELOG.md
      - pyproject.toml

permissions:
  contents: read

concurrency:
  cancel-in-progress: true

  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}

jobs:
  pymarkdown:
    name: pymarkdown (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Run pymarkdown via uv
        run: uv run --extra pymarkdown pymarkdown scan .

  mdformat:
    name: mdformat (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Run mdformat via uv
        run: uv run --extra mdformat mdformat --check $(git ls-files '*.md')
