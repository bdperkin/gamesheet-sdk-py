---
# ==============================================================================
# Type Checkers - Static Type Analysis
# ==============================================================================
# Purpose: Runs ty type checker to catch type errors before runtime.
#
# Triggers:
#   - push to main branch (skip if only CHANGELOG/version changes)
#   - pull_request (opened, reopened, synchronize)
#   - Concurrency: Cancels previous runs for the same branch
#
# Jobs: ty × 4 Python versions = 4 total runs
#   - ty: Universal, high-performance static type checker for Python
#
# Configuration:
#   - ty: [tool.ty] in pyproject.toml
#
# Each job runs: uv run --extra ty --extra tools ty check
# (the tools extra is required so imports inside tools/ resolve)
# ==============================================================================

name: Type Checkers

on:
  pull_request:
    paths-ignore:
      - CHANGELOG.md
      - pyproject.toml

    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main
    paths-ignore:
      - CHANGELOG.md
      - pyproject.toml

permissions:
  contents: read

concurrency:
  cancel-in-progress: true

  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}

jobs:
  ty:
    name: ty (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Run ty via uv
        run: uv run --extra ty --extra tools ty check
