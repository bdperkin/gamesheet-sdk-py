---
# ==============================================================================
# Type Checkers - Static Type Analysis
# ==============================================================================
# Purpose: Runs mypy (--strict) and pyright type checkers to catch type errors
#          before runtime. Both tools analyze type hints across the codebase.
#
# Triggers:
#   - push to main branch (skip if only CHANGELOG/version changes)
#   - pull_request (opened, reopened, synchronize)
#   - Concurrency: Cancels previous runs for the same branch
#
# Jobs: 2 tools × 4 Python versions = 8 total runs
#   - mypy: Industry-standard type checker (--strict mode enforced)
#   - pyright: Fast Microsoft type checker (TypeScript-based)
#
# Configuration:
#   - mypy: [tool.mypy] in pyproject.toml (strict = true)
#   - pyright: [tool.pyright] in pyproject.toml
#
# Each job runs: tox -e [tool]
# ==============================================================================

name: Type Checkers

on:
  pull_request:
    paths-ignore:
      - "CHANGELOG.md"
      - "pyproject.toml"

    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main
    paths-ignore:
      - "CHANGELOG.md"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  cancel-in-progress: true

  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}

jobs:
  mypy:
    name: mypy (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1edb52594c857e2b5b13128931090f0640537287 # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Run mypy via uv
        run: uv run --extra mypy mypy --config-file pyproject.toml src/

  pyright:
    name: pyright (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1edb52594c857e2b5b13128931090f0640537287 # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Run pyright via uv
        run: uv run --extra pyright pyright
