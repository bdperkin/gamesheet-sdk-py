---
# ==============================================================================
# Static Type Checks
# ==============================================================================
# Purpose: Runs ty type checker to catch type errors before runtime.
#
# Triggers:
#   - push to main branch (skip if only CHANGELOG/version changes)
#   - pull_request (opened, reopened, synchronize) - no paths-ignore here on purpose:
#     this job is a required status check, and a filtered-out PR never reports it, so
#     a pyproject.toml-only PR would sit at BLOCKED forever
#   - Concurrency: Cancels previous runs for the same branch
#
# Jobs: ty × 4 Python versions = 4 total runs
#   - ty: Universal, high-performance static type checker for Python
#
# Configuration:
#   - ty: [tool.ty] in pyproject.toml
#
# Each job runs: uv run --extra ty ty check
# (the ty extra fans out to [pytest,type-stubs] -> [tools], which is what makes
#  imports in tests/ and tools/ resolve and third-party types come from stubs)
# ==============================================================================
name: Static Type Checks

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main
    paths-ignore:
      - CHANGELOG.md
      - pyproject.toml

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}

jobs:
  ty:
    name: ty (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Run ty via uv
        run: uv run --extra ty ty check
