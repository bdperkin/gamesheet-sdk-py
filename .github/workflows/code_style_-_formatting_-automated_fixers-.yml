---
# ==============================================================================
# Code Style & Formatting (Automated Fixers)
# ==============================================================================
# Purpose: Enforces consistent code style, formatting, and modern Python syntax
# across the codebase using Ruff.
#
# Triggers:
#   - push to main branch (skip if only CHANGELOG/version changes)
#   - pull_request (opened, reopened, synchronize)
#   - Concurrency: Cancels previous runs for the same branch
# ==============================================================================
name: Code Style & Formatting (Automated Fixers)

on:
  pull_request:
    paths-ignore:
      - CHANGELOG.md
      - pyproject.toml

    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main
    paths-ignore:
      - CHANGELOG.md
      - pyproject.toml

permissions:
  contents: read

concurrency:
  cancel-in-progress: true

  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}

jobs:
  ruff-check:
    name: ruff check (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Run ruff check via uv
        run: uv run --extra ruff ruff check

  ruff-format:
    name: ruff format (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Run ruff format via uv
        run: uv run --extra ruff ruff format --check
