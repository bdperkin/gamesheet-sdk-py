---
# ==============================================================================
# Code Style & Formatting (Automated Fixers)
# ==============================================================================
# Purpose: Enforces consistent code style, formatting, and modern Python syntax
# across the codebase. All tools in this workflow can automatically fix issues,
# ensuring uniform appearance and reducing style bikeshedding.
#
# Triggers:
#   - push to main branch (skip if only CHANGELOG/version changes)
#   - pull_request (opened, reopened, synchronize)
#   - Concurrency: Cancels previous runs for the same branch
#
# Jobs: 8 tools × 4 Python versions = 32 total runs
#   - add-trailing-comma: Enforces trailing commas in multi-line collections
#   - absolufy-imports: Converts relative imports to absolute (src/ layout)
#   - pyupgrade: Modernizes syntax for Python 3.11+ (--py311-plus)
#   - isort: Sorts and organizes imports (profile = "black" for compatibility)
#   - ssort: Sorts class members and top-level definitions intelligently
#   - autopep8: Automatically fixes PEP 8 style violations
#   - black: Opinionated formatter (line-length 88, the uncompromising code formatter)
#
# Tools run in check mode in CI. To apply fixes locally, use:
#   - make fix (runs isort, black, mdformat in write mode)
#   - tox -e fix (runs all formatters with --check removed)
#   - pre-commit run --all-files (auto-fixes then stages changes)
#
# Each job runs: tox -e [tool]
# ==============================================================================
name: Code Style & Formatting (Automated Fixers)

on:
  push:
    branches: [main]
    paths-ignore:
      - "CHANGELOG.md"
      - "pyproject.toml"
  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore:
      - "CHANGELOG.md"
      - "pyproject.toml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  add-trailing-comma:
    name: add-trailing-comma (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install tox
        run: pip install tox-workdir
      - name: Run add-trailing-comma via tox
        run: tox -e add-trailing-comma

  absolufy-imports:
    name: absolufy-imports (py${{ matrix.python-version }})
