name: Code Style & Formatting (Automated Fixers)

on:
  push:
    branches: [main]

  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  add-trailing-comma:
    name: add-trailing-comma (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Skip on release commits to avoid duplicate runs
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install tox
        run: pip install tox-workdir
      - name: Run add-trailing-comma via tox
        run: tox -e add-trailing-comma

  absolufy-imports:
