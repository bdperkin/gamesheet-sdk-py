---
# ╔══════════════════════════════════════════════════════════════════════════════════════════╗
# ║ GitHub Actions Workflow                                                                  ║
# ╠══════════════════════════════════════════════════════════════════════════════════════════╣
# ║ Name      │ Dependency Review                                                            ║
# ║ Category  │ Security - Supply Chain / Dependency Vulnerability Detection                 ║
# ║ Purpose   │ Scan dependency manifest changes in pull requests to surface known-          ║
# ║           │ vulnerable package versions and block PRs introducing risky dependencies     ║
# ╠══════════════════════════════════════════════════════════════════════════════════════════╣
# ║ Source    │ GitHub-supplied workflow (actions/dependency-review-action)                  ║
# ║ Docs      │ https://docs.github.com/en/code-security/supply-chain-security/              ║
# ║           │ understanding-your-software-supply-chain/about-dependency-review             ║
# ║ Trigger   │ pull_request: branches=[main] (no paths-ignore - must gate every PR)         ║
# ║           │ push: branches-ignore=["**"] (effectively disabled for push events)          ║
# ║ Runs on   │ ubuntu-latest                                                                ║
# ║ Scope     │ Python dependencies declared in pyproject.toml and lock files                ║
# ╠══════════════════════════════════════════════════════════════════════════════════════════╣
# ║ Permissions                                                                              ║
# ╟──────────────────────────────────────────────────────────────────────────────────────────╢
# ║ • contents: read       │ Checkout repository                                             ║
# ║ • pull-requests: write │ Post summary comments on PRs (comment-summary-in-pr: always)    ║
# ╠══════════════════════════════════════════════════════════════════════════════════════════╣
# ║ Key Features                                                                             ║
# ╟──────────────────────────────────────────────────────────────────────────────────────────╢
# ║ • Runs ONLY on pull requests (supply-chain gate before merge)                            ║
# ║ • Detects newly introduced vulnerable dependencies in PR diff                            ║
# ║ • Posts summary comment in PR with findings (comment-summary-in-pr: always)              ║
# ║ • When marked as required check, blocks merging of PRs with vulnerable dependencies      ║
# ║ • Can fail on specific severity levels (fail-on-severity: moderate/high/critical)        ║
# ║ • Can deny specific licenses (deny-licenses option)                                      ║
# ╠══════════════════════════════════════════════════════════════════════════════════════════╣
# ║ Output Artifacts                                                                         ║
# ╟──────────────────────────────────────────────────────────────────────────────────────────╢
# ║ • PR comment with vulnerability summary (always posted)                                  ║
# ║ • Workflow check status (pass/fail based on findings)                                    ║
# ╠══════════════════════════════════════════════════════════════════════════════════════════╣
# ║ Notes                                                                                    ║
# ╟──────────────────────────────────────────────────────────────────────────────────────────╢
# ║ • GitHub-supplied workflow kept on original trigger pattern (PR-only)                    ║
# ║ • push trigger is explicitly disabled (branches-ignore: ["**"])                          ║
# ║ • Because it never runs on main, the README badge MUST carry                             ║
# ║   ?event=pull_request — a bare badge.svg reports the default branch, finds no run        ║
# ║   there, and renders "failing". Do not add a push trigger to satisfy the badge:          ║
# ║   dependency-review diffs a base against a head, so it needs explicit base-ref/          ║
# ║   head-ref off a pull_request, and a push to main has no meaningful base.                ║
# ║ • Complements pip-audit (this checks manifest changes, pip-audit scans installed pkgs)   ║
# ║ • Optional configurations (fail-on-severity, deny-licenses) are commented out            ║
# ║ • No allow-ghsas: suppress an advisory only while no patched version is reachable, and   ║
# ║   delete the entry once it is — a dead allowance silently re-opens the hole              ║
# ╚══════════════════════════════════════════════════════════════════════════════════════════╝
name: Dependency review

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - '**'

# If using a dependency submission action in this workflow this permission will need to be set to:
#
# permissions:
#   contents: write
#
# https://docs.github.com/en/enterprise-cloud@latest/code-security/supply-chain-security/understanding-your-software-supply-chain/using-the-dependency-submission-api
permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}

jobs:
  dependency-review:
    name: Dependency Review
    permissions:
      contents: read
      pull-requests: write  # Required for comment-summary-in-pr option
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        # Commonly enabled options, see
        # https://github.com/actions/dependency-review-action#configuration-options for all available options.
        with:
          comment-summary-in-pr: always
          # allow-ghsas is intentionally absent. It previously allowed
          # GHSA-hvrp-rf83-w775, GHSA-jpw9-pfvf-9f58 and GHSA-vj7q-gjh5-988w — the three mcp
          # advisories — while semgrep's hard pin held mcp at 1.23.3 and no patched version was
          # reachable. All three are now state=fixed: pyproject.toml overrides that pin to
          # mcp==1.29.0. The allowances therefore matched nothing, and a dead allowance is worse
          # than none: it would silently re-open the hole if a vulnerable mcp ever came back.
          #   fail-on-severity: moderate
          #   deny-licenses: GPL-1.0-or-later, LGPL-2.0-or-later
          #   retry-on-snapshot-warnings: true
