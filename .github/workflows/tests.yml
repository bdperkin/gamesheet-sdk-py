---
# ==============================================================================
# Tests - Full Pytest Suite
# ==============================================================================
# Purpose: Runs the complete pytest test suite (unit + integration tests)
#          across all supported Python versions. Includes VCR cassette replay
#          for HTTP tests and pytest-playwright for browser tests.
#
# Triggers:
#   - push to main branch (skip if only CHANGELOG/version changes)
#   - pull_request (opened, reopened, synchronize)
#   - Concurrency: Cancels previous runs for the same branch
#
# Jobs: 1 job × 4 Python versions = 4 total runs
#   - pytest: Full test suite with --block-network enabled
#
# Test markers:
#   - @pytest.mark.vcr: Replays HTTP from tests/cassettes/
#   - @pytest.mark.browser: Headless Chromium via pytest-playwright
#
# Each job runs: tox -e pytest (pytest --cov with 100% coverage target)
# ==============================================================================

name: Run all tests

on:
  pull_request:
    paths-ignore:
      - "CHANGELOG.md"
      - "pyproject.toml"

    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main
    paths-ignore:
      - "CHANGELOG.md"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  cancel-in-progress: true

  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}

jobs:
  pytest:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          cache: pip
          cache-dependency-path: pyproject.toml

          python-version: ${{ matrix.python-version }}
      - name: Install tox
        run: pip install tox-workdir

      - name: Run pytest via tox
        run: tox -e pytest
