name: Python Dependency Vulnerability Scanner

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Run daily at 2 AM UTC
    - cron: "0 2 * * *"

permissions:
  contents: read
  security-events: write # Required for uploading SARIF results

jobs:
  pip-audit-scan:
    name: pip-audit Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # Full history for comprehensive scanning
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: Install package with all dependencies
        run: |
          # Install the package with all extras to get full dependency tree
          pip install -e ".[all]"

      - name: Run pip-audit vulnerability scan
        id: pip-audit
        continue-on-error: true
        run: |
          # Install pip-audit
          pip install pip-audit

          # Scan installed packages and generate SARIF
          # Exit code 0: no vulnerabilities, 1: vulnerabilities found
          pip-audit --format=json --output=audit.json || true

          # Convert to SARIF format (pip-audit native SARIF support coming soon)
          # For now, check if vulnerabilities were found
          if [ -f audit.json ]; then
            if grep -q '"vulnerabilities"' audit.json && [ "$(jq '.vulnerabilities | length' audit.json 2>/dev/null || echo 0)" -gt 0 ]; then
              echo "scan_status=vulnerabilities_found" >> $GITHUB_OUTPUT
              echo "⚠️ Vulnerabilities found - see output below"
              pip-audit --desc
            else
              echo "scan_status=clean" >> $GITHUB_OUTPUT
              echo "✅ No vulnerabilities found"
              pip-audit
            fi
          else
            echo "scan_status=failed" >> $GITHUB_OUTPUT
            echo "❌ Scan failed"
            exit 1
          fi

      - name: Upload audit results as artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: pip-audit-results
          path: audit.json
          retention-days: 30

      - name: Fail if vulnerabilities found
        if: steps.pip-audit.outputs.scan_status == 'vulnerabilities_found'
        run: |
          echo "::error::Vulnerabilities detected in dependencies"
          exit 1
