---
# ╔══════════════════════════════════════════════════════════════════════════════════════════╗
# ║ GitHub Actions Workflow                                                                  ║
# ╠══════════════════════════════════════════════════════════════════════════════════════════╣
# ║ Name      │ Python Dependency Vulnerability Scanner                                      ║
# ║ Category  │ Security - Dependency Vulnerability Detection (OSV Database)                 ║
# ║ Purpose   │ Scan Python dependencies against the OSV (Open Source Vulnerabilities)       ║
# ║           │ database using pip-audit to detect known CVEs and security advisories       ║
# ╠══════════════════════════════════════════════════════════════════════════════════════════╣
# ║ Tool      │ pip-audit (Python-specific vulnerability scanner, PyPA OSV database)         ║
# ║ Trigger   │ push: branches=[main] (paths-ignore: CHANGELOG.md, pyproject.toml)          ║
# ║           │ pull_request: branches=[main] (paths-ignore: CHANGELOG.md, pyproject.toml)  ║
# ║           │ schedule: daily at 2:00 AM UTC                                               ║
# ║ Runs on   │ ubuntu-latest                                                                ║
# ║ Python    │ 3.11 (single version for consistent daily scans)                             ║
# ╠══════════════════════════════════════════════════════════════════════════════════════════╣
# ║ Permissions                                                                              ║
# ╟──────────────────────────────────────────────────────────────────────────────────────────╢
# ║ • contents: read         │ Checkout repository with full history                         ║
# ║ • security-events: write │ Upload SARIF results to GitHub Security tab                   ║
# ╠══════════════════════════════════════════════════════════════════════════════════════════╣
# ║ Key Features                                                                             ║
# ╟──────────────────────────────────────────────────────────────────────────────────────────╢
# ║ • Installs package with all extras ([all]) to scan full dependency tree                  ║
# ║ • Runs pip-audit against OSV database (PyPA's Open Source Vulnerabilities DB)            ║
# ║ • Generates JSON output (audit.json) with structured vulnerability data                  ║
# ║ • Parses JSON to determine scan outcome: clean / vulnerabilities_found / failed          ║
# ║ • Displays human-readable vulnerability descriptions with --desc flag                    ║
# ║ • Fails workflow if vulnerabilities detected (exit 1 on scan_status=vulnerabilities_found) ║
# ║ • Daily scheduled scan ensures fresh CVE lookups                                         ║
# ╠══════════════════════════════════════════════════════════════════════════════════════════╣
# ║ Output Artifacts                                                                         ║
# ╟──────────────────────────────────────────────────────────────────────────────────────────╢
# ║ • audit.json        │ JSON-format pip-audit scan results                                 ║
# ║ • Artifact name     │ pip-audit-results                                                  ║
# ║ • Retention         │ 30 days                                                            ║
# ║ • Upload condition  │ if: always() (uploads even on scan failure)                        ║
# ╠══════════════════════════════════════════════════════════════════════════════════════════╣
# ║ Notes                                                                                    ║
# ╟──────────────────────────────────────────────────────────────────────────────────────────╢
# ║ • Despite workflow name "OSV Scanner", this uses pip-audit (Python-specific OSV client)  ║
# ║ • pip-audit queries PyPA's OSV database (https://osv.dev) for Python CVEs                ║
# ║ • Full history fetch required for comprehensive scanning (fetch-depth: 0)                ║
# ║ • Initial pip-audit run uses continue-on-error to capture JSON output                    ║
# ║ • Workflow fails explicitly in final step if vulnerabilities found                       ║
# ║ • Complements Trivy's pip-audit job (this runs daily + on every push/PR)                 ║
# ║ • Future: pip-audit native SARIF support coming (currently uses JSON parsing)            ║
# ╚══════════════════════════════════════════════════════════════════════════════════════════╝

name: Python Dependency Vulnerability Scanner

on:
  push:
    branches: [main]
    paths-ignore:
      - "CHANGELOG.md"
      - "pyproject.toml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "CHANGELOG.md"
      - "pyproject.toml"
  schedule:
    # Run daily at 2:00 AM UTC
    - cron: "0 2 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pip-audit-scan:
    name: pip-audit Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Required for uploading SARIF results

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history for comprehensive scanning
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install package with all dependencies
        run: |
          # Install the package with all extras to get full dependency tree
          pip install -e ".[all]"

      - name: Run pip-audit vulnerability scan
        id: pip-audit
        continue-on-error: true
        run: |
          # Install pip-audit
          pip install pip-audit

          # Scan installed packages and generate SARIF
          # Exit code 0: no vulnerabilities, 1: vulnerabilities found
          pip-audit --format=json --output=audit.json || true

          # Convert to SARIF format (pip-audit native SARIF support coming soon)
          # For now, check if vulnerabilities were found
          if [ -f audit.json ]; then
            if grep -q '"vulnerabilities"' audit.json && \
               [ "$(jq '.vulnerabilities | length' audit.json 2>/dev/null || echo 0)" -gt 0 ]; then
              echo "scan_status=vulnerabilities_found" >> $GITHUB_OUTPUT
              echo "⚠ Vulnerabilities found - see output below"
              pip-audit --desc
            else
              echo "scan_status=clean" >> $GITHUB_OUTPUT
              echo "✅ No vulnerabilities found"
              pip-audit
            fi
          else
            echo "scan_status=failed" >> $GITHUB_OUTPUT
            echo "❌ Scan failed"
            exit 1
          fi
      - name: Upload audit results as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pip-audit-results
          path: audit.json
          retention-days: 30

      - name: Fail if vulnerabilities found
        if: steps.pip-audit.outputs.scan_status == 'vulnerabilities_found'
        run: |
          echo "::error::Vulnerabilities detected in dependencies"
          exit 1
