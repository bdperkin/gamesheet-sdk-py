name: OSV Dependency Vulnerability Scanner

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Run daily at 2 AM UTC
    - cron: "0 2 * * *"

permissions:
  contents: read
  security-events: write # Required for uploading SARIF results

jobs:
  osv-scan:
    name: OSV Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # Full history for comprehensive scanning
          persist-credentials: false

      - name: Install OSV Scanner
        run: |
          curl -sSL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o osv-scanner
          chmod +x osv-scanner
          sudo mv osv-scanner /usr/local/bin/

      - name: Run OSV Scanner
        id: osv-scan
        continue-on-error: true
        run: |
          # Scan current directory for lockfiles
          # Exit code 0: no vulnerabilities, 1: vulnerabilities found, 127/128: no lockfiles
          osv-scanner scan --lockfile pyproject.toml --format sarif --output-file osv-results.sarif 2>&1 | tee scan.log || true

          # Check if scan found lockfiles
          if grep -q "No package sources found" scan.log; then
            echo "scan_status=no_lockfiles" >> $GITHUB_OUTPUT
            echo "ℹ️ No lockfiles found - skipping scan"
          elif [ -f osv-results.sarif ]; then
            echo "scan_status=completed" >> $GITHUB_OUTPUT
            echo "✅ Scan completed"
          else
            echo "scan_status=failed" >> $GITHUB_OUTPUT
            echo "❌ Scan failed"
          fi

      - name: Upload SARIF results to GitHub Security
        uses: github/codeql-action/upload-sarif@df409f7d9260372bd5f19e5b04e83cb3c43714ae # v3.27.9
        if: steps.osv-scan.outputs.scan_status == 'completed'
        with:
          sarif_file: osv-results.sarif
          category: osv-scanner
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload results as artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: steps.osv-scan.outputs.scan_status == 'completed'
        with:
          name: osv-scanner-results
          path: osv-results.sarif
          retention-days: 30
