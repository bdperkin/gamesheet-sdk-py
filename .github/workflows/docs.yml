---
# Documentation Build and Deployment Pipeline
#
# Purpose:
#   Generates and validates documentation in multiple output formats (HTML, EPUB, man, PDF)
#   and deploys the HTML build to GitHub Pages when merged to main. Runs 9 parallel jobs
#   spanning build validation, quality checks, and deployment.
#
# Triggers:
#   - push: Runs on push to main branch (after PR merge)
#   - pull_request: Runs on opened, reopened, synchronize (all PR activity)
#   - push only ignores CHANGELOG.md and pyproject.toml (managed by release workflow);
#     pull_request has no paths-ignore, so every PR reports this workflow's checks
#
# Concurrency:
#   - Scoped to workflow + branch name
#   - Cancels in-progress runs ONLY for non-main branches (preserves deployment sequence)
#
# Permissions:
#   - contents: read (default for all jobs except deploy)
#   - pages: write (deploy job only, to publish to GitHub Pages)
#   - id-token: write (deploy job only, to verify deployment target)
#
# Jobs:
#   1. docs: HTML documentation build (Sphinx + Furo theme, two-pass strict mode)
#   2. docs-epub: EPUB documentation build (e-reader distribution format)
#   3. docs-man: man-page documentation build (CLI manual-page generation)
#   4. docs-pdf: PDF documentation build (requires LaTeX toolchain)
#   5. docs-lint: Python documentation issues check (sphinx-lint, etc.)
#   6. docs-linkcheck: Broken external link check (validates HTTP references)
#   7. docs-doctest: Embedded doctest examples tests (validates code examples)
#   8. docs-build: Build HTML for GitHub Pages (uploads two artifacts: regular + Pages)
#   9. docs-deploy: Deploy to GitHub Pages (only on push to main after docs-build succeeds)
#
# Architecture:
#   - Every job runs on Python 3.11 (single-version documentation build)
#   - Full git history (fetch-depth: 0) required for version detection
#   - Each job invokes sphinx-build directly through `uv run --extra docs`, so the docs
#     extra is the single source of truth for build dependencies
#   - docs-pdf installs LaTeX packages via apt (latexmk, texlive-latex-{recommended,extra})
#   - docs-build uploads both a regular artifact (for PR review/debug, 14-day retention) and
#     a Pages artifact (input to the deploy job, only created on main push)
#   - docs-deploy is gated on push to main AND needs docs-build success
#
# Outputs:
#   - Rendered documentation in HTML, EPUB, man, PDF formats
#   - GitHub Pages deployment at configured URL (accessible via environment page_url)
#   - html-docs artifact (uploaded on all runs for PR review / debug)
#   - Pages artifact (uploaded only on main push, consumed by deploy job)
#
# Related Workflows:
#   - comprehensive-tests.yml (nightly multi-OS test suite, also includes doc builds)
#   - release.yml (version bumping, triggers doc rebuild on main via push event)
#
# Configuration Files:
#   - docs/conf.py (Sphinx configuration)
#   - pyproject.toml ([tool.sphinx], [optional-dependencies.docs])
#   - Makefile (docs, docs-epub, docs-man, docs-pdf, docs-lint, docs-linkcheck, docs-doctest
#     targets mirror these jobs for local use)
#
# Maintenance Notes:
#   - PDF build requires LaTeX packages; if apt install fails, build will skip gracefully
#   - Pages deployment uses the official actions/deploy-pages action (v5.0.0)
#   - All jobs run in parallel except docs-deploy (gated by docs-build dependency)
#   - If adding a new doc format, add a parallel job here plus a matching Makefile target
name: Docs

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main
    paths-ignore:
      - CHANGELOG.md
      - pyproject.toml

permissions:
  contents: read

concurrency:
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}

jobs:
  docs:
    name: HTML documentation build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # Full history for version detection
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: '3.11'
          enable-cache: true
      - name: Run docs via uv
        run: |
          uv run --extra docs python docs/generate_api_docs.py
          uv run --extra docs sphinx-build -b html docs docs/_build/html

  docs-epub:
    name: EPUB documentation build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # Full history for version detection
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: '3.11'
          enable-cache: true
      - name: Run docs-epub via uv
        run: |
          uv run --extra docs python docs/generate_api_docs.py
          uv run --extra docs sphinx-build -b epub docs docs/_build/epub

  docs-man:
    name: man-page documentation build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # Full history for version detection
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: '3.11'
          enable-cache: true
      - name: Run docs-man via uv
        run: |
          uv run --extra docs python docs/generate_api_docs.py
          uv run --extra docs sphinx-build -b man docs docs/_build/man

  docs-pdf:
    name: PDF documentation build
    runs-on: ubuntu-latest
    steps:
      - name: Update apt cache and install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-recommended tex-gyre \
          texlive-latex-extra texlive-xetex xindy
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # Full history for version detection
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: '3.11'
          enable-cache: true
      - name: Run docs-pdf via uv
        run: |
          uv run --extra docs python docs/generate_api_docs.py
          uv run --extra docs sphinx-build -b latex docs docs/_build/latex
          make -C docs/_build/latex all-pdf

  docs-lint:
    name: Python documentation issues check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # Full history for version detection
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: '3.11'
          enable-cache: true
      - name: Run docs-lint via uv
        run: |
          uv run --extra docs python docs/generate_api_docs.py
          uv run python docs/check_api_freshness.py
          uv run --extra docs sphinx-lint docs

  docs-linkcheck:
    name: Broken external link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # Full history for version detection
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: '3.11'
          enable-cache: true
      - name: Run docs-linkcheck via uv
        run: |
          uv run --extra docs python docs/generate_api_docs.py
          uv run --extra docs sphinx-build -b linkcheck docs docs/_build/linkcheck

  docs-doctest:
    name: Embedded doctest examples tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # Full history for version detection
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: '3.11'
          enable-cache: true
      - name: Run docs-doctest via uv
        run: |
          uv run --extra docs python docs/generate_api_docs.py
          uv run --extra docs sphinx-build -b doctest docs docs/_build/doctest

  docs-build:
    name: Build HTML for GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # Full history for version detection
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: '3.11'
          enable-cache: true
      - name: Run docs via uv
        run: |
          uv run --extra docs python docs/generate_api_docs.py
          uv run --extra docs sphinx-build -b html docs docs/_build/html
      - name: Upload HTML as regular artifact (PR review / debug)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: html-docs
          path: docs/_build/html/
          retention-days: 14
      - name: Upload HTML as Pages artifact (deploy input)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: docs/_build/html

  docs-deploy:
    name: Deploy to GitHub Pages
    needs: docs-build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      id-token: write  # Verify deployment target
      pages: write  # Deploy to GitHub Pages
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy artifact to Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
