---
# Documentation Build and Deployment Pipeline
#
# Purpose:
#   Generates and validates documentation in multiple output formats (HTML, EPUB, man, PDF)
#   and deploys the HTML build to GitHub Pages when merged to main. Runs 9 parallel jobs
#   spanning build validation, quality checks, and deployment.
#
# Triggers:
#   - push: Runs on push to main branch (after PR merge)
#   - pull_request: Runs on opened, reopened, synchronize (all PR activity)
#   - Ignores changes to CHANGELOG.md and pyproject.toml (managed by release workflow)
#
# Concurrency:
#   - Scoped to workflow + branch name
#   - Cancels in-progress runs ONLY for non-main branches (preserves deployment sequence)
#
# Permissions:
#   - contents: read (default for all jobs except deploy)
#   - pages: write (deploy job only, to publish to GitHub Pages)
#   - id-token: write (deploy job only, to verify deployment target)
#
# Jobs:
#   1. docs: HTML documentation build (Sphinx + Furo theme, two-pass strict mode)
#   2. docs-epub: EPUB documentation build (e-reader distribution format)
#   3. docs-man: man-page documentation build (CLI manual-page generation)
#   4. docs-pdf: PDF documentation build (requires LaTeX toolchain)
#   5. docs-lint: Python documentation issues check (sphinx-lint, etc.)
#   6. docs-linkcheck: Broken external link check (validates HTTP references)
#   7. docs-doctest: Embedded doctest examples tests (validates code examples)
#   8. docs-build: Build HTML for GitHub Pages (uploads two artifacts: regular + Pages)
#   9. docs-deploy: Deploy to GitHub Pages (only on push to main after docs-build succeeds)
#
# Architecture:
#   - Every job runs on Python 3.11 (single-version documentation build)
#   - Full git history (fetch-depth: 0) required for version detection
#   - Each job invokes a matching tox env (docs, docs-epub, docs-man, docs-pdf, docs-lint,
#     docs-linkcheck, docs-doctest) to isolate dependencies and guarantee reproducibility
#   - docs-pdf installs LaTeX packages via apt (latexmk, texlive-latex-{recommended,extra})
#   - docs-build uploads both a regular artifact (for PR review/debug, 14-day retention) and
#     a Pages artifact (input to the deploy job, only created on main push)
#   - docs-deploy is gated on push to main AND needs docs-build success
#
# Outputs:
#   - Rendered documentation in HTML, EPUB, man, PDF formats
#   - GitHub Pages deployment at configured URL (accessible via environment page_url)
#   - html-docs artifact (uploaded on all runs for PR review / debug)
#   - Pages artifact (uploaded only on main push, consumed by deploy job)
#
# Related Workflows:
#   - comprehensive-tests.yml (nightly multi-OS test suite, also includes doc builds)
#   - release.yml (version bumping, triggers doc rebuild on main via push event)
#
# Configuration Files:
#   - docs/conf.py (Sphinx configuration)
#   - pyproject.toml ([tool.sphinx], [optional-dependencies.docs])
#   - tox.ini (docs, docs-epub, docs-man, docs-pdf, docs-lint, docs-linkcheck, docs-doctest)
#
# Maintenance Notes:
#   - PDF build requires LaTeX packages; if apt install fails, build will skip gracefully
#   - Pages deployment uses the official actions/deploy-pages action (v5.0.0)
#   - All jobs run in parallel except docs-deploy (gated by docs-build dependency)
#   - If adding a new doc format, create a matching tox env and add a parallel job here
name: Docs

on:
  push:
    branches: [main]
    paths-ignore:
      - "CHANGELOG.md"
      - "pyproject.toml"
  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore:
      - "CHANGELOG.md"
      - "pyproject.toml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  docs:
    name: HTML documentation build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # Full history for version detection
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install tox
        run: pip install tox-workdir
      - name: Run docs via tox
        run: tox -e docs

  docs-epub:
    name: EPUB documentation build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # Full history for version detection
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install tox
        run: pip install tox-workdir
      - name: Run docs-epub via tox
        run: tox -e docs-epub

  docs-man:
    name: man-page documentation build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # Full history for version detection
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install tox
        run: pip install tox-workdir
      - name: Run docs-man via tox
        run: tox -e docs-man

  docs-pdf:
    name: PDF documentation build
    runs-on: ubuntu-latest
    steps:
      - name: Update apt cache and install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-recommended tex-gyre texlive-latex-extra texlive-xetex xindy
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # Full history for version detection
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install tox
        run: pip install tox-workdir
      - name: Run docs-pdf via tox
        run: tox -e docs-pdf

  docs-lint:
    name: Python documentation issues check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # Full history for version detection
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install tox
        run: pip install tox-workdir
      - name: Run docs-lint via tox
        run: tox -e docs-lint

  docs-linkcheck:
    name: Broken external link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # Full history for version detection
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install tox
        run: pip install tox-workdir
      - name: Run docs-linkcheck via tox
        run: tox -e docs-linkcheck

  docs-doctest:
    name: Embedded doctest examples tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # Full history for version detection
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install tox
        run: pip install tox-workdir
      - name: Run docs-doctest via tox
        run: tox -e docs-doctest

  docs-build:
    name: Build HTML for GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # Full history for version detection
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install tox
        run: pip install tox-workdir
      - name: Run docs via tox
        run: tox -e docs
      - name: Upload HTML as regular artifact (PR review / debug)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: html-docs
          path: docs/_build/html/
          retention-days: 14
      - name: Upload HTML as Pages artifact (deploy input)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_build/html

  docs-deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs-build
    runs-on: ubuntu-latest
    permissions:
      pages: write # Deploy to GitHub Pages
      id-token: write # Verify deployment target
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact to Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
