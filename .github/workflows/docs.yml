name: Docs

on:
  push:
    branches: [main]
    paths-ignore:
      - "CHANGELOG.md"
      - "pyproject.toml"

  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore:
      - "CHANGELOG.md"
      - "pyproject.toml"

concurrency:
  # Pages deploys must serialize on `main`; PRs serialize per-branch.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  docs:
    name: HTML documentation build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # Full history for version detection
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install tox
        run: pip install tox-workdir
      - name: Run docs via tox
        run: tox -e docs

  docs-epub:
    name: EPUB documentation build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # Full history for version detection
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install tox
        run: pip install tox-workdir
      - name: Run docs-epub via tox
        run: tox -e docs-epub

  docs-man:
    name: man-page documentation build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # Full history for version detection
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install tox
        run: pip install tox-workdir
      - name: Run docs-man via tox
        run: tox -e docs-man

  docs-pdf:
    name: PDF documentation build
    runs-on: ubuntu-latest
    steps:
      - name: Update apt cache and install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-recommended tex-gyre texlive-latex-extra
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # Full history for version detection
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install tox
        run: pip install tox-workdir
      - name: Run docs-pdf via tox
        run: tox -e docs-pdf

  docs-lint:
    name: Python documentation issues check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # Full history for version detection
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install tox
        run: pip install tox-workdir
      - name: Run docs-lint via tox
        run: tox -e docs-lint

  docs-linkcheck:
    name: Broken external link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # Full history for version detection
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install tox
        run: pip install tox-workdir
      - name: Run docs-linkcheck via tox
        run: tox -e docs-linkcheck

  docs-doctest:
    name: Embedded doctest examples tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # Full history for version detection
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install tox
        run: pip install tox-workdir
      - name: Run docs-doctest via tox
        run: tox -e docs-doctest

  docs-build:
    name: Build HTML for GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # Full history for version detection
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install tox
        run: pip install tox-workdir
      - name: Run docs via tox
        run: tox -e docs
      - name: Upload HTML as regular artifact (PR review / debug)
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: html-docs
          path: docs/_build/html/
          retention-days: 14
      - name: Upload HTML as Pages artifact (deploy input)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@79a78bb1c49b62e66feffdce62bfb57e5d83f4ca # v5.0.0
        with:
          path: docs/_build/html

  docs-deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact to Pages
        id: deployment
        uses: actions/deploy-pages@9a7ad31e01d4de2e5e76ac15d6a42b75f6924c81 # v5.0.0
