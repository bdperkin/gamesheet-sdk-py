name: Docs

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Pages deploys must serialize on `main`; PRs serialize per-branch.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: Build & lint (HTML, EPUB, man, doctest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install tox
        run: pip install 'tox>=4.21'

      - name: Build & lint docs via tox
        run: tox -e docs,docs-epub,docs-man,docs-lint,docs-doctest

      - name: Upload HTML as regular artifact (PR review / debug)
        uses: actions/upload-artifact@v7
        with:
          name: html-docs
          path: docs/_build/html/
          retention-days: 14

      - name: Upload HTML as Pages artifact (deploy input)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  linkcheck:
    name: Link check (external, informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install 'tox>=4.21'
      - run: tox -e docs-linkcheck

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact to Pages
        id: deployment
        uses: actions/deploy-pages@v5
