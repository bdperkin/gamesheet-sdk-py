---
# ╔══════════════════════════════════════════════════════════════════════════════════════════╗
# ║ GitHub Actions Workflow                                                                  ║
# ╠══════════════════════════════════════════════════════════════════════════════════════════╣
# ║ Name      │ Workflow Security Linter (zizmor)                                            ║
# ║ Category  │ Security - GitHub Actions Workflow Security Auditing                         ║
# ║ Purpose   │ Audit GitHub Actions workflow YAML files for security vulnerabilities,       ║
# ║           │ misconfigurations, and risky patterns using zizmor security linter           ║
# ╠══════════════════════════════════════════════════════════════════════════════════════════╣
# ║ Tool      │ zizmor (GitHub Actions workflow security auditor, installed via pipx)        ║
# ║ Trigger   │ push: branches=[main], paths=[".github/workflows/**"]                        ║
# ║           │ pull_request: branches=[main], paths=[".github/workflows/**"]                ║
# ║ Runs on   │ ubuntu-latest                                                                ║
# ║ Python    │ 3.11                                                                         ║
# ╠══════════════════════════════════════════════════════════════════════════════════════════╣
# ║ Permissions                                                                              ║
# ╟──────────────────────────────────────────────────────────────────────────────────────────╢
# ║ • contents: read         │ Checkout repository                                           ║
# ║ • security-events: write │ Upload SARIF results to GitHub Security tab                   ║
# ╠══════════════════════════════════════════════════════════════════════════════════════════╣
# ║ Key Features                                                                             ║
# ╟──────────────────────────────────────────────────────────────────────────────────────────╢
# ║ • Audits all workflow YAML files in .github/workflows/ for security issues:              ║
# ║   - Script injection vulnerabilities (untrusted input in run: blocks)                    ║
# ║   - Excessive permissions (overly broad GITHUB_TOKEN scopes)                             ║
# ║   - Unpinned action versions (should use SHA256 pins, not floating tags)                 ║
# ║   - Dangerous workflow patterns (e.g., pull_request_target with code checkout)           ║
# ║   - Secret exposure risks                                                                ║
# ║ • Three-pass scan strategy:                                                              ║
# ║   1. SARIF generation (--pedantic, all findings) uploaded to GitHub Security             ║
# ║   2. Human-readable output (--pedantic, all findings) in logs (continue-on-error)        ║
# ║   3. HIGH-severity gate (FAILS workflow if high-severity issues found)                   ║
# ║ • --pedantic flag enables stricter checks beyond default rule set                        ║
# ║ • --min-severity high ensures workflow only fails on critical issues                     ║
# ╠══════════════════════════════════════════════════════════════════════════════════════════╣
# ║ Output Artifacts                                                                         ║
# ╟──────────────────────────────────────────────────────────────────────────────────────────╢
# ║ • zizmor-results.sarif │ SARIF-format audit results (all findings)                       ║
# ║ • GitHub Security tab  │ Uploaded SARIF findings (category: zizmor)                      ║
# ║ • Artifact retention   │ 30 days (zizmor-results artifact)                               ║
# ╠══════════════════════════════════════════════════════════════════════════════════════════╣
# ║ Notes                                                                                    ║
# ╟──────────────────────────────────────────────────────────────────────────────────────────╢
# ║ • zizmor installed via pipx for isolated tool environment                                ║
# ║ • Triggers only on workflow file changes (paths filter: .github/workflows/**)            ║
# ║ • Three-step scan: (1) SARIF for Security tab, (2) logs for visibility,                  ║
# ║   (3) fail on HIGH severity (allows MEDIUM/LOW/INFORMATIONAL without blocking)           ║
# ║ • SARIF upload runs if: always() to report findings even on scan failures                ║
# ║ • Complements actionlint (zizmor focuses on security, actionlint on syntax/correctness)  ║
# ║ • Exit code behavior: 0=no issues, 13+=HIGH severity found (fails step 3)                ║
# ╚══════════════════════════════════════════════════════════════════════════════════════════╝

name: Workflow Security Linter (zizmor)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zizmor:
    name: Audit GitHub Actions workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Required for uploading SARIF results

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install pipx
        run: |
          python -m pip install --upgrade pip
          python -m pip install pipx
          python -m pipx ensurepath

      - name: Install zizmor via pipx
        run: pipx install zizmor

      - name: Run zizmor audit (SARIF - all findings)
        run: |
          # Generate SARIF with all findings for GitHub Security
          # Use || true because we want to upload even if issues found
          zizmor --pedantic --format sarif .github/workflows/ > zizmor-results.sarif || true

      - name: Run zizmor audit (human-readable - all findings)
        continue-on-error: true
        run: |
          # Show all findings in logs for visibility
          echo "=== All Security Findings ==="
          zizmor --pedantic .github/workflows/ || true

      - name: Run zizmor audit (FAIL on HIGH severity only)
        run: |
          # This step FAILS the workflow if HIGH severity issues exist
          # Allows MEDIUM/LOW/INFORMATIONAL findings without blocking
          echo "=== Checking for HIGH severity issues ==="
          zizmor --pedantic --min-severity high .github/workflows/

          # Exit code 0: no HIGH issues (success)
          # Exit code 13+: HIGH issues found (FAILS workflow)

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        if: always()
        with:
          sarif_file: zizmor-results.sarif
          category: zizmor
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload results as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: zizmor-results
          path: zizmor-results.sarif
          retention-days: 30
