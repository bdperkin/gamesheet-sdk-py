name: Workflow Security Linter (zizmor)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"

permissions:
  contents: read
  security-events: write # Required for uploading SARIF results

jobs:
  zizmor:
    name: Audit GitHub Actions workflows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: Install pipx
        run: |
          python -m pip install --upgrade pip
          python -m pip install pipx
          python -m pipx ensurepath

      - name: Install zizmor via pipx
        run: pipx install zizmor

      - name: Run zizmor audit
        continue-on-error: true # Don't fail build on findings
        run: |
          zizmor --format sarif .github/workflows/ > zizmor-results.sarif || true
          # Also output human-readable report
          zizmor .github/workflows/ || true

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@df409f7d9260372bd5f19e5b04e83cb3c43714ae # v3.27.9
        if: always()
        with:
          sarif_file: zizmor-results.sarif
          category: zizmor
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload results as artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: zizmor-results
          path: zizmor-results.sarif
          retention-days: 30
