---
# ==============================================================================
# Security, Metrics & Complexity
# ==============================================================================
# Purpose: Scans code for security vulnerabilities and measures code complexity
# and maintainability metrics. Enforces complexity gates and tracks code health.
#
# Triggers:
#   - push to main branch (skip if only CHANGELOG/version changes)
#   - pull_request (opened, reopened, synchronize)
#   - Concurrency: Cancels previous runs for the same branch
#
# Jobs: 5 tools across Python 3.11-3.14 (20 total runs)
#   - semgrep: Static analysis to find bugs and security vulnerabilities
#   - xenon: Complexity gate (max cc <= 5 per block, enforced in pre-commit)
#   - radon (4 analyzers):
#     - cc: Cyclomatic complexity analysis
#     - raw: Raw metrics (LOC, LLOC, SLOC, comments, blanks)
#     - mi: Maintainability index calculation
#     - hal: Halstead complexity metrics
#
# Special Notes:
#   - xenon enforces --max-absolute=A --max-modules=A --max-average=B
#   - Project average complexity: 2.43 (all blocks at grade A)
#   - Extract helper functions when approaching 4+ conditionals in a block
#
# Each job runs: uv run --extra [tool] [tool]
# ==============================================================================
name: Security, Metrics & Complexity

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main
    paths-ignore:
      - CHANGELOG.md
      - pyproject.toml

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}

jobs:
  semgrep:
    name: semgrep (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Run semgrep via uv
        run: uv run --extra semgrep semgrep --config auto .
  radon:
    name: radon ${{ matrix.analyzer }} analysis (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        analyzer:
          - cc
          - raw
          - mi
          - hal
        python-version:
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Run radon-${{ matrix.analyzer }} via uv
        run: uv run --extra radon radon "$RADON_ANALYZER" .
        env:
          RADON_ANALYZER: ${{ matrix.analyzer }}
