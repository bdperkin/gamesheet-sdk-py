---
# ==============================================================================
# Security, Metrics & Complexity
# ==============================================================================
# Purpose: Scans code for security vulnerabilities and measures code complexity
# and maintainability metrics. Enforces complexity gates and tracks code health.
#
# Triggers:
#   - push to main branch (skip if only CHANGELOG/version changes)
#   - pull_request (opened, reopened, synchronize)
#   - Concurrency: Cancels previous runs for the same branch
#
# Jobs: 5 tools across Python 3.11-3.14 (20 total runs)
#   - bandit: Security linter scanning for common Python security issues
#   - xenon: Complexity gate (max cc <= 5 per block, enforced in pre-commit)
#   - radon (4 analyzers):
#     - cc: Cyclomatic complexity analysis
#     - raw: Raw metrics (LOC, LLOC, SLOC, comments, blanks)
#     - mi: Maintainability index calculation
#     - hal: Halstead complexity metrics
#
# Special Notes:
#   - xenon enforces --max-absolute=A --max-modules=A --max-average=B
#   - Project average complexity: 2.43 (all blocks at grade A)
#   - Extract helper functions when approaching 4+ conditionals in a block
#
# Each job runs: tox -e [tool]
# ==============================================================================
name: Security, Metrics & Complexity

on:
  push:
    branches: [main]
    paths-ignore:
      - "CHANGELOG.md"
      - "pyproject.toml"
  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore:
      - "CHANGELOG.md"
      - "pyproject.toml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bandit:
    name: bandit (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install tox
        run: pip install tox-workdir
      - name: Run bandit via tox
        run: tox -e bandit

  radon:
    name: radon ${{ matrix.analyzer }} analysis (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        analyzer:
          - "cc"
          - "raw"
          - "mi"
          - "hal"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install tox
        run: pip install tox-workdir
      - name: Run radon-${{ matrix.analyzer }} via tox
        env:
          ANALYZER: ${{ matrix.analyzer }}
        run: tox -e radon-${ANALYZER}
