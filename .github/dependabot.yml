version: 2
updates:
  # Python dependencies (pyproject.toml — main + optional-deps)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    groups:
      runtime-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development

  # GitHub Actions versions in .github/workflows/*.yml
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        patterns:
          - "*"
