---
# ==============================================================================
# Pre-Commit Hook Configuration
# ==============================================================================
# Fast, local checks that run automatically before every git commit command
# See https://pre-commit.com for details

# Configuration for https://pre-commit.ci
# Automates pre-commit hook version updates via GitHub integration
ci:
  # Python version for pre-commit.ci service
  # Using 3.11 (our minimum supported version) maximizes tool compatibility
  python_version: "3.11"

  # Auto-update hook versions weekly (every Monday)
  autoupdate_schedule: weekly
  autoupdate_commit_msg: "chore(deps): Update pre-commit hooks"

  # Auto-fix issues when possible (formatting, trailing whitespace, etc.)
  autofix_commit_msg: "style: Auto-fixes from pre-commit.ci"
  autofix_prs: true

  # Skip certain hooks in CI (if needed). Skipped hooks still run in
  # GitHub Actions, where there is no 250 MiB tier limit on hook envs
  # and `python -m venv` works:
  # - pyright: deps don't fit pre-commit.ci's tier
  # - flake8: [flake8-plugins] (fastapi, flake8-django, …)
  #   exceeds 250 MiB
  # - pyroma: introspects via `python -m build`, which calls
  #   `python -m venv`; pre-commit.ci's bundled Python lacks
  #   `ensurepip`, so the build env can't bootstrap pip
  skip:
    - pyright
    - flake8
    - pyroma

  # Require all hooks to pass before autoupdate
  # Empty string = create PR for review (recommended)
  # Setting to 'main' would auto-merge (NOT recommended)
  autoupdate_branch: ""

default_language_version:
  python: python3.11

default_stages:
  - pre-commit
  - pre-push

fail_fast: true

repos:
  # ------------------------------------------------------------------------------
  # Recommended meta hooks
  # ------------------------------------------------------------------------------
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
      - id: identity

  # ------------------------------------------------------------------------------
  ## Out-of-the-box Global File Sanity Checks
  # ------------------------------------------------------------------------------

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files # check for added large files
      - id: check-ast # check python ast
      - id: check-builtin-literals # check builtin type constructor use
      - id: check-case-conflict # check for case conflicts
      - id: check-docstring-first # check docstring is first (deprecated)
      - id: check-illegal-windows-names # check illegal windows names
      - id: check-json # check json
      - id: check-shebang-scripts-are-executable # check that scripts with shebangs are executable
      - id: pretty-format-json # pretty format json
      - id: check-merge-conflict # check for merge conflicts
      - id: check-toml # check toml
      - id: check-vcs-permalinks # check vcs permalinks
      - id: check-yaml # check yaml
      - id: debug-statements # debug statements (python)
      - id: destroyed-symlinks # detect destroyed symlinks
      - id: detect-private-key # detect private key
      - id: end-of-file-fixer # fix end of files
      - id: fix-byte-order-marker # fix utf-8 byte order marker
      - id: forbid-submodules # forbid submodules
      - id: mixed-line-ending # mixed line ending
      - id: name-tests-test # python tests naming
        args: ["--pytest-test-first"]
      - id: no-commit-to-branch # don't commit to branch
      - id: trailing-whitespace # trim trailing whitespace

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-blanket-noqa # check blanket noqa
      - id: python-check-blanket-type-ignore # check blanket type ignore
      - id: python-check-mock-methods # check for not-real mock methods
      - id: python-no-eval # check for eval()
      - id: python-no-log-warn # use logger.warning(
      - id: python-use-type-annotations # type annotations not comments
      - id: text-unicode-replacement-char # no unicode replacement chars

  # ------------------------------------------------------------------------------
  ### Configuration File Linters & Formatters
  # ------------------------------------------------------------------------------

  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.6.1
    hooks:
      - id: editorconfig-checker # Check .editorconfig rules
      - id: editorconfig-checker-system # Check .editorconfig rules
        language: python
        additional_dependencies:
          - gamesheet-sdk-py[editorconfig-checker]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint # yamllint

  # ------------------------------------------------------------------------------
  ### Documentation & Markdown Tools
  # ------------------------------------------------------------------------------

  - repo: https://github.com/jackdewinter/pymarkdown
    rev: v0.9.37
    hooks:
      - id: pymarkdown # PyMarkdown

  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat # mdformat
        language_version: python3.13
        additional_dependencies:
          - gamesheet-sdk-py[mdformat]
          - mdformat-pyproject

  # ------------------------------------------------------------------------------
  ### Configuration File Linters & Formatters
  # ------------------------------------------------------------------------------

  - repo: https://github.com/tox-dev/tox-ini-fmt
    rev: 1.7.1
    hooks:
      - id: tox-ini-fmt # tox-ini-fmt

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.23.0
    hooks:
      - id: pyproject-fmt # pyproject-fmt

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.25
    hooks:
      - id: validate-pyproject # Validate pyproject.toml

  - repo: https://github.com/regebro/pyroma
    rev: 5.0.1
    hooks:
      - id: pyroma # Check package with Pyroma
        additional_dependencies:
          - gamesheet-sdk-py[pyroma]

  # ------------------------------------------------------------------------------
  ### Code Style & Formatting (Automated Fixers)
  # ------------------------------------------------------------------------------

  - repo: https://github.com/asottile/add-trailing-comma
    rev: v4.0.0
    hooks:
      - id: add-trailing-comma # Add trailing commas

  - repo: https://github.com/marcogorelli/absolufy-imports
    rev: v0.3.1
    hooks:
      - id: absolufy-imports # absolufy-imports

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade # pyupgrade

  - repo: https://github.com/pycqa/isort
    rev: 8.0.1
    hooks:
      - id: isort # isort

  - repo: https://github.com/bwhmather/ssort
    rev: 0.16.0
    hooks:
      - id: ssort # ssort

  - repo: https://github.com/hhatto/autopep8
    rev: v2.3.2
    hooks:
      - id: autopep8 # autopep8

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black # black
      - id: black-jupyter # black-jupyter

  # ------------------------------------------------------------------------------
  ### Code Cleaners & Dead Code Detectors
  # ------------------------------------------------------------------------------

  - repo: https://github.com/hakancelikdev/unimport
    rev: 1.4.0
    hooks:
      - id: unimport # unimport
        language_version: python3.11

  - repo: https://github.com/pycqa/autoflake
    rev: v2.3.3
    hooks:
      - id: autoflake # autoflake

  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.16
    hooks:
      - id: vulture # vulture
        args: ["."]

  - repo: https://github.com/osprey-oss/deptry
    rev: 0.25.1
    hooks:
      - id: deptry # deptry
        language: python
        additional_dependencies:
          - gamesheet-sdk-py[deptry,pytest,type-stubs]

  # ------------------------------------------------------------------------------
  ### Documentation & Docstring Tools
  # ------------------------------------------------------------------------------

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell # codespell

  - repo: https://github.com/asottile/blacken-docs
    rev: 1.20.0
    hooks:
      - id: blacken-docs # blacken-docs

  - repo: https://github.com/pycqa/docformatter
    rev: v1.7.8
    hooks:
      - id: docformatter # docformatter

  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
      - id: interrogate # interrogate
        pass_filenames: false

  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle # pydocstyle

  # ------------------------------------------------------------------------------
  ### Code Quality Linters & Static Analysis
  # ------------------------------------------------------------------------------

  - repo: https://github.com/princetonuniversity/blocklint
    rev: v0.3.0
    hooks:
      - id: blocklint # blocklint

  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8 # flake8
        additional_dependencies:
          - flake8-pyproject
          - gamesheet-sdk-py[flake8,flake8-plugins,pylint]

  - repo: https://github.com/dosisod/refurb
    rev: v2.3.1
    hooks:
      - id: refurb # refurb
        additional_dependencies:
          - pydantic

  - repo: https://github.com/pylint-dev/pylint
    rev: v4.0.5
    hooks:
      - id: pylint # pylint
        additional_dependencies:
          - gamesheet-sdk-py[pylint,pytest]
          - pylint-per-file-ignores
          - rich-click

  - repo: https://github.com/facebook/pyrefly-pre-commit
    rev: 1.0.0
    hooks:
      - id: pyrefly-check # pyrefly check
        additional_dependencies:
          - gamesheet-sdk-py[pyrefly,pytest]
          - rich-click

  # ------------------------------------------------------------------------------
  ### Security, Metrics & Complexity
  # ------------------------------------------------------------------------------

  - repo: https://github.com/pycqa/bandit
    rev: 1.9.4
    hooks:
      - id: bandit # bandit
        args: ["-c", "pyproject.toml", "-r"]

  - repo: https://github.com/rubik/xenon
    rev: v0.9.3
    hooks:
      - id: xenon # Xenon

  # ------------------------------------------------------------------------------
  ### Type Checkers
  # ------------------------------------------------------------------------------

  - repo: https://github.com/robertcraigie/pyright-python
    rev: v1.1.410
    hooks:
      - id: pyright # pyright
        additional_dependencies:
          - gamesheet-sdk-py[pyright,pytest]
          - rich-click

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy # mypy
        additional_dependencies:
          - gamesheet-sdk-py[mypy,pytest,type-stubs]
          - rich-click

  # ------------------------------------------------------------------------------
  ## Out-of-the-box Pre-Commit Hook Updates
  # ------------------------------------------------------------------------------

  - repo: https://github.com/pre-commit/sync-pre-commit-deps
    rev: v0.0.4
    hooks:
      - id: sync-pre-commit-deps # sync-pre-commit-deps
