# See https://pre-commit.com for details
# See https://pre-commit.ci   for the hosted runner
ci:
  autofix_prs: true
  autoupdate_schedule: weekly
  autoupdate_commit_msg: "chore(deps): pre-commit autoupdate"

repos:
  # ----- General file hygiene -----------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: fix-byte-order-marker
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-case-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: forbid-new-submodules
      - id: detect-private-key
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: pretty-format-json
        args: ["--autofix", "--indent=2", "--no-sort-keys"]
      - id: debug-statements
      - id: name-tests-test
        args: ["--pytest-test-first"]

  # ----- Markdown formatting ------------------------------------------------
  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm

  # ----- YAML linting -------------------------------------------------------
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ["-d", "relaxed"]

  # ----- pyproject.toml validation -----------------------------------------
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.25
    hooks:
      - id: validate-pyproject

  # ----- .editorconfig compliance -------------------------------------------
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.6.1
    hooks:
      - id: editorconfig-checker

  # ----- Spelling -----------------------------------------------------------
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli

  # ----- Python: modernize syntax ------------------------------------------
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: ["--py311-plus"]

  # ----- Python: import sorting --------------------------------------------
  - repo: https://github.com/pycqa/isort
    rev: 9.0.0a3
    hooks:
      - id: isort

  # ----- Python: formatting ------------------------------------------------
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        language_version: python3

  # ----- Python: linting ---------------------------------------------------
  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        additional_dependencies: ["Flake8-pyproject>=1.2"]

  # ----- Python: security ---------------------------------------------------
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]

  # ----- Python: type checking (local hook because pre-commit/mirrors-mypy
  #       currently tags ahead of the upstream mypy releases on PyPI) ------
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: python
        types: [python]
        pass_filenames: false
        args: ["--strict", "src"]
        additional_dependencies:
          - "mypy>=1.10"
          - "types-requests>=2.32"

  # ----- Python: pylint (local hook; project runtime deps duplicated here
  #       so pylint can resolve imports in the isolated pre-commit venv) ----
  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: pylint
        language: python
        types: [python]
        require_serial: true
        pass_filenames: false
        args: ["src", "tests"]
        additional_dependencies:
          - "pylint>=4.0"
          - "requests>=2.32"
          - "beautifulsoup4>=4.12"
          - "playwright>=1.45"
          - "lxml>=5.2"
          - "pydantic>=2.7"
          - "click>=8.1"
