---
# NOTICE: DO NOT EDIT THIS FILE!
# This file is managed by './tools/genprecommitconfig'
# Modifications should be made in '.genprecommitconfig.yaml'

# ==============================================================================
# Pre-Commit Hook Configuration
# ==============================================================================
# Fast, local checks that run automatically before every git commit command.
# See https://pre-commit.com for documentation and hook configuration options.
# ==============================================================================

# ==============================================================================
# Pre-commit.ci Service Configuration
# ==============================================================================
# Configuration for https://pre-commit.ci
# Automates pre-commit hook version updates via GitHub integration.
# ==============================================================================

ci:
  # The Git commit message used when autofixing code.
  autofix_commit_msg: "style: Auto-fixes from pre-commit.ci"
  # Automatically pushes formatting fixes back to the PR branch.
  autofix_prs: true
  # Branch to send autoupdate PRs to (empty string = default branch).
  autoupdate_branch: ""
  # The Git commit message used when updating hook tags.
  autoupdate_commit_msg: "chore(deps): Update pre-commit hooks"
  # Frequency of dependency updates (weekly, monthly, quarterly).
  autoupdate_schedule: weekly
  # Whether to recursively check out Git submodules in the CI environment.
  submodules: false
  # List of hook ids to skip only in CI (useful for heavy/slow local scripts).
  skip:
    - identity
    - pyroma
    - semgrep-ci
    - ty

# ==============================================================================
# Global Defaults
# ==============================================================================

# Maps languages to precise runtime versions (e.g., python: python3.11).
default_language_version:
  python: python3.11

# Restricts hooks to specific Git stages (e.g., [commit, push]).
default_stages:
  - pre-commit
  - pre-push

# If true, aborts the entire execution run after the first failed hook.
fail_fast: true

# ==============================================================================
# Hook Repositories
# ==============================================================================
# NOTE: Many hooks use `additional_dependencies: [gamesheet-sdk-py[<extras>]]`
# to pull runtime deps into the isolated hook venv. This pattern consolidates
# all tool dependencies in pyproject.toml's optional-dependencies groups as
# the single source of truth.
# ==============================================================================

repos:

  # ----------------------------------------------------------------------------
  # Hook Management
  # ----------------------------------------------------------------------------

  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
      - id: identity

  - repo: https://github.com/pre-commit/sync-pre-commit-deps
    rev: v0.0.5
    hooks:
      - id: sync-pre-commit-deps
        name: sync-pre-commit-deps
        description: Sync pre-commit hook dependencies based on other installed hooks
        entry: sync-pre-commit-deps
        language: python
        language_version: python3
        files: ^\.pre-commit-config.yaml$

  # ----------------------------------------------------------------------------
  # Lockfile Synchronization
  # ----------------------------------------------------------------------------

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.3
    hooks:
      - id: uv-lock
        name: uv-lock
        description: Automatically run "uv lock" on your project dependencies
        entry: uv lock
        language: python
        files: ^(uv\.lock|pyproject\.toml|uv\.toml)$
        args: []
        pass_filenames: false
        additional_dependencies: []
        minimum_pre_commit_version: 2.9.2
      - id: uv-export
        name: uv-export
        description: Automatically run "uv export" on your project dependencies
        entry: uv export
        language: python
        files: ^uv\.lock$
        args:
          - --frozen
          - --output-file=requirements.txt
          - --quiet
        pass_filenames: false
        additional_dependencies: []
        minimum_pre_commit_version: 2.9.2
        stages:
          - manual
      - id: uv-sync
        name: uv-sync
        description: Automatically run "uv sync" on your repository after a checkout, pull or rebase
        entry: uv sync --no-active
        args:
          - --locked
        language: python
        always_run: true
        pass_filenames: false
        stages:
          - post-checkout
          - post-merge
          - post-rewrite
        minimum_pre_commit_version: 2.9.2
      - id: uv-audit
        name: uv-audit
        description: Automatically run "uv audit" on your project dependencies
        entry: uv audit
        language: python
        files: ^(uv\.lock|pyproject\.toml|uv\.toml)$
        args: []
        pass_filenames: false
        additional_dependencies: []
        minimum_pre_commit_version: 2.9.2
        stages:
          - manual

  # ----------------------------------------------------------------------------
  # Low-level Checks
  # ----------------------------------------------------------------------------

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        name: check for added large files
        description: prevents giant files from being committed.
        entry: check-added-large-files
        language: python
        stages:
          - pre-commit
          - pre-push
          - manual
        minimum_pre_commit_version: 3.2.0
        exclude: ^uv\.lock$
      - id: check-ast
        name: check python ast
        description: simply checks whether the files parse as valid python.
        entry: check-ast
        language: python
        types:
          - python
      - id: check-builtin-literals
        name: check builtin type constructor use
        description: requires literal syntax when initializing empty or zero python builtin types.
        entry: check-builtin-literals
        language: python
        types:
          - python
      - id: check-case-conflict
        name: check for case conflicts
        description: checks for files that would conflict in case-insensitive filesystems.
        entry: check-case-conflict
        language: python
      - id: check-docstring-first
        name: check docstring is first
        description: checks a common error of defining a docstring after code.
        entry: check-docstring-first
        language: python
        types:
          - python
      - id: check-executables-have-shebangs
        name: check that executables have shebangs
        description: ensures that (non-binary) executables have a shebang.
        entry: check-executables-have-shebangs
        language: python
        types:
          - text
          - executable
        stages:
          - pre-commit
          - pre-push
          - manual
        minimum_pre_commit_version: 3.2.0
      - id: check-illegal-windows-names
        name: check illegal windows names
        entry: Illegal Windows filenames detected
        language: fail
        files: (?i)((^|/)(CON|PRN|AUX|NUL|COM[\d¹²³]|LPT[\d¹²³])(\.|/|$)|[<>:\"\\|?*\x00-\x1F]|/[^/]*[\.\s]/|[^/]*[\.\s]$)
      - id: check-json
        name: check json
        description: checks json files for parseable syntax.
        entry: check-json
        language: python
        types:
          - json
      - id: check-shebang-scripts-are-executable
        name: check that scripts with shebangs are executable
        description: ensures that (non-binary) files with a shebang are executable.
        entry: check-shebang-scripts-are-executable
        language: python
        types:
          - text
        stages:
          - pre-commit
          - pre-push
          - manual
        minimum_pre_commit_version: 3.2.0
      - id: pretty-format-json
        name: pretty format json
        description: sets a standard for formatting json files.
        entry: pretty-format-json
        language: python
        types:
          - json
        args:
          - --autofix
          - --no-sort-keys
      - id: check-merge-conflict
        name: check for merge conflicts
        description: checks for files that contain merge conflict strings.
        entry: check-merge-conflict
        language: python
        types:
          - text
      - id: check-toml
        name: check toml
        description: checks toml files for parseable syntax.
        entry: check-toml
        language: python
        types:
          - toml
      - id: check-vcs-permalinks
        name: check vcs permalinks
        description: ensures that links to vcs websites are permalinks.
        entry: check-vcs-permalinks
        language: python
        types:
          - text
      - id: check-yaml
        name: check yaml
        description: checks yaml files for parseable syntax.
        entry: check-yaml
        language: python
        types:
          - yaml
      - id: debug-statements
        name: debug statements (python)
        description: checks for debugger imports and py37+ `breakpoint()` calls in python source.
        entry: debug-statement-hook
        language: python
        types:
          - python
      - id: destroyed-symlinks
        name: detect destroyed symlinks
        description: detects symlinks which are changed to regular files with a content of a path which that symlink
          was pointing to.
        entry: destroyed-symlinks
        language: python
        types:
          - file
        stages:
          - pre-commit
          - pre-push
          - manual
      - id: detect-aws-credentials
        name: detect aws credentials
        description: detects *your* aws credentials from the aws cli credentials file.
        entry: detect-aws-credentials
        language: python
        types:
          - text
        args:
          - --allow-missing-credentials
      - id: detect-private-key
        name: detect private key
        description: detects the presence of private keys.
        entry: detect-private-key
        language: python
        types:
          - text
      - id: end-of-file-fixer
        name: fix end of files
        description: ensures that a file is either empty, or ends with one newline.
        entry: end-of-file-fixer
        language: python
        types:
          - text
        stages:
          - pre-commit
          - pre-push
          - manual
        minimum_pre_commit_version: 3.2.0
      - id: file-contents-sorter
        name: file contents sorter
        description: sorts the lines in specified files (defaults to alphabetical). you must provide list of target
          files as input in your .pre-commit-config.yaml file.
        entry: file-contents-sorter
        language: python
        files: ^custom-dictionary\.txt$
      - id: fix-byte-order-marker
        name: fix utf-8 byte order marker
        description: removes utf-8 byte order marker.
        entry: fix-byte-order-marker
        language: python
        types:
          - text
      - id: forbid-submodules
        name: forbid submodules
        description: forbids any submodules in the repository
        language: fail
        entry: "submodules are not allowed in this repository:"
        types:
          - directory
      - id: mixed-line-ending
        name: mixed line ending
        description: replaces or checks mixed line ending.
        entry: mixed-line-ending
        language: python
        types:
          - text
      - id: name-tests-test
        name: python tests naming
        description: verifies that test files are named correctly.
        entry: name-tests-test
        language: python
        files: (^|/)tests/.+\.py$
        exclude: ^tests/(cli/roster_helpers|fixtures/constants|helpers/cli|helpers/constants|helpers/endpoints|helpers/mocks|helpers/payloads)\.py$
        args:
          - --pytest-test-first
      - id: no-commit-to-branch
        name: don't commit to branch
        entry: no-commit-to-branch
        language: python
        pass_filenames: false
        always_run: true
      - id: trailing-whitespace
        name: trim trailing whitespace
        description: trims trailing whitespace.
        entry: trailing-whitespace-fixer
        language: python
        types:
          - text
        stages:
          - pre-commit
          - pre-push
          - manual
        minimum_pre_commit_version: 3.2.0

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-blanket-noqa
        name: check blanket noqa
        description: 'Enforce that `noqa` annotations always occur with specific codes. Sample annotations: `# noqa:
          F401`, `# noqa: F401,W203`'
        entry: "(?i)# noqa(?!: )"
        language: pygrep
        types:
          - python
      - id: python-check-blanket-type-ignore
        name: check blanket type ignore
        description: 'Enforce that `# type: ignore` annotations always occur with specific codes. Sample annotations:
          `# type: ignore[attr-defined]`, `# type: ignore[attr-defined, name-defined]`'
        entry: '# type:? *ignore(?!\[|\w)'
        language: pygrep
        types:
          - python
      - id: python-check-mock-methods
        name: check for not-real mock methods
        description: >-
          Prevent common mistakes of `assert mck.not_called()`, `assert mck.called_once_with(...)`
          and `mck.assert_called`.
        language: pygrep
        entry: >
          (?x)(
              assert .*\.(
                  not_called|
                  called_
              )|
              # ''.join(rf'(?<!\b{s})' for s in dir(mock) if s.endswith('Mock')))
              (?<!\bAsyncMock)(?<!\bMagicMock)(?<!\bMock)(?<!\bNonCallableMagicMock)(?<!\bNonCallableMock)(?<!\bPropertyMock)
              \.assert_(
                  any_call|
                  called|
                  called_once|
                  called_once_with|
                  called_with|
                  has_calls|
                  not_called
              )($|[^(\w])
          )
        types:
          - python
      - id: python-no-eval
        name: check for eval()
        description: A quick check for the `eval()` built-in function
        entry: \beval\(
        language: pygrep
        types:
          - python
      - id: python-no-log-warn
        name: use logger.warning(
        description: A quick check for the deprecated `.warn()` method of python loggers
        entry: (?<!warnings)\.warn\(
        language: pygrep
        types:
          - python
      - id: python-use-type-annotations
        name: type annotations not comments
        description: Enforce that python3.6+ type annotations are used instead of type comments
        entry: "# type(?!: *ignore([^a-zA-Z0-9]|$))"
        language: pygrep
        types:
          - python
      - id: rst-backticks
        name: rst ``code`` is two backticks
        description: Detect common mistake of using single backticks when writing rst
        entry: ^(?!    ).*(^| )`[^`]+`([^_]|$)
        language: pygrep
        types:
          - rst
      - id: rst-directive-colons
        name: rst directives end with two colons
        description: Detect mistake of rst directive not ending with double colon or space before the double colon
        entry: ^\s*\.\. [a-z]+(| | :):$
        language: pygrep
        types:
          - rst
      - id: rst-inline-touching-normal
        name: rst ``inline code`` next to normal text
        description: Detect mistake of inline code touching normal text in rst
        entry: \w``\w
        language: pygrep
        types:
          - rst
      - id: text-unicode-replacement-char
        name: no unicode replacement chars
        description: Forbid files which have a UTF-8 Unicode replacement character
        entry: �
        language: pygrep
        types:
          - text
        exclude: ^\.pre-commit-config\.yaml$

  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.8.0
    hooks:
      - id: editorconfig-checker
        name: Check .editorconfig rules
        description: '`editorconfig-checker` is a tool to check if your files consider your .editorconfig-rules.'
        entry: ec
        language: python
        types:
          - text
        require_serial: true

  # ----------------------------------------------------------------------------
  # Configuration Validation
  # ----------------------------------------------------------------------------

  - repo: https://github.com/jsh9/format-json
    rev: 0.1.2
    hooks:
      - id: format-json
        name: Format JSON files
        description: Formats JSON files to some pre-configured style
        entry: format-json
        language: python
        types:
          - json
        exclude_types:
          - jupyter
        args:
          - --autofix
          - --indent
          - "2"

  - repo: https://github.com/lyz-code/yamlfix
    rev: 1.19.1
    hooks:
      - id: yamlfix
        name: yamlfix
        entry: yamlfix
        language: python
        language_version: python3
        types:
          - yaml

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        name: yamllint
        description: This hook runs yamllint.
        entry: yamllint
        language: python
        types:
          - file
          - yaml

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.27.0
    hooks:
      - id: pyproject-fmt
        name: pyproject-fmt
        description: ""
        entry: pyproject-fmt
        language: python
        files: (^|/)pyproject\.toml$
        args: []
        require_serial: false
        additional_dependencies: []
        minimum_pre_commit_version: "0"

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.25
    hooks:
      - id: validate-pyproject
        name: Validate pyproject.toml
        description: >
          Validation library for a simple check on pyproject.toml,
          including optional dependencies
        language: python
        files: ^pyproject.toml$
        entry: validate-pyproject
        additional_dependencies:
          - .[all]

  - repo: https://github.com/regebro/pyroma
    rev: 5.0.1
    hooks:
      - id: pyroma
        name: Check package with Pyroma
        description: Check how well a Python package conforms to best practices.
        entry: pyroma
        args:
          - -d
          - --min=10
          - .
        language: python
        pass_filenames: false
        always_run: true

  # ----------------------------------------------------------------------------
  # Markdown Formatting
  # ----------------------------------------------------------------------------

  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        name: mdformat
        description: CommonMark compliant Markdown formatter
        entry: mdformat
        language: python
        types:
          - markdown
        minimum_pre_commit_version: 1.0.0
        additional_dependencies:
          - gamesheet-sdk-py[mdformat]

  - repo: https://github.com/jsh9/markdown-heading-numbering
    rev: 0.1.1
    hooks:
      - id: markdown-heading-numbering
        name: markdown heading numbering
        description: Add hierarchical numbering to Markdown headings.
        entry: markdown-heading-numbering
        language: python
        language_version: python3
        types:
          - markdown
        exclude: ^CHANGELOG\.md$

  - repo: https://github.com/jsh9/markdown-toc-creator
    rev: 0.1.3
    hooks:
      - id: markdown-toc-creator
        name: markdown-toc-creator
        description: Create table of contents for markdown files
        entry: markdown-toc-creator
        language: python
        files: \.(md|mdown|markdown)$

  - repo: https://github.com/jackdewinter/pymarkdown
    rev: v0.9.39
    hooks:
      - id: pymarkdown
        name: PyMarkdown
        description: PyMarkdown - GitHub Flavored Markdown and CommonMark Compliant Linter
        language: python
        language_version: python3
        entry: pymarkdown
        args:
          - scan
        types:
          - markdown

  # ----------------------------------------------------------------------------
  # Secret and Vulnerability Scans
  # ----------------------------------------------------------------------------

  - repo: https://github.com/yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: Detect secrets
        description: Detects high entropy strings that are likely to be passwords.
        entry: detect-secrets-hook
        language: python
        files: .*

  - repo: https://github.com/semgrep/pre-commit
    rev: v1.172.0
    hooks:
      - id: semgrep-ci
        name: semgrep
        entry: semgrep
        language: python
        pass_filenames: false
        args:
          - ci
          - --dry-run
          - --baseline-commit
          - HEAD

  # ----------------------------------------------------------------------------
  # Python Formatting
  # ----------------------------------------------------------------------------

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        name: ruff check
        description: Run "ruff check" for extremely fast Python linting
        entry: ruff check --force-exclude
        language: python
        types_or:
          - python
          - pyi
          - jupyter
        args:
          - --fix
        require_serial: true
        additional_dependencies: []
        minimum_pre_commit_version: 2.9.2
      - id: ruff-format
        name: ruff format
        description: Run "ruff format" for extremely fast Python formatting
        entry: ruff format --force-exclude
        language: python
        types_or:
          - python
          - pyi
          - jupyter
        args: []
        require_serial: true
        additional_dependencies: []
        minimum_pre_commit_version: 2.9.2

  # ----------------------------------------------------------------------------
  # Code Quality
  # ----------------------------------------------------------------------------

  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.16
    hooks:
      - id: vulture
        name: vulture
        language: python
        entry: vulture
        description: Find unused Python code.
        types:
          - python
        pass_filenames: false
        require_serial: true

  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
      - id: interrogate
        name: interrogate
        description: interrogate your code base for missing docstrings
        entry: interrogate
        language: python
        language_version: python3
        types:
          - python
        require_serial: true
        pass_filenames: false

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        name: codespell
        description: Checks for common misspellings in text files.
        entry: codespell
        language: python
        types:
          - text

  - repo: https://github.com/princetonuniversity/blocklint
    rev: v0.3.0
    hooks:
      - id: blocklint
        name: blocklint
        description: '`blocklint` is a command-line utility for inclusive language highlighting.'
        entry: blocklint
        language: python
        types:
          - text

  # ----------------------------------------------------------------------------
  # Dependencies and Complexity Metrics
  # ----------------------------------------------------------------------------

  - repo: https://github.com/osprey-oss/deptry
    rev: 0.25.1
    hooks:
      - id: deptry
        name: deptry
        description: deptry is a command line tool to check for issues with dependencies in a Python project, such
          as unused or missing dependencies.
        entry: deptry .
        language: python
        always_run: true
        pass_filenames: false
        additional_dependencies:
          - gamesheet-sdk-py[deptry]

  - repo: https://github.com/rubik/xenon
    rev: v0.9.3
    hooks:
      - id: xenon
        name: Xenon
        description: Monitoring tool based on Radon
        entry: xenon
        language: python
        types:
          - python

  # ----------------------------------------------------------------------------
  # Static Type Checks
  # ----------------------------------------------------------------------------

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.69
    hooks:
      - id: ty
        name: ty
        description: Run "ty" for extremely fast Python type checking
        entry: uv check --quiet --preview-features=check-command --ty-version=0.0.69
        language: python
        types_or:
          - python
          - pyi
          - jupyter
        args:
          - --fix
          - --extra
          - tools
        pass_filenames: false
        always_run: true
        require_serial: true
        additional_dependencies: []
        minimum_pre_commit_version: 2.9.2

  # ----------------------------------------------------------------------------
  # Commit Standards
  # ----------------------------------------------------------------------------

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        name: Conventional Commit
        entry: conventional-pre-commit
        language: python
        description: Checks commit message for Conventional Commits formatting
        always_run: true
        stages:
          - commit-msg

  - repo: https://github.com/pre-commit-ci/pre-commit-ci-config
    rev: v1.6.1
    hooks:
      - id: check-pre-commit-ci-config
        name: check pre-commit.ci config
        description: validate pre-commit.ci configuration
        entry: check-pre-commit-ci-config
        language: python
        files: ^\.pre-commit-config.yaml$
