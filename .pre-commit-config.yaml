---
# NOTICE: DO NOT EDIT THIS FILE!
# This file is managed by './tools/genprecommitconfig'
# Modifications should be made in '.genprecommitconfig.yaml'

# ==============================================================================
# Pre-Commit Hook Configuration
# ==============================================================================
# Fast, local checks that run automatically before every git commit command.
# See https://pre-commit.com for documentation and hook configuration options.
# ==============================================================================

# ==============================================================================
# Pre-commit.ci Service Configuration
# ==============================================================================
# Configuration for https://pre-commit.ci
# Automates pre-commit hook version updates via GitHub integration.
# ==============================================================================

ci:
  # The Git commit message used when autofixing code.
  autofix_commit_msg: "style: Auto-fixes from pre-commit.ci"
  # Automatically pushes formatting fixes back to the PR branch.
  autofix_prs: true
  # Branch to send autoupdate PRs to (empty string = default branch).
  autoupdate_branch: ""
  # The Git commit message used when updating hook tags.
  autoupdate_commit_msg: "chore(deps): Update pre-commit hooks"
  # Frequency of dependency updates (weekly, monthly, quarterly).
  autoupdate_schedule: weekly
  # Whether to recursively check out Git submodules in the CI environment.
  submodules: false
  # List of hook ids to skip only in CI (useful for heavy/slow local scripts).
  skip:
    - editorconfig-checker
    - mdformat
    - pyroma
    - deptry
    - yesqa
    - flake8
    - pylint
    - pyrefly-check
    - pyright
    - mypy
    - semgrep

# ==============================================================================
# Global Defaults
# ==============================================================================

# Maps languages to precise runtime versions (e.g., python: python3.11).
default_language_version:
  python: python3.11
# Restricts hooks to specific Git stages (e.g., [commit, push]).
default_stages:
  - pre-commit
  - pre-push
# If true, aborts the entire execution run after the first failed hook.
fail_fast: true

# ==============================================================================
# Hook Repositories
# ==============================================================================
# NOTE: Many hooks use `additional_dependencies: [gamesheet-sdk-py[<extras>]]`
# to pull runtime deps into the isolated hook venv. This pattern consolidates
# all tool dependencies in pyproject.toml's optional-dependencies groups as
# the single source of truth.
# ==============================================================================

repos:

  # ----------------------------------------------------------------------------
  # Meta Hooks (pre-commit validation)
  # ----------------------------------------------------------------------------

  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
      - id: identity

  # ----------------------------------------------------------------------------
  # Commit Message Linting (Conventional Commits)
  # ----------------------------------------------------------------------------

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        name: Conventional Commit
        entry: conventional-pre-commit
        language: python
        description: Checks commit message for Conventional Commits formatting
        always_run: true
        stages:
          - commit-msg

  # ----------------------------------------------------------------------------
  # Global File Sanity Checks
  # ----------------------------------------------------------------------------

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        name: check for added large files
        description: prevents giant files from being committed.
        entry: check-added-large-files
        language: python
        stages:
          - pre-commit
          - pre-push
          - manual
        minimum_pre_commit_version: 3.2.0
      - id: check-ast
        name: check python ast
        description: simply checks whether the files parse as valid python.
        entry: check-ast
        language: python
        types:
          - python
      - id: check-builtin-literals
        name: check builtin type constructor use
        description: requires literal syntax when initializing empty or zero
          python builtin types.
        entry: check-builtin-literals
        language: python
        types:
          - python
      - id: check-case-conflict
        name: check for case conflicts
        description: checks for files that would conflict in case-insensitive
          filesystems.
        entry: check-case-conflict
        language: python
      - id: check-docstring-first
        name: check docstring is first
        description: checks a common error of defining a docstring after code.
        entry: check-docstring-first
        language: python
        types:
          - python
      - id: check-executables-have-shebangs
        name: check that executables have shebangs
        description: ensures that (non-binary) executables have a shebang.
        entry: check-executables-have-shebangs
        language: python
        types:
          - text
          - executable
        stages:
          - pre-commit
          - pre-push
          - manual
        minimum_pre_commit_version: 3.2.0
      - id: check-illegal-windows-names
        name: check illegal windows names
        entry: Illegal Windows filenames detected
        language: fail
        files:
          (?i)((^|/)(CON|PRN|AUX|NUL|COM[\d¹²³]|LPT[\d¹²³])(\.|/|$)|[<>:\"\\|?*\x00-\x1F]|/[^/]*[\.\s]/|[^/]*[\.\s]$)
      - id: check-json
        name: check json
        description: checks json files for parseable syntax.
        entry: check-json
        language: python
        types:
          - json
      - id: check-shebang-scripts-are-executable
        name: check that scripts with shebangs are executable
        description: ensures that (non-binary) files with a shebang are
          executable.
        entry: check-shebang-scripts-are-executable
        language: python
        types:
          - text
        stages:
          - pre-commit
          - pre-push
          - manual
        minimum_pre_commit_version: 3.2.0
      - id: pretty-format-json
        name: pretty format json
        description: sets a standard for formatting json files.
        entry: pretty-format-json
        language: python
        types:
          - json
        args:
          - --autofix
          - --no-sort-keys
      - id: check-merge-conflict
        name: check for merge conflicts
        description: checks for files that contain merge conflict strings.
        entry: check-merge-conflict
        language: python
        types:
          - text
      - id: check-toml
        name: check toml
        description: checks toml files for parseable syntax.
        entry: check-toml
        language: python
        types:
          - toml
      - id: check-vcs-permalinks
        name: check vcs permalinks
        description: ensures that links to vcs websites are permalinks.
        entry: check-vcs-permalinks
        language: python
        types:
          - text
      - id: check-yaml
        name: check yaml
        description: checks yaml files for parseable syntax.
        entry: check-yaml
        language: python
        types:
          - yaml
      - id: debug-statements
        name: debug statements (python)
        description: checks for debugger imports and py37+ `breakpoint()` calls
          in python source.
        entry: debug-statement-hook
        language: python
        types:
          - python
      - id: destroyed-symlinks
        name: detect destroyed symlinks
        description: detects symlinks which are changed to regular files with a
          content of a path which that symlink was pointing to.
        entry: destroyed-symlinks
        language: python
        types:
          - file
        stages:
          - pre-commit
          - pre-push
          - manual
      - id: detect-aws-credentials
        name: detect aws credentials
        description: detects *your* aws credentials from the aws cli credentials
          file.
        entry: detect-aws-credentials
        language: python
        types:
          - text
        args:
          - --allow-missing-credentials
      - id: detect-private-key
        name: detect private key
        description: detects the presence of private keys.
        entry: detect-private-key
        language: python
        types:
          - text
      - id: end-of-file-fixer
        name: fix end of files
        description: ensures that a file is either empty, or ends with one
          newline.
        entry: end-of-file-fixer
        language: python
        types:
          - text
        stages:
          - pre-commit
          - pre-push
          - manual
        minimum_pre_commit_version: 3.2.0
      - id: file-contents-sorter
        name: file contents sorter
        description: sorts the lines in specified files (defaults to
          alphabetical). you must provide list of target files as input in your
          .pre-commit-config.yaml file.
        entry: file-contents-sorter
        language: python
        files: ^custom-dictionary\.txt$
      - id: fix-byte-order-marker
        name: fix utf-8 byte order marker
        description: removes utf-8 byte order marker.
        entry: fix-byte-order-marker
        language: python
        types:
          - text
      - id: forbid-submodules
        name: forbid submodules
        description: forbids any submodules in the repository
        language: fail
        entry: "submodules are not allowed in this repository:"
        types:
          - directory
      - id: mixed-line-ending
        name: mixed line ending
        description: replaces or checks mixed line ending.
        entry: mixed-line-ending
        language: python
        types:
          - text
      - id: name-tests-test
        name: python tests naming
        description: verifies that test files are named correctly.
        entry: name-tests-test
        language: python
        files: (^|/)tests/.+\.py$
        exclude:
          ^tests/.*(cli|conftest|constants|endpoints|mocks|payloads|roster_helpers)\.py$
        args:
          - --pytest-test-first
      - id: no-commit-to-branch
        name: don't commit to branch
        entry: no-commit-to-branch
        language: python
        pass_filenames: false
        always_run: true
      - id: trailing-whitespace
        name: trim trailing whitespace
        description: trims trailing whitespace.
        entry: trailing-whitespace-fixer
        language: python
        types:
          - text
        stages:
          - pre-commit
          - pre-push
          - manual
        minimum_pre_commit_version: 3.2.0

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-blanket-noqa
        name: check blanket noqa
        description: 'Enforce that `noqa` annotations always occur with specific codes.
          Sample annotations: `# noqa: F401`, `# noqa: F401,W203`'
        entry: "(?i)# noqa(?!: )"
        language: pygrep
        types:
          - python
      - id: python-check-blanket-type-ignore
        name: check blanket type ignore
        description: 'Enforce that `# type: ignore` annotations always occur with
          specific codes. Sample annotations: `# type: ignore[attr-defined]`, `# type:
          ignore[attr-defined, name-defined]`'
        entry: '# type:? *ignore(?!\[|\w)'
        language: pygrep
        types:
          - python
      - id: python-check-mock-methods
        name: check for not-real mock methods
        description: >-
          Prevent common mistakes of `assert mck.not_called()`, `assert mck.called_once_with(...)`
          and `mck.assert_called`.
        language: pygrep
        entry: >
          (?x)(
              assert .*\.(
                  not_called|
                  called_
              )|
              # ''.join(rf'(?<!\b{s})' for s in dir(mock) if s.endswith('Mock')))
              (?<!\bAsyncMock)(?<!\bMagicMock)(?<!\bMock)(?<!\bNonCallableMagicMock)(?<!\bNonCallableMock)(?<!\bPropertyMock)
              \.assert_(
                  any_call|
                  called|
                  called_once|
                  called_once_with|
                  called_with|
                  has_calls|
                  not_called
              )($|[^(\w])
          )
        types:
          - python
      - id: python-no-eval
        name: check for eval()
        description: A quick check for the `eval()` built-in function
        entry: \beval\(
        language: pygrep
        types:
          - python
      - id: python-no-log-warn
        name: use logger.warning(
        description: A quick check for the deprecated `.warn()` method of python
          loggers
        entry: (?<!warnings)\.warn\(
        language: pygrep
        types:
          - python
      - id: python-use-type-annotations
        name: type annotations not comments
        description: Enforce that python3.6+ type annotations are used instead
          of type comments
        entry: "# type(?!: *ignore([^a-zA-Z0-9]|$))"
        language: pygrep
        types:
          - python
      - id: rst-backticks
        name: rst ``code`` is two backticks
        description: Detect common mistake of using single backticks when
          writing rst
        entry: ^(?!    ).*(^| )`[^`]+`([^_]|$)
        language: pygrep
        types:
          - rst
      - id: rst-directive-colons
        name: rst directives end with two colons
        description: Detect mistake of rst directive not ending with double
          colon or space before the double colon
        entry: ^\s*\.\. [a-z]+(| | :):$
        language: pygrep
        types:
          - rst
      - id: rst-inline-touching-normal
        name: rst ``inline code`` next to normal text
        description: Detect mistake of inline code touching normal text in rst
        entry: \w``\w
        language: pygrep
        types:
          - rst
      - id: text-unicode-replacement-char
        name: no unicode replacement chars
        description: Forbid files which have a UTF-8 Unicode replacement
          character
        entry: �
        language: pygrep
        types:
          - text
        exclude: ^\.pre-commit-config\.yaml$

  # ----------------------------------------------------------------------------
  # Configuration File Linters & Formatters
  # ----------------------------------------------------------------------------

  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.8.0
    hooks:
      - id: editorconfig-checker
        name: Check .editorconfig rules
        description: '`editorconfig-checker` is a tool to check if your files consider
          your .editorconfig-rules.'
        entry: ec
        language: python
        types:
          - text
        require_serial: true

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        name: yamllint
        description: This hook runs yamllint.
        entry: yamllint
        language: python
        types:
          - file
          - yaml

  - repo: https://github.com/tox-dev/tox-ini-fmt
    rev: 1.8.1
    hooks:
      - id: tox-ini-fmt
        name: tox-ini-fmt
        description: apply a consistent format to `tox.ini` files
        entry: tox-ini-fmt
        language: python
        language_version: python3
        files: (^|/)tox\.ini$

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.26.0
    hooks:
      - id: pyproject-fmt
        name: pyproject-fmt
        description: ""
        entry: pyproject-fmt
        language: python
        files: (^|/)pyproject\.toml$
        args: []
        require_serial: false
        additional_dependencies: []
        minimum_pre_commit_version: "0"

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.25
    hooks:
      - id: validate-pyproject
        name: Validate pyproject.toml
        description: >
          Validation library for a simple check on pyproject.toml,
          including optional dependencies
        language: python
        files: ^pyproject.toml$
        entry: validate-pyproject
        additional_dependencies:
          - .[all]

  - repo: https://github.com/regebro/pyroma
    rev: 5.0.1
    hooks:
      - id: pyroma
        name: Check package with Pyroma
        description: Check how well a Python package conforms to best practices.
        entry: pyroma
        args:
          - -d
          - --min=10
          - .
        language: python
        pass_filenames: false
        always_run: true

  # ----------------------------------------------------------------------------
  # Documentation & Markdown Tools
  # ----------------------------------------------------------------------------

  - repo: https://github.com/jackdewinter/pymarkdown
    rev: v0.9.39
    hooks:
      - id: pymarkdown
        name: PyMarkdown
        description: PyMarkdown - GitHub Flavored Markdown and CommonMark
          Compliant Linter
        language: python
        language_version: python3
        entry: pymarkdown
        args:
          - scan
        types:
          - markdown

  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        name: mdformat
        description: CommonMark compliant Markdown formatter
        entry: mdformat
        language: python
        types:
          - markdown
        minimum_pre_commit_version: 1.0.0
        language_version: python3.13
        additional_dependencies:
          - gamesheet-sdk-py[mdformat]

  # ----------------------------------------------------------------------------
  # Code Style & Formatting (Automated Fixers)
  # ----------------------------------------------------------------------------

  - repo: https://github.com/asottile/add-trailing-comma
    rev: v4.0.0
    hooks:
      - id: add-trailing-comma
        name: Add trailing commas
        description: Automatically add trailing commas to calls and literals.
        entry: add-trailing-comma
        language: python
        types:
          - python

  - repo: https://github.com/marcogorelli/absolufy-imports
    rev: v0.3.1
    hooks:
      - id: absolufy-imports
        name: absolufy-imports
        description: Automatically convert relative imports to absolute
        entry: absolufy-imports
        language: python
        types:
          - python
        files: ""
        minimum_pre_commit_version: 0.15.0

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        name: pyupgrade
        description: Automatically upgrade syntax for newer versions.
        entry: pyupgrade
        language: python
        types:
          - python
        files: ""
        minimum_pre_commit_version: 0.15.0

  - repo: https://github.com/pycqa/isort
    rev: 8.0.1
    hooks:
      - id: isort
        name: isort
        entry: isort
        stages:
          - pre-commit
          - pre-merge-commit
          - pre-push
          - manual
        require_serial: true
        language: python
        types_or:
          - cython
          - pyi
          - python
        args:
          - --filter-files
        minimum_pre_commit_version: 3.2.0

  - repo: https://github.com/bwhmather/ssort
    rev: 0.17.0
    hooks:
      - id: ssort
        name: ssort
        description: Sorting top level statements in python files.
        entry: ssort
        language: python
        types:
          - python

  - repo: https://github.com/hhatto/autopep8
    rev: v2.3.2
    hooks:
      - id: autopep8
        name: autopep8
        description: A tool that automatically formats Python code to conform to
          the PEP 8 style guide.
        entry: autopep8
        language: python
        types:
          - python
        args:
          - -i

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black
        name: black
        description: "Black: The uncompromising Python code formatter"
        entry: black
        language: python
        minimum_pre_commit_version: 2.9.2
        require_serial: true
        types_or:
          - python
          - pyi
      - id: black-jupyter
        name: black-jupyter
        description: 'Black: The uncompromising Python code formatter (with Jupyter
          Notebook support)'
        entry: black
        language: python
        minimum_pre_commit_version: 2.9.2
        require_serial: true
        types_or:
          - python
          - pyi
          - jupyter
        additional_dependencies:
          - .[jupyter]

  # ----------------------------------------------------------------------------
  # Code Cleaners & Dead Code Detectors
  # ----------------------------------------------------------------------------

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: Detect secrets
        description: Detects high entropy strings that are likely to be
          passwords.
        entry: detect-secrets-hook
        language: python
        files: .*

  - repo: https://github.com/hakancelikdev/unimport
    rev: 0.11.1
    hooks:
      - id: unimport
        name: unimport
        description: A linter, formatter for finding and removing unused import
          statements
        entry: unimport
        language: python
        language_version: python3.11
        types:
          - python

  - repo: https://github.com/pycqa/autoflake
    rev: v2.3.3
    hooks:
      - id: autoflake
        name: autoflake
        entry: autoflake
        language: python
        types:
          - python
        require_serial: true
        args:
          - --in-place
          - --expand-star-imports
          - --remove-duplicate-keys
          - --remove-unused-variables

  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.16
    hooks:
      - id: vulture
        name: vulture
        language: python
        entry: vulture
        description: Find unused Python code.
        types:
          - python
        pass_filenames: false
        require_serial: true
        args:
          - .

  - repo: https://github.com/osprey-oss/deptry
    rev: 0.25.1
    hooks:
      - id: deptry
        name: deptry
        description: deptry is a command line tool to check for issues with
          dependencies in a Python project, such as unused or missing
          dependencies.
        entry: deptry .
        language: python
        always_run: true
        pass_filenames: false
        additional_dependencies:
          - gamesheet-sdk-py[deptry]

  # ----------------------------------------------------------------------------
  # Documentation & Docstring Tools
  # ----------------------------------------------------------------------------

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        name: codespell
        description: Checks for common misspellings in text files.
        entry: codespell
        language: python
        types:
          - text

  - repo: https://github.com/asottile/blacken-docs
    rev: 1.20.0
    hooks:
      - id: blacken-docs
        name: blacken-docs
        description: Run `black` on python code blocks in documentation files
        entry: blacken-docs
        language: python
        files: \.(rst|md|markdown|py|tex)$

  - repo: https://github.com/pycqa/docformatter
    rev: v1.7.8
    hooks:
      - id: docformatter
        name: docformatter
        description: Formats docstrings to follow PEP 257.
        entry: docformatter
        args:
          - -i
        language: python
        types:
          - python

  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
      - id: interrogate
        name: interrogate
        description: interrogate your code base for missing docstrings
        entry: interrogate
        language: python
        language_version: python3
        types:
          - python
        require_serial: true
        pass_filenames: false

  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        name: pydocstyle
        description: pydocstyle is a static analysis tool for checking
          compliance with Python docstring conventions.
        entry: pydocstyle
        language: python
        types:
          - python

  # ----------------------------------------------------------------------------
  # Code Quality Linters & Static Analysis
  # ----------------------------------------------------------------------------

  - repo: https://github.com/princetonuniversity/blocklint
    rev: v0.3.0
    hooks:
      - id: blocklint
        name: blocklint
        description: '`blocklint` is a command-line utility for inclusive language
          highlighting.'
        entry: blocklint
        language: python
        types:
          - text

  - repo: https://github.com/asottile/yesqa
    rev: v1.5.0
    hooks:
      - id: yesqa
        name: Strip unnecessary `# noqa`s
        description: Automatically remove unnecessary `# noqa` comments
        entry: yesqa
        language: python
        types:
          - python
        additional_dependencies:
          - gamesheet-sdk-py[flake8]

  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        name: flake8
        description: '`flake8` is a command-line utility for enforcing style consistency
          across Python projects.'
        entry: flake8
        language: python
        types:
          - python
        require_serial: true
        exclude: ^tools/(syncdeps|genprecommitconfig)$
        additional_dependencies:
          - gamesheet-sdk-py[flake8]

  - repo: https://github.com/dosisod/refurb
    rev: v2.3.1
    hooks:
      - id: refurb
        name: refurb
        description: A tool for refurbishing and modernizing Python codebases.
        entry: refurb
        language: python
        types:
          - python
        require_serial: true
        exclude: ^tools/(syncdeps|genprecommitconfig)$
        additional_dependencies:
          - gamesheet-sdk-py[refurb]

  - repo: https://github.com/pylint-dev/pylint
    rev: v4.0.6
    hooks:
      - id: pylint
        name: pylint
        entry: pylint
        language: python
        types:
          - python
        require_serial: true
        additional_dependencies:
          - gamesheet-sdk-py[pylint,tools]
          - ruamel-yaml
          - tomli

  - repo: https://github.com/facebook/pyrefly-pre-commit
    rev: 1.2.0
    hooks:
      - id: pyrefly-check
        name: pyrefly check
        description: Run `pyrefly check` for Python type checking.
        entry: pyrefly check
        language: python
        types_or:
          - python
          - pyi
        pass_filenames: false
        require_serial: true
        stages:
          - pre-commit
          - pre-merge-commit
          - pre-push
          - manual
        additional_dependencies:
          - gamesheet-sdk-py[pyrefly]

  # ----------------------------------------------------------------------------
  # Security, Metrics & Complexity
  # ----------------------------------------------------------------------------

  - repo: https://github.com/pycqa/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        name: bandit
        description: Bandit is a tool for finding common security issues in
          Python code
        entry: bandit
        language: python
        language_version: python3
        types:
          - python
        require_serial: true
        args:
          - --configfile
          - pyproject.toml
          - --recursive

  - repo: https://github.com/semgrep/pre-commit
    rev: v1.172.0
    hooks:
      - id: semgrep
        name: semgrep
        entry: semgrep
        language: python
        args:
          - --disable-version-check
          - --quiet
          - --skip-unknown-extensions
          - --jobs
          - "1"
      - id: semgrep-ci
        name: semgrep
        entry: semgrep
        language: python
        pass_filenames: false
        args:
          - ci
          - --dry-run
          - --baseline-commit
          - HEAD

  - repo: https://github.com/rubik/xenon
    rev: v0.9.3
    hooks:
      - id: xenon
        name: Xenon
        description: Monitoring tool based on Radon
        entry: xenon
        language: python
        types:
          - python

  # ----------------------------------------------------------------------------
  # Type Checkers
  # ----------------------------------------------------------------------------

  - repo: https://github.com/robertcraigie/pyright-python
    rev: v1.1.411
    hooks:
      - id: pyright
        name: pyright
        description: Python command line wrapper for pyright, a static type
          checker
        entry: pyright
        language: python
        types_or:
          - python
          - pyi
        require_serial: true
        additional_dependencies:
          - gamesheet-sdk-py[pyright,tools]
          - ruamel-yaml
          - tomli
          - tomlkit
        minimum_pre_commit_version: 2.9.2

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        name: mypy
        description: ""
        entry: mypy
        language: python
        types_or:
          - python
          - pyi
        args:
          - --strict
        require_serial: true
        additional_dependencies:
          - gamesheet-sdk-py[mypy,tools]
          - ruamel-yaml
          - tomli
          - tomlkit
        minimum_pre_commit_version: 2.9.2
        exclude: ^tools/(syncdeps|genprecommitconfig)$

  # ----------------------------------------------------------------------------
  # Pre-Commit Hook Sync
  # ----------------------------------------------------------------------------

  - repo: https://github.com/pre-commit-ci/pre-commit-ci-config
    rev: v1.6.1
    hooks:
      - id: check-pre-commit-ci-config
        name: check pre-commit.ci config
        description: validate pre-commit.ci configuration
        entry: check-pre-commit-ci-config
        language: python
        files: ^\.pre-commit-config.yaml$

  - repo: https://github.com/pre-commit/sync-pre-commit-deps
    rev: v0.0.5
    hooks:
      - id: sync-pre-commit-deps
        name: sync-pre-commit-deps
        description: Sync pre-commit hook dependencies based on other installed
          hooks
        entry: sync-pre-commit-deps
        language: python
        language_version: python3
        files: ^\.pre-commit-config.yaml$
