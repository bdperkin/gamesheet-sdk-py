---
# ==============================================================================
# Pre-Commit Hook Configuration
# ==============================================================================
# Fast, local checks that run automatically before every git commit command.
# See https://pre-commit.com for documentation and hook configuration options.
#
# This configuration includes 72 hooks across 40 repositories, organized into
# 11 categories: meta checks, commit messages, file sanity, configuration
# linters, documentation tools, code style, dead code detection, docstring
# tools, static analysis, security/metrics, and type checking.
# ==============================================================================

# ==============================================================================
# Pre-commit.ci Service Configuration
# ==============================================================================
# Configuration for https://pre-commit.ci
# Automates pre-commit hook version updates via GitHub integration.
ci:
  # Python version for pre-commit.ci service
  # Using 3.11 (our minimum supported version) maximizes tool compatibility
  python_version: "3.11"

  # Auto-update hook versions weekly (every Monday)
  autoupdate_schedule: weekly
  autoupdate_commit_msg: "chore(deps): Update pre-commit hooks"

  # Auto-fix issues when possible (formatting, trailing whitespace, etc.)
  autofix_commit_msg: "style: Auto-fixes from pre-commit.ci"
  autofix_prs: true

  # Skip certain hooks on pre-commit.ci (they still run in GitHub Actions).
  # Reasons for skipping:
  # - editorconfig-checker: System binary dependency issues
  # - mdformat: Size constraints on pre-commit.ci
  # - pyroma: Requires `python -m venv` (unavailable on pre-commit.ci)
  # - deptry/yesqa/flake8/pylint/pyrefly: Combined deps exceed 250 MiB limit
  # - pyright: Dependencies don't fit pre-commit.ci's tier
  # - mypy: Large dependency footprint
  skip:
    - editorconfig-checker
    - editorconfig-checker-system
    - mdformat
    - pyroma
    - deptry
    - yesqa
    - flake8
    - pylint
    - pyrefly-check
    - pyright
    - mypy

  # Require all hooks to pass before autoupdate.
  # Empty string = create PR for review (recommended)
  # Setting to 'main' would auto-merge (NOT recommended)
  # Autoupdates land as PRs for manual review, not auto-merges.
  autoupdate_branch: ""

# ==============================================================================
# Global Defaults
# ==============================================================================

# Default Python version for all hooks (matches minimum supported version)
default_language_version:
  python: python3.11

# Run hooks on both pre-commit and pre-push by default
default_stages:
  - pre-commit
  - pre-push

# Stop on first failure (faster feedback loop)
fail_fast: true

# ==============================================================================
# Hook Repositories
# ==============================================================================
# NOTE: Many hooks use `additional_dependencies: [gamesheet-sdk-py[<extras>]]`
# to pull runtime deps into the isolated hook venv. This pattern consolidates
# all tool dependencies in pyproject.toml's optional-dependencies groups as
# the single source of truth.

repos:
  # ----------------------------------------------------------------------------
  # Meta Hooks (pre-commit validation)
  # ----------------------------------------------------------------------------
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
      - id: identity

  # ----------------------------------------------------------------------------
  # Commit Message Linting (Conventional Commits)
  # ----------------------------------------------------------------------------
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []

  # ----------------------------------------------------------------------------
  # Global File Sanity Checks
  # ----------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-illegal-windows-names
      - id: check-json
      - id: check-shebang-scripts-are-executable
      - id: pretty-format-json
        args: ["--autofix", "--no-sort-keys"]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-yaml
      - id: debug-statements
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: forbid-submodules
      - id: mixed-line-ending
      - id: name-tests-test
        args: ["--pytest-test-first"]
        exclude: ^tests/(cli|fixtures|helpers)/(cli|constants|endpoints|mocks|payloads|roster_helpers)\.py$
      - id: no-commit-to-branch
      - id: trailing-whitespace

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-blanket-noqa
      - id: python-check-blanket-type-ignore
      - id: python-check-mock-methods
      - id: python-no-eval
      - id: python-no-log-warn
      - id: python-use-type-annotations
      - id: text-unicode-replacement-char

  # ----------------------------------------------------------------------------
  # Configuration File Linters & Formatters
  # ----------------------------------------------------------------------------
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.6.1
    hooks:
      - id: editorconfig-checker
      - id: editorconfig-checker-system
        language: python

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ["--config-data", "relaxed"]

  - repo: https://github.com/tox-dev/tox-ini-fmt
    rev: 1.7.1
    hooks:
      - id: tox-ini-fmt

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.25.1
    hooks:
      - id: pyproject-fmt

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.25
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/regebro/pyroma
    rev: 5.1b1
    hooks:
      - id: pyroma

  # ----------------------------------------------------------------------------
  # Documentation & Markdown Tools
  # ----------------------------------------------------------------------------
  - repo: https://github.com/jackdewinter/pymarkdown
    rev: v0.9.38
    hooks:
      - id: pymarkdown

  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        language_version: python3.13
        additional_dependencies:
          - gamesheet-sdk-py[mdformat]

  # ----------------------------------------------------------------------------
  # Code Style & Formatting (Automated Fixers)
  # ----------------------------------------------------------------------------
  - repo: https://github.com/asottile/add-trailing-comma
    rev: v4.0.0
    hooks:
      - id: add-trailing-comma

  - repo: https://github.com/marcogorelli/absolufy-imports
    rev: v0.3.1
    hooks:
      - id: absolufy-imports

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: ["--py311-plus"]

  - repo: https://github.com/pycqa/isort
    rev: 9.0.0a3
    hooks:
      - id: isort
        args: ["--profile=black"]

  - repo: https://github.com/bwhmather/ssort
    rev: 0.16.0
    hooks:
      - id: ssort

  - repo: https://github.com/hhatto/autopep8
    rev: v2.3.2
    hooks:
      - id: autopep8

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black
        args: ["--line-length=110"]
      - id: black-jupyter

  # ----------------------------------------------------------------------------
  # Code Cleaners & Dead Code Detectors
  # ----------------------------------------------------------------------------
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        types: [python]

  - repo: https://github.com/hakancelikdev/unimport
    rev: 1.4.0
    hooks:
      - id: unimport
        language_version: python3.11

  - repo: https://github.com/pycqa/autoflake
    rev: v2.3.3
    hooks:
      - id: autoflake

  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.16
    hooks:
      - id: vulture
        args: ["."]

  - repo: https://github.com/osprey-oss/deptry
    rev: 0.25.1
    hooks:
      - id: deptry
        language: python
        additional_dependencies:
          - gamesheet-sdk-py[deptry,pytest,type-stubs]

  # ----------------------------------------------------------------------------
  # Documentation & Docstring Tools
  # ----------------------------------------------------------------------------
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell

  - repo: https://github.com/asottile/blacken-docs
    rev: 1.20.0
    hooks:
      - id: blacken-docs

  - repo: https://github.com/pycqa/docformatter
    rev: v1.7.8
    hooks:
      - id: docformatter
        exclude: ^docs/conf.py$

  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
      - id: interrogate
        pass_filenames: false

  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle

  # ----------------------------------------------------------------------------
  # Code Quality Linters & Static Analysis
  # ----------------------------------------------------------------------------
  - repo: https://github.com/princetonuniversity/blocklint
    rev: v0.3.0
    hooks:
      - id: blocklint

  - repo: https://github.com/asottile/yesqa
    rev: v1.5.0
    hooks:
      - id: yesqa
        additional_dependencies:
          - gamesheet-sdk-py[flake8]

  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        additional_dependencies:
          - gamesheet-sdk-py[flake8]

  - repo: https://github.com/dosisod/refurb
    rev: v2.3.1
    hooks:
      - id: refurb
        additional_dependencies:
          - gamesheet-sdk-py[refurb]

  - repo: https://github.com/pylint-dev/pylint
    rev: v4.0.6
    hooks:
      - id: pylint
        args: ["--reports", "y"]
        additional_dependencies:
          - gamesheet-sdk-py[pylint,pytest]

  - repo: https://github.com/facebook/pyrefly-pre-commit
    rev: 1.1.1
    hooks:
      - id: pyrefly-check
        additional_dependencies:
          - gamesheet-sdk-py[pyrefly,pytest]

  # ----------------------------------------------------------------------------
  # Security, Metrics & Complexity
  # ----------------------------------------------------------------------------
  - repo: https://github.com/pycqa/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["--configfile", "pyproject.toml", "--recursive"]

  - repo: https://github.com/rubik/xenon
    rev: v0.9.3
    hooks:
      - id: xenon
        args: ["--max-absolute=C", "--max-modules=B", "--max-average=A", "src/"]
        pass_filenames: false

  # ----------------------------------------------------------------------------
  # Type Checkers
  # ----------------------------------------------------------------------------
  - repo: https://github.com/robertcraigie/pyright-python
    rev: v1.1.411
    hooks:
      - id: pyright
        additional_dependencies:
          - gamesheet-sdk-py[pyright,pytest]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        args: ["--strict"]
        additional_dependencies:
          - gamesheet-sdk-py[mypy,pytest,type-stubs]

  # ----------------------------------------------------------------------------
  # Pre-Commit Hook Sync
  # ----------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/sync-pre-commit-deps
    rev: v0.0.4
    hooks:
      - id: sync-pre-commit-deps
