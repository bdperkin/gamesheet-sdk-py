# ------------------------------------------------------------------------------
# Tool Configurations
# ------------------------------------------------------------------------------
## ## hatch - Extensible, lifecycle management tool for Python
[tool.hatch]
build.targets.wheel.packages = [ "src/gamesheet_sdk" ]
build.targets.sdist.include = [
  "docs",
  "LICENSE",
  "pyproject.toml",
  "README.md",
  "src/gamesheet_sdk",
  "tests",
]
description = "Modern, all-in-one Python project manager and build tool that handles environments, testing, and publishing."

## ## autopep8 - PEP 8 style fixer
[tool.autopep8]
max_line_length = 110
recursive = true
aggressive = 1
check = true
description = "Automatically formats Python code to conform to the PEP 8 style guide by fixing layout issues."
exit_code = true

## ## black - Uncompromising code formatter
[tool.black]
fast = true
line_length = 110
target_version = [
  "py311",
  "py312",
  "py313",
  "py314",
]

## ## isort - Import sorter
[tool.isort]
profile = "black"
py_version = 311
line_length = 110
wrap_length = 110

## ## flake8 - Modular Python linter wrapper
[tool.flake8]
check = true
description = "Combines PyFlakes, pycodestyle, and McCabe to check style compliance and basic logic errors."
diff = true
exclude = [
  ".coverage",
  "coverage.xml",
  "dist/",
  ".mypy_cache/",
  ".pytest_cache/",
  ".tox/",
  ".venv/",
]
extend-ignore = [
  "A003",
  "ANN101",
  "DOC103",
  "DOC111",
  "DOC402",
  "DOC404",
  "DOC502",
  "TC003",
  "U101",
]
extend-select = [
  "B950",
]
inline-quotes = "double"
max-line-length = 110
per-file-ignores = [
  "docs/*:INP001",
  "tests/*:PT019,S101,S105,S106,SF01",
]
recursive = true
style = "sphinx"
arg-type-hints-in-signature = true
arg-type-hints-in-docstring = false
check-return-types = false

## ## pylint - Comprehensive static code analyzer
[tool.pylint]
main.fail-under = 10
main.ignore = [
  ".coverage",
  ".mypy_cache",
  ".pytest_cache",
  ".tox",
  ".venv",
  "coverage.xml",
  "dist",
]
main.ignore-patterns = [ "^\\.#" ]
main.jobs = 1
main.limit-inference-results = 100
main.load-plugins = [
  "pylint_per_file_ignores",
]
main.persistent = true
main.py-version = "3.11"
reports.evaluation = "max(0, 0 if fatal else 10.0 - ((float(5 * error + warning + refactor + convention) / statement) * 10))"
reports.score = true
basic.argument-naming-style = "snake_case"
basic.attr-naming-style = "snake_case"
basic.bad-names = [ "bar", "baz", "foo", "tata", "toto", "tutu" ]
basic.class-attribute-naming-style = "any"
basic.class-const-naming-style = "UPPER_CASE"
basic.class-naming-style = "PascalCase"
basic.const-naming-style = "UPPER_CASE"
basic.docstring-min-length = -1
basic.function-naming-style = "snake_case"
basic.good-names = [ "_", "ex", "i", "j", "k", "Run" ]
basic.inlinevar-naming-style = "any"
basic.method-naming-style = "snake_case"
basic.module-naming-style = "snake_case"
basic.no-docstring-rgx = "^_"
basic.property-classes = [ "abc.abstractproperty" ]
basic.variable-naming-style = "snake_case"
format.ignore-long-lines = "^\\s*(# )?<?https?://\\S+>?$"
format.indent-after-paren = 4
format.indent-string = "    "
format.max-line-length = 110
format.max-module-lines = 500
design.max-args = 5
design.max-attributes = 7
design.max-bool-expr = 5
design.max-branches = 12
design.max-locals = 15
design.max-parents = 7
design.max-positional-arguments = 5
design.max-public-methods = 20
design.max-returns = 6
design.max-statements = 50
design.min-public-methods = 2
classes.defining-attr-methods = [ "__init__", "__new__", "__post_init__", "asyncSetUp", "setUp" ]
classes.exclude-protected = [ "_asdict", "_fields", "_make", "_replace", "_source", "os._exit" ]
classes.valid-classmethod-first-arg = [ "cls" ]
classes.valid-metaclass-classmethod-first-arg = [ "mcs" ]
exceptions.overgeneral-exceptions = [ "builtins.BaseException", "builtins.Exception" ]
imports.known-third-party = [ "enchant" ]
logging.logging-format-style = "old"
logging.logging-modules = [ "logging" ]
method_args.timeout-methods = [
  "requests.api.delete",
  "requests.api.get",
  "requests.api.head",
  "requests.api.options",
  "requests.api.patch",
  "requests.api.post",
  "requests.api.put",
  "requests.api.request",
]
refactoring.max-nested-blocks = 5
refactoring.never-returning-functions = [ "sys.exit", "argparse.parse_error" ]
refactoring.suggest-join-with-non-empty-separator = true
similarities.ignore-comments = true
similarities.ignore-docstrings = true
similarities.ignore-imports = true
similarities.ignore-signatures = true
similarities.min-similarity-lines = 4
spelling.max-spelling-suggestions = 4
spelling.spelling-ignore-comment-directives = "fmt: on,fmt: off,noqa:,noqa,nosec,isort:skip,mypy:"
typecheck.contextmanager-decorators = [ "contextlib.contextmanager" ]
typecheck.ignore-none = true
typecheck.ignore-on-opaque-inference = true
typecheck.ignored-checks-for-mixins = [
  "no-member",
  "not-async-context-manager",
  "not-context-manager",
  "attribute-defined-outside-init"
]
typecheck.ignored-classes = [ "_thread._local", "argparse.Namespace", "optparse.Values", "thread._local" ]
typecheck.missing-member-hint = true
typecheck.missing-member-hint-distance = 1
typecheck.missing-member-max-choices = 1
typecheck.mixin-class-rgx = ".*[Mm]ixin"
variables.allow-global-unused-variables = true
variables.callbacks = [ "_cb", "cb_" ]
variables.dummy-variables-rgx = "_+$|(_[a-zA-Z0-9_]*[a-zA-Z0-9]+?$)|dummy|^ignored_|^unused_"
variables.ignored-argument-names = "_.*|^ignored_|^unused_"
variables.redefining-builtins-modules = [ "six.moves", "past.builtins", "future.builtins", "builtins", "io" ]
miscellaneous.notes = [ "FIXME", "XXX", "TODO" ]
"messages control".confidence = [ "HIGH", "CONTROL_FLOW", "INFERENCE", "INFERENCE_FAILURE", "UNDEFINED" ]
"messages control".disable = [
  "duplicate-code",
]
"messages control".per-file-ignores = [
  "docs/conf.py:invalid-name",
  "tests/**:import-outside-toplevel,missing-function-docstring,protected-access,redefined-outer-name",
]

## # ----------------------------------------------------------------------------
## # Documentation & Docstring Tools
## # ----------------------------------------------------------------------------
## ## codespell - Typos and spelling checker
[tool.codespell]
skip = "./docs/_build,./htmlcov"

## ## docformatter - Docstring formatter
[tool.docformatter]
