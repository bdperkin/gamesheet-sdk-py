[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-vcs>=0.4", "hatchling>=1.24" ]

[project]
name = "gamesheet-sdk-py"
description = """\
  Unofficial Python SDK and CLI for the GameSheet Inc. platform — automates WebUI procedures where a native API is \
  absent.\
  """
readme = "README.md"
keywords = [ "automation", "cli", "gamesheet", "hockey", "scraper", "sdk", "sports" ]
license = { file = "LICENSE" }
authors = [
  { name = "bdperkin", email = "bdperkin@gmail.com" },
]
requires-python = ">=3.11,<3.15"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dynamic = [ "version" ]
dependencies = [
  "beautifulsoup4>=4.12",
  "click>=8.1",
  "colorlog>=6.8",
  "lxml>=5.2",
  "playwright>=1.45",
  "pydantic>=2.7",
  "pydantic-settings>=2",
  "pyyaml>=6",
  "requests>=2.32",
  "rich>=13",
  "tabulate>=0.9",
]
optional-dependencies.dev = [
  "bandit[toml]>=1.7",
  "black>=26.3",
  "build>=1.2",
  "codespell>=2.4",
  "editorconfig-checker>=3.6",
  "flake8>=7.1",
  "flake8-pyproject>=1.2",
  "isort>=5.13",
  "mdformat>=0.7",
  "mdformat-gfm>=0.4",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "pytest>=8.2",
  "pytest-cov>=5",
  "pytest-playwright>=0.5",
  "pytest-recording>=0.13",
  "pyupgrade>=3.19",
  "responses>=0.25",
  "tox>=4.21",
  "types-pyyaml>=6",
  "types-requests>=2.32",
  "types-tabulate>=0.9",
  "validate-pyproject>=0.25",
  "yamllint>=1.38",
]
optional-dependencies.docs = [
  "furo>=2024.5",
  "myst-parser[linkify]>=3",
  "sphinx>=7.3",
  "sphinx-autobuild>=2024.4",
  "sphinx-click>=6",
  "sphinx-copybutton>=0.5",
  "sphinx-design>=0.5",
  "sphinx-lint>=0.9",
]
urls.Documentation = "https://github.com/bdperkin/gamesheet-sdk-py#readme"
urls.Homepage = "https://github.com/bdperkin/gamesheet-sdk-py"
urls.Issues = "https://github.com/bdperkin/gamesheet-sdk-py/issues"
urls.Repository = "https://github.com/bdperkin/gamesheet-sdk-py"
scripts.gamesheet-sdk-py = "gamesheet_sdk.cli:main"

[tool.hatch]
build.hooks.vcs.version-file = "src/gamesheet_sdk/_version.py"
build.targets.sdist.include = [
  "src/gamesheet_sdk",
  "tests",
  "docs",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]
build.targets.wheel.packages = [ "src/gamesheet_sdk" ]
# --- Hatch ----------------------------------------------------------------
version.source = "vcs"

# --- autopep8 -------------------------------------------------------------
[tool.autopep8]
max_line_length = 110
aggressive = 1
in-place = true
recursive = true

# --- Black ----------------------------------------------------------------
[tool.black]
line-length = 110
target-version = [ "py311", "py312", "py313", "py314" ]
include = "\\.pyi?$"

# --- isort ----------------------------------------------------------------
[tool.isort]
profile = "black"
line_length = 110

# --- flake8 (requires Flake8-pyproject plugin) ----------------------------
[tool.flake8]
max-line-length = 110
extend-select = [ "B950" ]
extend-ignore = [ "E203", "E501", "W503" ]
exclude = [
  ".git",
  "__pycache__",
  ".venv",
  "venv",
  "build",
  "dist",
  ".eggs",
  "*.egg-info",
]
per-file-ignores = [ "tests/*:S101" ]

# --- pylint ----------------------------------------------------------------
[tool.pylint]
"messages control".disable = [
  "missing-module-docstring",
  "missing-class-docstring",
  "missing-function-docstring",
]
format.max-line-length = 110
# --- pylint ---------------------------------------------------------------
main.py-version = "3.11"

# --- codespell ------------------------------------------------------------
[tool.codespell]
skip = ".git,.tox,.venv,.mypy_cache,.pytest_cache,*.pyc,.coverage,.gitignore,LICENSE,*.lock,./docs/_build"

# --- docformatter ----------------------------------------------------------
[tool.docformatter]
wrap_length = 110
wrap_summaries = 110
wrap_descriptions = 110
black = true
style = "pep257"
make_summary_multi_line = false
close_quotes_on_newline = false
pre_summary_newline = false

# --- bandit ---------------------------------------------------------------
[tool.bandit]
exclude_dirs = [ "tests", ".venv", ".tox" ]

# --- mypy -----------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_unreachable = true
ignore_missing_imports = true
explicit_package_bases = false
mypy_path = "src"
namespace_packages = false
overrides = [
  # click's decorators look "untyped" to mypy --strict (their generic return
  # types don't propagate cleanly through @click.option chains). Relaxing the
  # rule just for cli.py keeps strict-mode honest everywhere else.
  { module = "gamesheet_sdk.cli", disallow_untyped_decorators = false },
  { module = "tests.*", disable_error_code = [
    "arg-type",
    "call-arg",
    "return-value",
    "untyped-decorator",
    "var-annotated",
  ] },
]

# --- pytest ---------------------------------------------------------------
[tool.pytest]
ini_options.minversion = "8.0"
# --block-network is pytest-recording: any test that opens a socket without
# replaying a VCR cassette (or escaping via @pytest.mark.allow_hosts) fails.
# This forces the test suite to stay deterministic and offline-capable.
ini_options.addopts = "-ra --strict-markers --strict-config --block-network"
ini_options.testpaths = [ "tests" ]
ini_options.pythonpath = [ "src" ]
ini_options.markers = [
  "vcr: replay HTTP from a VCR cassette under tests/cassettes/",
  "browser: drives a real headless Chromium via Playwright (slow; skip with -m 'not browser')",
]

[tool.coverage]
# --- coverage -------------------------------------------------------------
run.branch = true
run.source = [ "gamesheet_sdk" ]
# Coverage floor: pytest --cov fails if total coverage drops below this.
# Current is ~89%; raise as the suite grows.
report.fail_under = 80
report.show_missing = true
report.skip_covered = true

# --- pyroma ---------------------------------------------------------------
[tool.pyroma]
# Fail the command if the score is lower than the given number (out of 10)
min_score = 10

# --- tox ------------------------------------------------------------------
[tool.tox]

# --- PyMarkdown -----------------------------------------------------------
[tool.pymarkdown]
plugins.commands-show-output.enabled = false
plugins.line-length.enabled = true
plugins.line-length.line_length = 220
plugins.line-length.heading_line_length = 220
plugins.line-length.code_block_line_length = 220
