[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "gamesheet-sdk-py"
version = "0.0.1"
description = "Unofficial Python SDK and CLI for the GameSheet Inc. platform — automates WebUI procedures where a native API is absent."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { file = "LICENSE" }
authors = [
  { name = "bdperkin" },
]
keywords = ["gamesheet", "hockey", "sports", "sdk", "cli", "automation", "scraper"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  "playwright>=1.45",
  "lxml>=5.2",
  "pydantic>=2.7",
  "click>=8.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "black>=26.3",
  "flake8>=7.1",
  "Flake8-pyproject>=1.2",
  "pre-commit>=3.7",
  "mypy>=1.10",
  "types-requests>=2.32",
  "build>=1.2",
  "tox>=4.21",
  "isort>=5.13",
  "pyupgrade>=3.19",
  "bandit[toml]>=1.7",
  "codespell>=2.4",
  "mdformat>=0.7",
  "mdformat-gfm>=0.4",
  "yamllint>=1.38",
  "validate-pyproject>=0.25",
  "editorconfig-checker>=3.6",
]

[project.scripts]
gamesheet-sdk-py = "gamesheet_sdk.cli:main"

[project.urls]
Homepage      = "https://github.com/bdperkin/gamesheet-sdk-py"
Repository    = "https://github.com/bdperkin/gamesheet-sdk-py"
Issues        = "https://github.com/bdperkin/gamesheet-sdk-py/issues"
Documentation = "https://github.com/bdperkin/gamesheet-sdk-py#readme"

# --- Hatch ----------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/gamesheet_sdk"]

[tool.hatch.build.targets.sdist]
include = [
  "src/gamesheet_sdk",
  "tests",
  "docs",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]

# --- Black ----------------------------------------------------------------
[tool.black]
line-length = 88
target-version = ["py311", "py312", "py313", "py314"]
include = '\.pyi?$'

# --- isort ----------------------------------------------------------------
[tool.isort]
profile = "black"
line_length = 88

# --- bandit ---------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", ".venv", ".tox"]

# --- codespell ------------------------------------------------------------
[tool.codespell]
skip = ".git,.tox,.venv,.mypy_cache,.pytest_cache,*.pyc,.coverage,.gitignore,LICENSE,*.lock"

# --- flake8 (requires Flake8-pyproject plugin) ----------------------------
[tool.flake8]
max-line-length = 88
extend-select = ["B950"]
extend-ignore = ["E203", "E501", "W503"]
exclude = [
  ".git",
  "__pycache__",
  ".venv",
  "venv",
  "build",
  "dist",
  ".eggs",
  "*.egg-info",
]
per-file-ignores = ["tests/*:S101"]

# --- pytest ---------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]

# --- coverage -------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["gamesheet_sdk"]

[tool.coverage.report]
show_missing = true
skip_covered = true

# --- mypy -----------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_unreachable = true
ignore_missing_imports = true

# --- pylint ---------------------------------------------------------------
[tool.pylint.main]
py-version = "3.11"

[tool.pylint.format]
max-line-length = 88

[tool.pylint."messages control"]
disable = [
  "missing-module-docstring",
  "missing-class-docstring",
  "missing-function-docstring",
]

# --- tox ------------------------------------------------------------------
[tool.tox]
legacy_tox_ini = """
[tox]
requires = tox>=4.21
env_list = py311, py312, py313, py314, lint, type, pylint, security, files-check

[testenv]
description = Run the pytest suite under {base_python}
package = editable
extras = dev
commands = pytest --cov {posargs}

[testenv:lint]
description = Python style checks (black --check, isort --check, flake8 via Flake8-pyproject)
skip_install = true
deps =
    black>=26.3
    isort>=5.13
    flake8>=7.1
    Flake8-pyproject>=1.2
commands =
    black --check src tests
    isort --check src tests
    flake8 src tests

[testenv:type]
description = Type-check with mypy --strict
extras = dev
commands = mypy src

[testenv:pylint]
description = Lint with pylint (config in pyproject.toml)
extras = dev
deps = pylint>=4.0
commands = pylint src tests

[testenv:security]
description = Security scan with bandit (config in [tool.bandit])
skip_install = true
deps = bandit[toml]>=1.7
commands = bandit -c pyproject.toml -r src

[testenv:files-check]
description = Non-Python file checks (codespell, yamllint, validate-pyproject, editorconfig-checker, mdformat --check)
skip_install = true
deps =
    codespell>=2.4
    yamllint>=1.38
    validate-pyproject>=0.25
    editorconfig-checker>=3.6
    mdformat>=0.7
    mdformat-gfm>=0.4
commands =
    codespell
    yamllint -d relaxed .pre-commit-config.yaml .github/workflows
    validate-pyproject pyproject.toml
    ec
    mdformat --check CLAUDE.md README.md docs

[testenv:fix]
description = Apply auto-formatters in place (isort, black, mdformat)
skip_install = true
deps =
    black>=26.3
    isort>=5.13
    mdformat>=0.7
    mdformat-gfm>=0.4
commands =
    isort src tests
    black src tests
    mdformat CLAUDE.md README.md docs
"""
