  "pyright",
  "pyroma",
  "pytest",
  "python-semantic-release",
  "radon",
  "ruff",
  "semgrep",
  "static-analysis",
  "tools",
  "type-checkers",
  "type-stubs",
  "validate-pyproject",
  "vulture",
  "yamlfix",
