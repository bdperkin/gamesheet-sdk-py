]
optional_dependencies_dev_groups = [
  "absolufy-imports",
  "add-trailing-comma",
  "all",
  "autoflake",
  "autopep8",
  "bandit",
  "black",
  "blacken-docs",
  "blocklint",
  "codespell",
  "deptry",
  "dev",
  "docconvert",
  "docformatter",
  "docs",
  "editorconfig-checker",
  "flake8",
  "flake8-plugins",
  "interrogate",
  "isort",
  "mdformat",
  "mypy",
  "pydocstyle",
  "pylint",
  "pymarkdown",
  "pyproject-fmt",
  "pyrefly",
  "pyright",
  "pyroma",
  "psr",
  "pytest",
  "pyupgrade",
  "radon",
  "refurb",
  "sphinx-lint",
  "ssort",
  "tox-ini-fmt",
  "type-stubs",
  "unimport",
  "validate-pyproject",
  "vulture",
  "yamllint",
