level = "WARNING"
stack-trace = false

## ## mdformat - Markdown formatter
[tool.mdformat]
end_of_line = "lf"
number = true
validate = true
wrap = 160

## ## markdown-toc-creator - Create table of contents for markdown files
[tool.markdown_toc_creator]
proactive = "True"
style = "github"
exclude = ".git|.uv|.pytest_cache|CHANGELOG.md"
in-place = "True"
quiet = "False"
skip-first-n-lines = 1
add-toc-title = "False"
toc-title = "Table of Contents"
add-horizontal-rules = "True"
horizontal-rule-style = "mdformat"

## ---------------------------------------------------------------------------------------------------------------------
## Python
## ---------------------------------------------------------------------------------------------------------------------
## # -------------------------------------------------------------------------------------------------------------------
## # Configuration File Linters & Formatters
## # -------------------------------------------------------------------------------------------------------------------
## ## validate-pyproject - Pyproject.toml validator
[tool.validate-pyproject]
check = true
diff = true
recursive = true

## ## pyroma - Packaging quality checker
[tool.pyroma]
check = true
diff = true
min_score = 10
recursive = true

## ## sphinx-lint - Sphinx/reStructuredText linter
[tool.sphinx-lint]
check = true
diff = true
recursive = true

## ## blocklint - Inclusive language checker
[tool.blocklint]
check = true
diff = true
recursive = true

## ## radon - Code metrics and complexity calculator
[tool.radon]
cc_min = "A"
check = true
diff = true
# Indentation size for output.
indent = 4
min_rank = "A"
recursive = true
# Show closures in the complexity results.
show_closures = true
# Display the total average at the end.
total_average = true
max-absolute = "A"
max-modules = "A"
max-average = "B"
