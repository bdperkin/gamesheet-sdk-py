# ======================================================================================================================
# Project Build & Tooling Configuration (PEP 518 / PEP 621)
# ======================================================================================================================
# This file configures the project metadata, dependencies, and 37 development tools.
#
# NOTE: Some [tool.*] sections include a non-standard `description` field. These are not part of the official
# tool specifications but are included as inline documentation for maintainability. Tools ignore unknown fields,
# so these description fields are harmless and aid in understanding each tool's purpose.
# ======================================================================================================================
# ----------------------------------------------------------------------------------------------------------------------
# Build System Back-end Settings
# ----------------------------------------------------------------------------------------------------------------------
[build-system]
build-backend = "hatchling.build"
requires = [
  "hatchling",
]

# ----------------------------------------------------------------------------------------------------------------------
# Project Metadata
# ----------------------------------------------------------------------------------------------------------------------
[project]
name = "gamesheet-sdk-py"
version = "0.5.3"
description = """\
  Unofficial Python SDK and CLI for the GameSheet Inc. platform — automates WebUI procedures where a \
  native API is absent.\
  """
readme = "README.md"
keywords = [
  "automation",
  "cli",
  "gamesheet",
  "hockey",
  "scraper",
  "sdk",
  "sports",
]
license.file = "LICENSE"
authors = [
  { email = "bdperkin@gmail.com", name = "bdperkin" },
]
requires-python = ">=3.11,<3.15"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "click==8.4.2",
  "colorlog==6.12.0",
  "playwright==1.62.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "python-dateutil==2.9.0.post0",
  "pyyaml==6.0.3",
  "requests==2.34.2",
  "rich==14.3.4",
  "rich-click==1.9.8",
  "tabulate==0.10.0",
  "tzlocal==5.4.4",
  "urllib3==2.7.0",
]
optional-dependencies.absolufy-imports = [
  "absolufy-imports==0.3.1",
]
optional-dependencies.add-trailing-comma = [
  "add-trailing-comma==4.0.0",
]
optional-dependencies.architecture = [
  "gamesheet-sdk-py[radon,xenon]",
]
optional-dependencies.blank-line-after-blocks = [
  "blank-line-after-blocks==0.1.4",
]
optional-dependencies.blocklint = [
  "blocklint==0.3.0",
]
optional-dependencies.checks = [
  "gamesheet-sdk-py[editorconfig-checker]",
]
optional-dependencies.codespell = [
  "codespell==2.4.3",
]
optional-dependencies.configuration = [
  "gamesheet-sdk-py[format-json,pyproject-fmt,pyroma,validate-pyproject,yamlfix,yamllint]",
]
optional-dependencies.deptry = [
  "deptry==0.25.1",
  """\
  gamesheet-sdk-py[architecture,checks,configuration,docs,format,markdown,pytest,python-semantic-release,qual\
  ity,security,type-stubs,types]\
  """,
]
optional-dependencies.detect-secrets = [
  "detect-secrets==1.5.0",
]
optional-dependencies.dev = [
  "pre-commit==4.6.2",
  "pre-commit-uv==4.3.0",
  "uv==0.12.5",
]
optional-dependencies.docs = [
  "furo==2025.12.19",
  "myst-parser[linkify]==5.1.0",
  "sphinx-autobuild==2025.8.25",
  "sphinx-click==6.2.0",
  "sphinx-copybutton==0.5.2",
  "sphinx-design==0.7.0",
  "sphinx-lint==1.0.2",
]
optional-dependencies.editorconfig-checker = [
  "editorconfig-checker==3.11.1",
]
optional-dependencies.format = [
  "gamesheet-sdk-py[absolufy-imports,add-trailing-comma,blank-line-after-blocks,ruff,ssort,unimport]",
]
optional-dependencies.format-json = [
  "format-json==0.1.2",
]
optional-dependencies.interrogate = [
