## # ----------------------------------------------------------------------------
## # Security, Metrics & Complexity
## # ----------------------------------------------------------------------------
## ## bandit - Security vulnerability scanner
[tool.bandit]
exclude_dirs = [
  ".coverage",
  ".mypy_cache",
  ".pytest_cache",
  ".tox",
  ".venv",
  "coverage.xml",
  "dist",
]
skips = [
  "B101",
  "B106",
]
check = true
description = """\
  Scans Python source code to find common security flaws and vulnerabilities (like hardcoded passwords or insecure \
  functions).\
  """
diff = true

## ## mypy - Industry-standard static type checker
[tool.mypy]
python_version = "3.11"
strict = true
plugins = [ "pydantic.mypy" ]

## ## pyrefly - Code health and quality reviewer
[tool.pyrefly]
python_version = "3.11"

## # ----------------------------------------------------------------------------
## # Type Checkers
## # ----------------------------------------------------------------------------
## ## pyright - Fast Python type checker
[tool.pyright]
# Target environment settings
pythonVersion = "3.11"
pythonPlatform = "Linux"
# Main severity mode: "standard" or "strict"
typeCheckingMode = "standard"
# Look into library code to extract type information if stubs are missing
useLibraryCodeForTypes = true
# Directories or files to include for type checking
include = [ "." ]
# Directories or files to exclude from type checking
exclude = [
  "**/__pycache__",
  ".coverage",
  ".mypy_cache",
  ".pytest_cache",
  ".tox",
  ".venv",
  "coverage.xml",
  "dist",
]
# Ignore errors inside specific files
ignore = []
reportGeneralTypeIssues = "error"
# Override specific rules
reportMissingTypeStubs = "warning"
reportUnknownMemberType = false
executionEnvironments = [
  { root = "tests", reportArgumentType = false, reportCallIssue = false },
]

[tool.coverage]
run.branch = true
run.parallel = false
## ## coverage - Test coverage measurement
## Without this block, `pytest --cov` has no source path to instrument
## and emits an empty coverage.xml — which Codecov registers as an
## upload but with no data, surfacing as "No report uploaded" on every
## flag and component. See https://coverage.readthedocs.io/
run.source = [ "src/gamesheet_sdk" ]
## Collapse coverage from the installed package onto the src layout so
## paths in coverage.xml match the component / flag path filters in
## .codecov.yml.
paths.source = [ "src/gamesheet_sdk", "*/site-packages/gamesheet_sdk" ]
report.exclude_also = [
  "@overload",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
report.fail_under = 100
report.show_missing = true

## ## python-semantic-release - Automated semantic versioning and changelog generation
[tool.semantic_release]
tag_format = "v{version}"
# Version strategy: patch-only until 1.0.0, then standard semver
major_on_zero = false
allow_zero_version = true
# Version management - PSR writes to pyproject.toml
version_toml = [ "pyproject.toml:project.version" ]
build_command = "pre-commit run mdformat --files CHANGELOG.md ; pre-commit run pymarkdown --files CHANGELOG.md && python -m build"
commit_message = "chore(release): {version}\n\nAutomatically generated by python-semantic-release"
commit_author = "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
# Commit parsing - use conventional commits
commit_parser = "conventional"
# Commit parser options - force patch-only bumps until 1.0.0
# After 1.0.0, remove this section to restore standard semver (feat → minor, fix → patch)
commit_parser_options.minor_tags = []  # Empty - no minor bumps until 1.0.0
commit_parser_options.patch_tags = [ "feat", "fix", "perf" ]  # All releasable commits trigger patch bump
# Branches configuration
branches.main.match = "main"
branches.main.prerelease = false
changelog.default_templates.changelog_file = "CHANGELOG.md"
changelog.exclude_commit_patterns = []
changelog.insertion_flag = "<!--next-version-placeholder-->"
changelog.mode = "update"
# Enable tag creation and pushing
push = true
tag = true
# We handle PyPI publishing and GitHub Release creation in workflow
# to support TestPyPI validation step before production publish
upload_to_pypi = false
upload_to_release = false

[tool.mypy-pydantic]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

## ## docconvert - Docstring format
[tool.docconvert]
recursive = true
black = true
wrap-summaries = 110
wrap-descriptions = 110
exclude = [
  ".coverage",
  "coverage.xml",
  "dist",
  ".mypy_cache",
  ".pytest_cache",
  ".tox",
  ".venv",
]
description = "Check docstrings in existing Python files for correct format."

