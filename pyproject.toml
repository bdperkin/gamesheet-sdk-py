# ======================================================================================================================
# Project Build & Tooling Configuration (PEP 518 / PEP 621)
# ======================================================================================================================
# This file configures the project metadata, dependencies, and 37 development tools.
#
# NOTE: Some [tool.*] sections include a non-standard `description` field. These are not part of the official
# tool specifications but are included as inline documentation for maintainability. Tools ignore unknown fields,
# so these description fields are harmless and aid in understanding each tool's purpose.
# ======================================================================================================================
# ----------------------------------------------------------------------------------------------------------------------
# Build System Back-end Settings
# ----------------------------------------------------------------------------------------------------------------------
[build-system]
build-backend = "hatchling.build"
requires = [
  "hatchling",
]

