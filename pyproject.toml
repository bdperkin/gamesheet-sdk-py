mode.strict-config = true
plugins.commands-show-output.enabled = false
plugins.line-length.code_block_line_length = 160
plugins.line-length.code_blocks = true
plugins.line-length.heading_line_length = 160
plugins.line-length.headings = true
plugins.line-length.line_length = 160
plugins.line-length.links = false
plugins.no-duplicate-heading.siblings_only = true
plugins.no-multiple-blanks.maximum = 4
plugins.no-trailing-punctuation.punctuation = ""
plugins.ul-indent.indent = 4
recursive = true
level = "WARNING"
stack-trace = false

## ## mdformat - Markdown formatter
[tool.mdformat]
end_of_line = "lf"
exclude = [
  ".coverage",
  "coverage.xml",
  "dist/**",
  ".mypy_cache/**",
  ".pytest_cache/**",
  ".tox/**",
  ".venv/**",
]
number = true
validate = true
wrap = 160

## -----------------------------------------------------------------------------
## Python
## -----------------------------------------------------------------------------
## # ----------------------------------------------------------------------------
## # Configuration File Linters & Formatters
## # ----------------------------------------------------------------------------
## ## tox-ini-fmt - Tox configuration formatter
[tool.tox-ini-fmt]
check = true
description = "A lightweight tool that automatically fixes and formats the styling of `tox.ini` files."
diff = true
recursive = true

## ## validate-pyproject - Pyproject.toml validator
[tool.validate-pyproject]
check = true
description = "Validates `pyproject.toml` files against schemas to ensure they are structurally valid for packaging tools."
diff = true
recursive = true

## ## pyroma - Packaging quality checker
[tool.pyroma]
check = true
description = """\
  Rates your Python project's packaging configuration (`setup.py` or `pyproject.toml`) for compliance with PyPI best \
  practices.\
  """
diff = true
min_score = 10
recursive = true

## # ----------------------------------------------------------------------------
## # Code Style & Formatting (Automated Fixers)
## # ----------------------------------------------------------------------------
## ## pyupgrade - Syntax modernizer
[tool.pyupgrade]
check = true
description = "Automatically upgrades older Python syntax features to match newer language versions."
diff = true
recursive = true

## ## ssort - Code statement sorter
[tool.ssort]
check = true
description = """\
  Reorders the top-level statements (functions, classes) in a Python file so that dependent items come after their \
  definitions.\
  """
diff = true
recursive = true

## # ----------------------------------------------------------------------------
## # Code Cleaners & Dead Code Detectors
## # ----------------------------------------------------------------------------
## ## unimport - Unused import remover
[tool.unimport]
gitignore = true

## ## autoflake - Basic code cleaner
[tool.autoflake]
check = true
description = "Automatically removes unused imports and unused variables from Python code."
recursive = true

## ## sphinx-lint - Sphinx/reStructuredText linter
[tool.sphinx-lint]
check = true
description = "Checks reStructuredText files for common structural mistakes and syntax bugs specific to Sphinx documentation."
diff = true
recursive = true

## ## blacken-docs - Documentation code block formatter
[tool.blacken-docs]
check = true
description = "Applies the `black` code formatter to Python code snippets embedded inside Markdown or reStructuredText documentation."
diff = true
recursive = true

## ## pydocstyle - Docstring compliance linter
[tool.pydocstyle]
add-ignore = "D105,D107"

## # ----------------------------------------------------------------------------
## # Code Quality Linters & Static Analysis
## # ----------------------------------------------------------------------------
## ## blocklint - Inclusive language checker
[tool.blocklint]
check = true
description = "A simple linter that flags the use of non-inclusive words (like 'whitelist' or 'master') in code comments or strings."
diff = true
recursive = true

## ## refurb - Code modernization advisor
[tool.refurb]
enable_all = true
python_version = "3.11"

## ## radon - Code metrics and complexity calculator
[tool.radon]
cc_min = "A"
check = true
description = """\
  Computes various code metrics, including Maintainability Index and Cyclomatic Complexity, to identify bloated or \
  confusing code.\
  """
diff = true
indent = 4  # Indentation size for output
min_rank = "A"
recursive = true
show_closures = true  # Show closures in the complexity results
total_average = true  # Display the total average at the end
