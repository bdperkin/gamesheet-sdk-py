plugins.no-trailing-punctuation.punctuation = ".,;:!。，；：！"
plugins.no-trailing-spaces.br_spaces = 2
plugins.no-trailing-spaces.enabled = true
plugins.no-trailing-spaces.list_item_empty_lines = false
plugins.no-trailing-spaces.strict = false
plugins.ol-prefix.allow_extended_start_values = false
plugins.ol-prefix.enabled = true
plugins.ol-prefix.style = "one_or_ordered"
plugins.per-file-ignores = {}
plugins.proper-names.code_blocks = true
plugins.proper-names.code_spans = true
plugins.proper-names.enabled = true
plugins.proper-names.names = ""
plugins.required-headings.enabled = true
plugins.required-headings.headings = ""
plugins.single-title.enabled = true
plugins.single-title.front_matter_title = "title"
plugins.single-title.level = 1
plugins.single-trailing-newline.enabled = true
plugins.strong-style.enabled = true
plugins.strong-style.style = "consistent"
plugins.ul-indent.enabled = true
plugins.ul-indent.indent = 2
plugins.ul-indent.start_indented = false
plugins.ul-start-left.enabled = false
plugins.ul-style.enabled = true
plugins.ul-style.style = "consistent"
system.exclude_path = []

[tool.radon]
cc_min = "A"
exclude = ""
max_cc = 5
mi_min = "A"
no_assert = false
show_closures = true
total_average = true

[tool.xenon]
exclude = ""
ignore = ""
max_absolute = "A"
max_average = "A"
max_modules = "A"

[tool.yamlfix]
allow_duplicate_keys = false
comments_min_spaces_from_content = 2
comments_require_starting_space = true
comments_whitelines = 1
explicit_start = true
indent_mapping = 2
indent_offset = 2
indent_sequence = 4
line_length = 110
none_representation = ""
preserve_quotes = true
quote_basic_values = false
quote_keys_and_basic_values = false
quote_representation = '"'
section_whitelines = 1
sequence_style = "block_style"
whitelines = 1
