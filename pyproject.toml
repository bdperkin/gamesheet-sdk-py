## ## yamlfix - YAML file formatter
[tool.yamlfix]
check = true
diff = true
recursive = true
allow_duplicate_keys = false
comments_min_spaces_from_content = 1
comments_require_starting_space = true
whitelines = 1
comments_whitelines = 1
section_whitelines = 1
explicit_start = true
sequence_style = "block_style"
indent_mapping = 2
indent_offset = 2
indent_sequence = 4
line_length = 110
none_representation = ""
quote_basic_values = false
quote_keys_and_basic_values = false
quote_representation = '"'
preserve_quotes = true
preserve_block_scalars = true
whitelines_adjusting = true
exclude = [ "venv/*", ".git/*" ]

## ## yamllint - YAML file linter
[tool.yamllint]
check = true
diff = true
recursive = true

## # -------------------------------------------------------------------------------------------------------------------
## # Documentation & Markdown Tools
## # -------------------------------------------------------------------------------------------------------------------
## ## pymarkdown - Markdown linting engine
[tool.pymarkdown]
check = true
diff = true
mode.strict-config = true
plugins.commands-show-output.enabled = false
