# ==============================================================================
# Project Build & Tooling Configuration (PEP 518 / PEP 621)
# ==============================================================================
# ------------------------------------------------------------------------------
# Build System Back-end Settings
# ------------------------------------------------------------------------------
[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

# ------------------------------------------------------------------------------
# Project Metadata
# ------------------------------------------------------------------------------
[project]
name = "gamesheet-sdk-py"
version = "0.1.40"
description = """\
  Unofficial Python SDK and CLI for the GameSheet Inc. platform — automates WebUI procedures where a native API is \
  absent.\
  """
readme = "README.md"
keywords = [ "automation", "cli", "gamesheet", "hockey", "scraper", "sdk", "sports" ]
license = { file = "LICENSE" }
authors = [ { name = "bdperkin", email = "bdperkin@gmail.com" } ]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "click",
  "colorlog",
  "playwright",
  "pydantic",
  "pydantic-settings",
  "pyyaml",
  "requests",
  "rich",
  "rich-click",
  "tabulate",
  "urllib3",
]
optional-dependencies.absolufy-imports = [
  "absolufy-imports",
]
optional-dependencies.add-trailing-comma = [
  "add-trailing-comma",
]
optional-dependencies.all = [
  """\
  gamesheet-sdk-py[absolufy-imports,add-trailing-comma,autoflake,autopep8,bandit,black,blacken-docs,blocklint,codespell\
  ,deptry,dev,docconvert,docformatter,docs,editorconfig-checker,flake8,interrogate,isort,mdformat,mypy,pydocstyle,pylin\
  t,pymarkdown,pyproject-fmt,pyrefly,pyright,pyroma,psr,pyupgrade,radon,refurb,sphinx-lint,ssort,tox-ini-fmt,unimport,v\
  alidate-pyproject,vulture,yamllint]\
