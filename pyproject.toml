## ## pyproject-fmt - Pyproject.toml formatter
[tool.pyproject-fmt]
column_width = 120
indent = 2
keep_full_version = true
table_format = "short"
check = true
diff = true
recursive = true

## # -------------------------------------------------------------------------------------------------------------------
## # Security, Metrics & Complexity
## # -------------------------------------------------------------------------------------------------------------------
## ## bandit - Security vulnerability scanner
[tool.bandit]
exclude_dirs = [
  ".local",
  ".pytest_cache",
  ".venv",
  "docs/_build",
]
skips = [
  "B101",
  "B105",
  "B106",
  "B107",
  "B404",
  "B603",
  "B607",
]
check = true
diff = true
recursive = true

## ## mypy - Industry-standard static type checker
[tool.mypy]
mypy_path = [
  "src",
  "tools",
]
exclude_gitignore = true
python_version = "3.11"
strict = true
plugins = [
  "pydantic.mypy",
]
overrides = [
  # Third-party libraries: Ignore missing type stubs
  { module = [
    "_constants",
    "pre_commit.clientlib",
  ], ignore_missing_imports = true },
]

## ## pyrefly - Code health and quality reviewer
[tool.pyrefly]
python_version = "3.11"
project-includes = [
  "docs",
  "src",
  "tests",
  "tools",
]
search-path = [
  "docs",
  "src",
  "tests",
  "tools",
  ".",
]

## # -------------------------------------------------------------------------------------------------------------------
## # Type Checkers
## # -------------------------------------------------------------------------------------------------------------------
## ## pyright - Fast Python type checker
[tool.pyright]
# Target environment settings.
pythonVersion = "3.11"
pythonPlatform = "Linux"
# Optional: Keep test errors separate or less severe if they block CI.
# typeCheckingMode = "basic"
# Look into library code to extract type information if stubs are missing.
useLibraryCodeForTypes = true
# Directories or files to include for type checking.
include = [
  "docs",
  "src",
  "tests",
  "tools",
]
# Directories or files to exclude from type checking.
exclude = [
  ".local",
  ".pytest_cache",
  ".venv",
  "docs/_build",
]
# Ignore errors inside specific files.
ignore = []
extraPaths = [
  ".",
  "docs",
  "src",
  "tests",
  "tools",
]
reportGeneralTypeIssues = "error"
# Override specific rules.
reportMissingTypeStubs = "warning"
reportUnknownMemberType = false
executionEnvironments = [
  { root = "tests", reportArgumentType = false, reportCallIssue = false },
]

## ## pytest - Testing framework
# Test discovery, markers, and default options for pytest test runner.
# Custom markers must be registered here when using --strict-markers.
[tool.pytest]
# Minimum Python version for tests
ini_options.minversion = "7.0"
# Test discovery patterns
ini_options.testpaths = [
  "tests",
]
ini_options.python_files = [
  "test_*.py",
]
ini_options.python_classes = [
  "Test*",
]
ini_options.python_functions = [
  "test_*",
]
# Command-line options applied by default
ini_options.addopts = [
  "--strict-markers", # Raise error for unregistered markers
  "--strict-config",  # Raise error for invalid config
  "--tb=short",       # Shorter traceback format
  "-ra",              # Show all test summary info except passed
  "--block-network",  # Block network access (from pytest-recording)
]
# Custom markers (must be registered to use --strict-markers)
ini_options.markers = [
  "allowed_hosts: List of regex patterns for hosts where connections are allowed",
  "block_network: Block all network access except VCR recording",
  "browser: Requires headless Chromium via pytest-playwright (slow tests)",
  "default_cassette: Override the default VCR cassette name",
  "vcr: Uses VCR.py to replay HTTP interactions from cassettes",
]
# Warnings
ini_options.filterwarnings = [
  "error",                                         # Turn warnings into errors
  "ignore::DeprecationWarning:pytest_recording.*",
  "ignore::DeprecationWarning:urllib3.*",
]
# Console output
ini_options.console_output_style = "progress"

[tool.coverage]
run.branch = true
run.parallel = false
## ## coverage - Test coverage measurement
# Without this block, `pytest --cov` has no source path to instrument and emits an empty coverage.xml — which Codecov
# registers as an upload but with no data, surfacing as "No report uploaded" on every flag and component. See
# https://coverage.readthedocs.io/.
run.source = [
  "src/gamesheet_sdk",
]
# Collapse coverage from the installed package onto the src layout so paths in coverage.xml match the component / flag
# path filters in .codecov.yml.
paths.source = [
  "src/gamesheet_sdk",
  "*/site-packages/gamesheet_sdk",
]
report.exclude_also = [
  "@overload",
  "if TYPE_CHECKING:",
  "pragma: no cover",
  "raise NotImplementedError",
]
report.fail_under = 100
report.show_missing = true

## ## python-semantic-release - Automated semantic versioning and changelog generation
[tool.semantic_release]
tag_format = "v{version}"
# Version strategy: patch-only (feat/fix/perf → patch) until minor bumps are re-enabled.
# major_on_zero = false prevents breaking changes from bumping to 1.0.0.
major_on_zero = false
allow_zero_version = true
# Version management - PSR writes to pyproject.toml.
version_toml = [
  "pyproject.toml:project.version",
]
build_command = """
set -e
uv run --extra mdformat   mdformat        CHANGELOG.md
uv run --extra pymarkdown pymarkdown scan CHANGELOG.md
uv build
"""
commit_message = "chore(release): {version}\n\nAutomatically generated by python-semantic-release"
commit_author = "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
# Commit parsing - use conventional commits.
commit_parser = "conventional"
# Commit parser options - patch-only bumps until minor is re-enabled.
commit_parser_options.minor_tags = []
commit_parser_options.patch_tags = [
  "feat",
  "fix",
  "perf",
]
# Branches configuration.
branches.main.match = "main"
branches.main.prerelease = false
changelog.default_templates.changelog_file = "CHANGELOG.md"
changelog.exclude_commit_patterns = []
changelog.insertion_flag = "<!--next-version-placeholder-->"
changelog.mode = "update"
# Enable tag creation and pushing.
push = true
tag = true
# We handle PyPI publishing and GitHub Release creation in workflow to support TestPyPI validation step before
# production publish.
upload_to_pypi = false
upload_to_release = false

[tool.mypy-pydantic]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

