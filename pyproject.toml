description = "Automatically reformats Python docstrings to follow PEP 257 description and spacing conventions."

## ## interrogate - Docstring coverage checker
[tool.interrogate]
fail-under = 100
ignore-init-method = true
ignore-magic = true
ignore-semiprivate = true
ignore-nested-functions = true
exclude = [
  "tests",
]
check = true
description = "Measures and flags the percentage of your code (modules, classes, methods) that lacks documentation."
diff = true
recursive = true

## ## deptry - Dependency analyzer
