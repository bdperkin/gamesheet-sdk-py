# ----------------------------------------------------------------------------------------------------------------------
# Tool Configurations
# ----------------------------------------------------------------------------------------------------------------------
## ## hatch - Extensible, lifecycle management tool for Python
[tool.hatch]
build.targets.wheel.packages = [
  "src/gamesheet_sdk",
]
build.targets.sdist.include = [
  "docs",
  "LICENSE",
  "pyproject.toml",
  "README.md",
  "src",
  "tests",
]

[tool.uv]
# Transitive-dependency override. semgrep hard-pins mcp==1.23.3 (every release
# to date does, including the latest), and that version carries three HIGH
# advisories: CVE-2026-52869, CVE-2026-52870, CVE-2026-59950. A constraint
# cannot fix this — constraints only narrow, and >=1.28.1 conflicts with an
# exact ==1.23.3 — so the requirement is overridden outright.
#
# Must stay an exact pin bounded below 2. A floor alone resolves to mcp 2.0.0,
# which drops mcp.server.fastmcp; semgrep/cli.py imports semgrep.commands.mcp
# unconditionally, so the semgrep binary fails to start at all. Verified that
# semgrep 1.172.0 scans normally against mcp 1.29.0.
#
# Bounds: >=1.28.1 (advisories), <2 (compatibility). Review 2026-11-09, or drop
# this entirely once semgrep loosens its pin. To be managed by tools/syncdeps.
override-dependencies = [
  "mcp==1.29.0",
]
package = true

## ## ruff - An extremely fast Python linter and code formatter
[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = [
  ".local",
  ".pytest_cache",
  ".venv",
  "docs/_build",
]
format.indent-style = "space"
format.quote-style = "double"
format.line-ending = "auto"
format.skip-magic-trailing-comma = false
format.docstring-code-format = true
lint.select = [
  "ALL",
]
lint.ignore = [
  "ANN401",  # Dynamically typed expressions (typing.Any)
  "C901",    # Function is too complex
  "COM812",  # Trailing comma missing - handled by ruff format
  "D107",    # Missing docstring in __init__
  "D301",    # Use r""" if any backslashes in a docstring
  "D417",    # Missing argument description in docstring
  "DTZ",     # Naive datetime checks
  "E501",    # Line too long - handled by ruff format
  "FBT001",  # Boolean-typed positional argument
  "FBT002",  # Boolean-typed positional default value
  "FBT003",  # Boolean positional value in function call
  "FIX002",  # Line contains TODO
  "ISC001",  # Implicit string concatenation - handled by ruff format
  "PLC0415", # Import outside top-level
  "PLR0912", # Too many branches
  "PLR0913", # Too many arguments
  "PLR0915", # Too many statements
  "PLR0917", # Too many positional arguments
  "PLR2004", # Magic value comparison
  "S105",    # Possible hardcoded password
  "TC001",   # Move application import into type-checking block
  "TC002",   # Move third-party import into type-checking block
  "TC003",   # Move standard library import into type-checking block
  "TD002",   # Missing author in TODO
  "TD003",   # Missing issue link on line for TODO
]
lint.per-file-ignores."docs/*" = [
  "A001",
  "INP001",
  "PLW2901",
  "RUF001",
  "S101",
  "S603",
  "S607",
  "T201",
]
lint.per-file-ignores."tests/*" = [
  "ANN",
  "ARG",
  "D",
  "DTZ",
  "PLR2004",
  "RUF043",
  "S101",
  "S105",
  "S106",
  "S107",
  "SLF001",
]
lint.per-file-ignores."tools/*" = [
  "INP001",
  "S101",
  "S603",
  "S607",
  "T201",
]
lint.pydocstyle.convention = "google"

## # -------------------------------------------------------------------------------------------------------------------
## # Documentation & Docstring Tools
## # -------------------------------------------------------------------------------------------------------------------
## ## codespell - Typos and spelling checker
[tool.codespell]
builtin = "code,en-GB_to_en-US,informal,names,rare,usage"
ignore-words = "custom-dictionary.txt"
skip = "docs/_build,.local,.pytest_cache,.venv,uv.lock"

## ## interrogate - Docstring coverage checker
[tool.interrogate]
fail-under = 100
ignore-magic = true
ignore-semiprivate = true
ignore-nested-functions = true
extend-exclude = [
  ".local",
  ".pytest_cache",
  ".venv",
  "docs/_build",
]
check = true
diff = true
recursive = true
style = "google"

## ## deptry - Dependency analyzer
[tool.deptry]
extend_exclude = [
  ".local",
  ".pytest_cache",
  ".venv",
  "docs",
  "docs/_build",
  "tools",
]
ignore = []
per_rule_ignores.DEP002 = [
  "gamesheet-sdk-py",
]
known_first_party = [
  "gamesheet_sdk",
]
experimental_namespace_package = true
optional_dependencies_dev_groups = [
  "bandit",
  "blocklint",
  "codespell",
  "complexity",
  "dead-code-detectors",
  "deptry",
  "dev",
  "docs",
  "docstring-tools",
  "editorconfig-checker",
  "formatters",
  "interrogate",
  "markdown-tools",
  "mdformat",
  "mypy",
  "pymarkdown",
  "pyproject-fmt",
