---
# ==============================================================================
# Codecov Configuration
# ==============================================================================
# Defines coverage gates, component tracking, and reporting preferences for
# Codecov integration. This file controls:
#   - Project/patch coverage targets (100% required)
#   - Flag-based tracking (per-Python-version, per-OS, nightly vs PR)
#   - Component-based tracking (per-module coverage status)
#   - PR comment layout and GitHub Checks annotations
#   - Test Analytics integration (flaky tests, performance tracking)
#
# Reference: https://docs.codecov.com/docs/codecov-yaml
# ==============================================================================

codecov:
  # Default branch for coverage comparison
  branch: main

  # Only process uploads if CI has passed
  require_ci_to_pass: true

  # Wait for all CI jobs before calculating coverage status
  notify:
    wait_for_ci: true

# ==============================================================================
# Coverage Gates (Project + Patch + Changes)
# ==============================================================================
# Target: 100% coverage across the entire project with 0% drop tolerance.
# Patch: 100% coverage required for all newly-introduced lines.
# Changes: Informational only (doesn't block PRs on indirect coverage shifts).
# ==============================================================================
coverage:
  # Coverage percentage precision
  precision: 2

  # Color range for coverage display (red at ≤95%, green at 100%)
  range: 95..100

  # Rounding mode for coverage percentages
  round: down

  status:
    # Indirect coverage changes (not directly modified lines)
    changes:
      default:
        if_ci_failed: error
        informational: true  # Don't fail PRs on indirect-coverage shifts

    # New code coverage status (only lines changed in PR)
    patch:
      default:
        if_ci_failed: error
        target: 100%  # All new code must be fully covered
        threshold: 0%  # No exceptions

    # Overall project coverage status
    project:
      default:
        if_ci_failed: error
        if_no_uploads: error
        target: 100%
        threshold: 0%  # No drops tolerated - maintain 100%

# ==============================================================================
# Flag Management (Coverage Organized by Upload Tags)
# ==============================================================================
# Each codecov-action upload tags its data with one or more flags:
#   - Per-PR pytest matrix: `unittests` + `py3-11`, `py3-12`, `py3-13`, `py3-14`
#   - Nightly comprehensive: `nightly` + OS flags + Python version flags
#
# `carryforward: true` means a missing upload re-uses the previous report
# instead of marking that flag's coverage as absent.
# ==============================================================================
flag_management:
  # Default rules applied to all flags
  default_rules:
    carryforward: true
    statuses:
      - target: 100%
        threshold: 0%
        type: project
      - target: 100%
        threshold: 0%
        type: patch

  # Individual flag definitions
  individual_flags:
    # Per-PR pytest matrix flag (aggregates all Python versions)
    - name: unittests
      carryforward: true
      paths:
        - src/

    # Nightly comprehensive test run flag
    - name: nightly
      carryforward: true
      paths:
        - src/

    # Python version flags (tagged by both PR and nightly runs)
    - name: py3-11
      carryforward: true
      paths:
        - src/

    - name: py3-12
      carryforward: true
      paths:
        - src/

    - name: py3-13
      carryforward: true
      paths:
        - src/

    - name: py3-14
      carryforward: true
      paths:
        - src/

    # Operating system flags (nightly comprehensive runs only)
    - name: ubuntu-latest
      carryforward: true
      paths:
        - src/

    - name: macos-latest
      carryforward: true
      paths:
        - src/

    - name: windows-latest
      carryforward: true
      paths:
        - src/

# ==============================================================================
# Component Management (Coverage Organized by Module/Package)
# ==============================================================================
# Each component computes its own project/patch coverage status independently.
# A regression in `auth` shows up separately from `cli`. Mirrors the SDK
# module layout under src/gamesheet_sdk/.
#
# Structure:
#   - Package directories (auth/, cli/, games/, roster/, shared/)
#   - Individual module files (associations.py, browser.py, config.py, etc.)
# ==============================================================================
component_management:
  # Default rules applied to all components
  default_rules:
    statuses:
      - target: 100%
        threshold: 0%
        type: project
      - target: 100%
        threshold: 0%
        type: patch

  # Individual component definitions (alphabetical order)
  individual_components:
    # Package directories
    - name: Authentication
      component_id: auth
      paths:
        - src/gamesheet_sdk/auth/

    - name: CLI
      component_id: cli
      paths:
        - src/gamesheet_sdk/cli/

    - name: Games
      component_id: games
      paths:
        - src/gamesheet_sdk/games/

    - name: Roster
      component_id: roster
      paths:
        - src/gamesheet_sdk/roster/

    - name: Shared
      component_id: shared
      paths:
        - src/gamesheet_sdk/shared/

    # Individual module files
    - name: Associations
      component_id: associations
      paths:
        - src/gamesheet_sdk/associations.py

    - name: Browser
      component_id: browser
      paths:
        - src/gamesheet_sdk/browser.py

    - name: Config
      component_id: config
      paths:
        - src/gamesheet_sdk/config.py

    - name: Constants
      component_id: constants
      paths:
        - src/gamesheet_sdk/constants.py

    - name: Divisions
      component_id: divisions
      paths:
        - src/gamesheet_sdk/divisions.py

    - name: Errors
      component_id: errors
      paths:
        - src/gamesheet_sdk/errors.py

    - name: Exceptions
      component_id: exceptions
      paths:
        - src/gamesheet_sdk/exceptions.py

    - name: iPad Keys
      component_id: ipad_keys
      paths:
        - src/gamesheet_sdk/ipad_keys.py

    - name: Leagues
      component_id: leagues
      paths:
        - src/gamesheet_sdk/leagues.py

    - name: Output
      component_id: output
      paths:
        - src/gamesheet_sdk/output.py

    - name: Referees
      component_id: referees
      paths:
        - src/gamesheet_sdk/referees.py

    - name: Seasons
      component_id: seasons
      paths:
        - src/gamesheet_sdk/seasons.py

    - name: Session
      component_id: session
      paths:
        - src/gamesheet_sdk/session.py

    - name: Teams
      component_id: teams
      paths:
        - src/gamesheet_sdk/teams.py

# ==============================================================================
# PR Comment Layout
# ==============================================================================
# Controls the Codecov bot's PR comment appearance and content.
# ==============================================================================
comment:
  # Comment behavior
  behavior: default  # Comment on every PR

  hide_project_coverage: false  # Show overall project coverage

  # Layout sections in display order
  layout: header, diff, flags, components, files, footer

  require_base: false  # Comment even if base commit has no coverage
  require_changes: false  # Comment even if no coverage change
  require_head: true  # Only comment if HEAD commit has coverage
  show_carryforward_flags: true  # Show which flags were carried forward

# ==============================================================================
# GitHub Checks Annotations
# ==============================================================================
# Enable inline annotations in PR diff view showing uncovered lines.
# ==============================================================================
github_checks:
  annotations: true

# ==============================================================================
# Coverage Ignore Patterns
# ==============================================================================
# Files and paths to exclude from coverage calculation.
# ==============================================================================
ignore:
  - tests/**  # Test code itself
  - docs/**  # Sphinx documentation sources
  - '**/__init__.py' # Re-export modules (typically just imports)

# ==============================================================================
# Test Analytics
# ==============================================================================
# Codecov's Test Analytics provides:
#   - Failed test detection and tracking
#   - Flaky test detection (tests that fail intermittently)
#   - Test performance tracking (duration trends)
#
# Integration is enabled by uploading JUnit XML via codecov-action with
# `report_type: test_results`. This is already configured in:
#   - .github/workflows/codecov.yml (per-PR pytest matrix)
#   - .github/workflows/comprehensive-tests.yml (nightly multi-OS runs)
#
# Configuration and alert thresholds are managed in the Codecov web dashboard
# under the project's "Tests" tab once JUnit data is uploaded. There is no
# top-level `test_analytics:` key in this YAML file.
#
# Flaky test alerts are configured to trigger after 2 consecutive flaky runs.
# Test slowdown alerts are configured to trigger at >10% duration increase.
#
# Reference: https://docs.codecov.com/docs/test-analytics
# ==============================================================================
