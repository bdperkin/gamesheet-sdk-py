# Codecov configuration
# Reference: https://docs.codecov.com/docs/codecov-yaml

codecov:
  branch: main
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

# ---------------------------------------------------------------------------
# Project + patch + changes coverage gates
# ---------------------------------------------------------------------------
coverage:
  precision: 2
  round: down
  range: 95..100 # red at <=95, green at 100

  status:
    project:
      default:
        target: 100%
        threshold: 0% # no drops tolerated - maintain 100%
        if_ci_failed: error
        if_no_uploads: error

    patch:
      default:
        target: 100% # all new code must be fully covered
        threshold: 0% # no exceptions
        if_ci_failed: error

    changes:
      default:
        informational: true # don't fail PRs on indirect-coverage shifts
        if_ci_failed: error

# ---------------------------------------------------------------------------
# Coverage data organized BY UPLOAD (flags)
#
# Each codecov-action upload tags its data with one or more flags. The
# per-PR pytest matrix tags coverage with `unittests` + a `py3-XX` per-
# Python-version flag; the nightly comprehensive run tags with `nightly`
# plus per-os/per-python sub-flags. `carryforward: true` means a missing
# upload re-uses the previous report instead of nuking the status.
# ---------------------------------------------------------------------------
flag_management:
  default_rules:
    carryforward: true
    statuses:
      - type: project
        target: 100%
        threshold: 0%
      - type: patch
        target: 100%
        threshold: 0%
  individual_flags:
    - name: unittests
      paths:
        - src/
      carryforward: true
    - name: nightly
      paths:
        - src/
      carryforward: true
    - name: py3-11
      paths:
        - src/
      carryforward: true
    - name: py3-12
      paths:
        - src/
      carryforward: true
    - name: py3-13
      paths:
        - src/
      carryforward: true
    - name: py3-14
      paths:
        - src/
      carryforward: true
    - name: ubuntu-latest
      paths:
        - src/
      carryforward: true
    - name: macos-latest
      paths:
        - src/
      carryforward: true
    - name: windows-latest
      paths:
        - src/
      carryforward: true

# ---------------------------------------------------------------------------
# Coverage data organized BY FILE PATHS (components)
#
# Each component computes its own project/patch coverage status, so a
# regression in `auth` shows up independently from `cli`. Mirrors the SDK
# module layout under src/gamesheet_sdk/.
# ---------------------------------------------------------------------------
component_management:
  default_rules:
    statuses:
      - type: project
        target: 100%
        threshold: 0%
      - type: patch
        target: 100%
        threshold: 0%
  individual_components:
    - component_id: cli
      name: CLI
      paths:
        - src/gamesheet_sdk/cli.py
    - component_id: auth
      name: Authentication
      paths:
        - src/gamesheet_sdk/auth.py
    - component_id: browser
      name: Browser
      paths:
        - src/gamesheet_sdk/browser.py
    - component_id: session
      name: Session
      paths:
        - src/gamesheet_sdk/session.py
    - component_id: associations
      name: Associations
      paths:
        - src/gamesheet_sdk/associations.py
    - component_id: config
      name: Config
      paths:
        - src/gamesheet_sdk/config.py
    - component_id: output
      name: Output
      paths:
        - src/gamesheet_sdk/output.py
    - component_id: exceptions
      name: Exceptions
      paths:
        - src/gamesheet_sdk/exceptions.py

# ---------------------------------------------------------------------------
# Customized reporting preferences
# ---------------------------------------------------------------------------
comment:
  # Layout sections in display order
  layout: "header, diff, flags, components, files, footer"
  behavior: default # Comment on every PR
  require_changes: false # Comment even if no coverage change
  require_base: false
  require_head: true
  show_carryforward_flags: true
  hide_project_coverage: false

# Inline GitHub Checks annotations (shows uncovered lines in the PR diff
# view)
github_checks:
  annotations: true

# ---------------------------------------------------------------------------
# Files / paths to ignore in coverage
# ---------------------------------------------------------------------------
ignore:
  - "tests/**" # test code itself
  - "docs/**" # Sphinx sources
  - "**/__init__.py" # re-export modules
  - "**/_version.py" # hatch-vcs generated

# ---------------------------------------------------------------------------
# Test Analytics
#
# Codecov's Test Analytics (failed-test detection, flaky-test detection,
# and test-performance tracking) is enabled by uploading JUnit XML via
# the codecov-action's `report_type: test_results` input — already wired
# in .github/workflows/codecov.yml (per-PR matrix) and
# .github/workflows/comprehensive-tests.yml (nightly multi-OS). There is
# no top-level `test_analytics:` codecov.yml key; thresholds and
# alert preferences are managed in the Codecov dashboard under the
# project's "Tests" tab once JUnit data lands.
#
# Reference: https://docs.codecov.com/docs/test-analytics
# ---------------------------------------------------------------------------
