---
# ==============================================================================
# Trivy Vulnerability Suppressions
# ==============================================================================
# Suppresses CVEs that are either:
#   1. Not exploitable in this project's context
#   2. No fixed version available in the base image's Debian suite
#   3. Transitive dependencies of the container base image
#
# See: https://trivy.dev/latest/docs/configuration/filtering/
#
# ------------------------------------------------------------------------------
# This file is the single source of truth for CVE suppression
# ------------------------------------------------------------------------------
# Suppression used to be split between this file and ~337 "won't fix" alert
# dismissals in the GitHub Security UI. Those were folded in here and reopened
# on 2026-07-27, so no Trivy alert is dismissed in the UI any more.
#
# Suppress a new base-image CVE by adding an entry below — NOT by dismissing the
# alert in the UI. A UI dismissal is invisible to anyone reading the repo, is
# exempt from the expiry mechanism below, and re-splits the source of truth.
#
# This also satisfies the project's own policy: the "Documentation Requirements"
# section of docs/security/vulnerability-acceptance-criteria.md requires each
# accepted vulnerability to record CVE ID, package, severity, justification,
# review date and expiration date. A UI dismissal captured none of those beyond
# a boilerplate comment; an entry here captures all of them.
#
# ------------------------------------------------------------------------------
# IMPORTANT — this filename is NOT auto-detected
# ------------------------------------------------------------------------------
# Trivy auto-loads a plain `.trivyignore` from the working directory, but it
# does NOT auto-load `.trivyignore.yaml` (verified against trivy 0.69.3). Every
# scan must therefore pass the file explicitly:
#
#   trivy ...          --ignorefile .trivyignore.yaml
#   aquasecurity/trivy-action:  trivyignores: .trivyignore.yaml
#
# If you add a new Trivy invocation and forget this, all suppressions below go
# silently inactive and the Security tab fills with base-image noise.
#
# ------------------------------------------------------------------------------
# expired_at — suppressions self-terminate
# ------------------------------------------------------------------------------
# `expired_at` is the date the ignore rule STOPS applying. Once it passes, the
# CVE is reported again, which forces a fresh look instead of relying on a
# human remembering the quarterly review. Dates are staggered by severity so
# the whole file doesn't come due at once:
#
#   CRITICAL / HIGH   → 3 months   (2026-10-27)
#   MEDIUM / unrated  → 6 months   (2027-01-27)
#   LOW / Debian-"unimportant" → 12 months (2027-07-27)
#
# When an entry expires: re-check the Debian security tracker
# (https://security-tracker.debian.org/tracker/<CVE>). If a fix has landed,
# delete the entry and rebuild. If not, extend `expired_at` and say why.
#
# ------------------------------------------------------------------------------
# Risk assessment shared by every entry below
# ------------------------------------------------------------------------------
# These live in Debian system libraries pulled in by the `python:3.11-slim`
# base image (Debian trixie) and by Playwright's Chromium dependency list in
# the Dockerfile. None is a direct dependency of this project's Python code.
# The SDK/CLI does not:
#   - Parse XML files directly (libxml2 / libexpat not reachable)
#   - Use audio libraries (libasound2 not reachable)
#   - Run or connect to a D-Bus server (GDBus paths not reachable)
#   - Decompress untrusted archives via gzip
#   - Use PKCS#11 tokens or crypto smartcards
#   - Invoke the LLVM toolchain at runtime
#   - Use SQLite databases
#   - Invoke coreutils / diffutils binaries with attacker-controlled arguments
# The runtime container also runs as a single non-root user, so attacks that
# require an attacker-writable path or a hostile local user do not apply.
# ==============================================================================

