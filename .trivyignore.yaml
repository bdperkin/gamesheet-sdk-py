  # Of the 158 unique dismissed CVEs, the 119 added here are the ones still
  # present in the current image. 34 matched nothing in it and were left out,
  # for the same reason the five stale hand-written rules were removed: a rule
  # that matches nothing is dead weight that hides the fact it is obsolete.
  # (The remaining 5 of the 124 in-image CVEs were already covered above.)

