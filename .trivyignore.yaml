  #
  # HONESTY NOTE: these entries were migrated in bulk, not individually
  # re-triaged. Each carries the package, Trivy's title and Debian status as
  # recorded in the 2026-07-27 image scan, plus a rationale that applies to its
  # package family rather than to the specific CVE. The `expired_at` dates are
  # what forces real per-CVE triage: as each tier comes due, the CVE is reported
  # again and must be justified individually or dropped.
