  # ----------------------------------------------------------------------------
  # pip — vendored packages (build-time only, not independently upgradeable)
  # ----------------------------------------------------------------------------
  - id: GHSA-6v7p-g79w-8964
    statement: >-
      HIGH: pip._vendor.msgpack — Out-of-bounds read / crash on Unpacker reuse
      after a caught error. msgpack 1.1.2 is vendored inside pip; pip 26.1.2
      (latest as of 2026-08-02) still bundles this version. Cannot be upgraded
      independently — requires a pip release with an updated vendor bundle.
      pip is used only during image build (package installation); at runtime the
      container does not invoke pip or its msgpack vendored code. Not exploitable
      in this project's runtime context.
    expired_at: 2026-11-02

  - id: CVE-2025-47273
    statement: >-
      HIGH: pip._vendor setuptools 70.3.0 (via bom.cdx.json / vendor.txt) —
      Path traversal in PackageIndex.download leading to arbitrary file write.
      setuptools 70.3.0 is declared as a vendored dependency inside pip 26.2;
      the installed setuptools is 83.0.0 (fixed). Cannot upgrade the vendored
      reference independently — requires a pip release with an updated vendor
      manifest. The vulnerable PackageIndex code path is not invoked by pip
      (pip uses its own resolver); at runtime the container does not invoke pip
      or its vendored setuptools. Not exploitable in this project's context.
    expired_at: 2026-11-02

  - id: CVE-2026-59890
    statement: >-
      MEDIUM: pip._vendor setuptools 70.3.0 (via bom.cdx.json / vendor.txt) —
      MANIFEST.in exclusion bypass via Unicode normalization collision on macOS
      APFS/HFS+. Same vendored-in-pip situation as CVE-2025-47273 above;
      installed setuptools is 83.0.0 (fixed). The vulnerability requires macOS
      with APFS/HFS+ and local write access to the source tree — neither
      condition applies to a Linux container image. Not exploitable here.
    expired_at: 2027-02-02

