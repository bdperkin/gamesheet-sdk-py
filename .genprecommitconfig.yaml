---
# .genprecommitconfig.yaml - Configuration for tools/genprecommitconfig
#
# Run: ./tools/genprecommitconfig
# See: tools/README.md

globals:
  blacklisted_hooks:
    - black-jupyter
    - blank-line-after-blocks-jupyter
    - check-byte-order-marker
    - check-symlinks
    - check-xml
    - double-quote-string-fixer
    - editorconfig-checker-system
    - fix-encoding-pragma
    - forbid-new-submodules
    - format-docstring-jupyter
    - pip-compile
    - requirements-txt-fixer
    - sort-simple-yaml

ci:
  autofix_commit_msg: "style: Auto-fixes from pre-commit.ci"
  autofix_prs: true
  autoupdate_branch: ""
  autoupdate_commit_msg: "chore(deps): Update pre-commit hooks"
  autoupdate_schedule: weekly
  submodules: false
  skip:
    - deptry
    - editorconfig-checker
    - flake8
    - identity
    - mdformat
    - mypy
    - pylint
    - pyrefly-check
    - pyright
    - pyroma
    - semgrep
    - semgrep-ci
    - uv-lock
    - yesqa

categories:
  meta:
    description: Meta Hooks (pre-commit validation)
    repos:

      - name: meta
        repo: meta

  conventional-commits:
    description: Commit Message Linting (Conventional Commits)
    repos:

      - name: conventional-pre-commit
        repo: https://github.com/compilerla/conventional-pre-commit

  check:
    description: Global File Sanity Checks
    repos:

      - name: pre-commit-hooks
        repo: https://github.com/pre-commit/pre-commit-hooks
        hooks:
          - id: check-added-large-files
            overrides:
              exclude: ^uv\.lock$
          - id: detect-aws-credentials
            prepends:
              args:
                - --allow-missing-credentials
          - id: file-contents-sorter
            overrides:
              files: ^custom-dictionary\.txt$
          - id: pretty-format-json
            prepends:
              args:
                - --autofix
                - --no-sort-keys
          - id: name-tests-test
            overrides:
              exclude: ^tests/.*(cli|conftest|constants|endpoints|mocks|payloads|roster_helpers)\.py$
            prepends:
              args:
                - --pytest-test-first

      - name: pygrep-hooks
        repo: https://github.com/pre-commit/pygrep-hooks
        hooks:
          - id: text-unicode-replacement-char
            overrides:
              exclude: ^\.pre-commit-config\.yaml$

      - name: uv-pre-commit
        repo: https://github.com/astral-sh/uv-pre-commit
        rev: installed
        hooks:
          - id: uv-audit
            overrides:
              stages:
                - manual
          - id: uv-export
            overrides:
              stages:
                - manual

  configuration_file_linters_-_formatters:
    description: Configuration File Linters & Formatters
    repos:

      - name: editorconfig-checker.python
        repo: https://github.com/editorconfig-checker/editorconfig-checker.python

      - name: format-json
        repo: https://github.com/jsh9/format-json
        hooks:
          - id: format-json
            prepends:
              args:
                - --autofix

      - name: yamlfix
        repo: https://github.com/lyz-code/yamlfix

      - name: yamllint
        repo: https://github.com/adrienverge/yamllint
        hooks:
          - id: yamllint
            overrides:
              exclude: ^\.pre-commit-config\.yaml$

      - name: pyproject-fmt
        repo: https://github.com/tox-dev/pyproject-fmt

      - name: validate-pyproject
        repo: https://github.com/abravalheri/validate-pyproject

      - name: pyroma
        repo: https://github.com/regebro/pyroma

  documentation_-_markdown_tools:
    description: Documentation & Markdown Tools
    repos:

      - name: mdformat
        repo: https://github.com/hukkin/mdformat
        hooks:
          - id: mdformat
            appends:
              additional_dependencies:
                - gamesheet-sdk-py[mdformat]

      - name: markdown-heading-numbering
        repo: https://github.com/jsh9/markdown-heading-numbering
        hooks:
          # semantic-release prepends each release at the placeholder, so
          # numbering CHANGELOG.md would renumber every entry below it on
          # every release — and count backwards through time besides.
          - id: markdown-heading-numbering
            overrides:
              exclude: ^CHANGELOG\.md$

      - name: markdown-toc-creator
        repo: https://github.com/jsh9/markdown-toc-creator

      - name: pymarkdown
        repo: https://github.com/jackdewinter/pymarkdown

  code_style_-_formatting_-automated_fixers-:
    description: Code Style & Formatting (Automated Fixers)
    repos:

      - name: add-trailing-comma
        repo: https://github.com/asottile/add-trailing-comma

      - name: blank-line-after-blocks
        repo: https://github.com/jsh9/blank-line-after-blocks

      - name: absolufy-imports
        repo: https://github.com/marcogorelli/absolufy-imports

      - name: pyupgrade
        repo: https://github.com/asottile/pyupgrade

      - name: isort
        repo: https://github.com/pycqa/isort

      - name: ssort
        repo: https://github.com/bwhmather/ssort

      - name: autopep8
        repo: https://github.com/hhatto/autopep8

      - name: black-pre-commit-mirror
        repo: https://github.com/psf/black-pre-commit-mirror

  code_cleaners_-_dead_code_detectors:
    description: Code Cleaners & Dead Code Detectors
    repos:

      - name: detect-secrets
        repo: https://github.com/yelp/detect-secrets

      - name: unimport
        repo: https://github.com/hakancelikdev/unimport
        rev: 0.11.1
        hooks:
          - id: unimport
            overrides:
              language_version: python3.11
            prepends:
              args:
                - --remove

      - name: autoflake
        repo: https://github.com/pycqa/autoflake

      - name: vulture
        repo: https://github.com/jendrikseipp/vulture
        hooks:
          - id: vulture
            appends:
              args:
                - .

      - name: deptry
        repo: https://github.com/osprey-oss/deptry
        hooks:
          - id: deptry
            overrides:
              language: python
            appends:
              additional_dependencies:
                - gamesheet-sdk-py[deptry]

  documentation_-_docstring_tools:
    description: Documentation & Docstring Tools
    repos:

      - name: codespell
        repo: https://github.com/codespell-project/codespell

      - name: blacken-docs
        repo: https://github.com/asottile/blacken-docs

      - name: docformatter
        repo: https://github.com/pycqa/docformatter

      - name: interrogate
        repo: https://github.com/econchick/interrogate
        hooks:
          - id: interrogate
            overrides:
              pass_filenames: false

      - name: format-docstring
        repo: https://github.com/jsh9/format-docstring

      - name: pydoclint
        repo: https://github.com/jsh9/pydoclint

      - name: pydocstyle
        repo: https://github.com/pycqa/pydocstyle

  code_quality_linters_-_static_analysis:
    description: Code Quality Linters & Static Analysis
    repos:

      - name: blocklint
        repo: https://github.com/princetonuniversity/blocklint

      - name: yesqa
        repo: https://github.com/asottile/yesqa
        hooks:
          - id: yesqa
            appends:
              additional_dependencies:
                - gamesheet-sdk-py[flake8]

      - name: flake8
        repo: https://github.com/pycqa/flake8
        hooks:
          - id: flake8
            overrides:
              exclude: ^tools/(syncdeps|genprecommitconfig)$
            appends:
              additional_dependencies:
                - gamesheet-sdk-py[flake8]

      - name: refurb
        repo: https://github.com/dosisod/refurb
        hooks:
          - id: refurb
            overrides:
              exclude: ^tools/(syncdeps|genprecommitconfig)$
            appends:
              additional_dependencies:
                - gamesheet-sdk-py[refurb]

      - name: pylint
        repo: https://github.com/pylint-dev/pylint
        hooks:
          - id: pylint
            appends:
              additional_dependencies:
                - gamesheet-sdk-py[pylint]

      - name: pyrefly-pre-commit
        repo: https://github.com/facebook/pyrefly-pre-commit
        hooks:
          - id: pyrefly-check
            appends:
              additional_dependencies:
                - gamesheet-sdk-py[pyrefly]

  security-_metrics_-_complexity:
    description: Security, Metrics & Complexity
    repos:

      - name: bandit
        repo: https://github.com/pycqa/bandit
        hooks:
          - id: bandit
            prepends:
              args:
                - --configfile
                - pyproject.toml
                - --recursive

      - name: semgrep
        repo: https://github.com/semgrep/pre-commit
        hooks:
          - id: semgrep
            prepends:
              args:
                - --jobs
                - "1"

      - name: xenon
        repo: https://github.com/rubik/xenon

  type_checkers:
    description: Type Checkers
    repos:

      - name: pyright-python
        repo: https://github.com/robertcraigie/pyright-python
        hooks:
          - id: pyright
            appends:
              additional_dependencies:
                - gamesheet-sdk-py[pyright,tools]

      - name: mirrors-mypy
        repo: https://github.com/pre-commit/mirrors-mypy
        hooks:
          - id: mypy
            overrides:
              exclude: ^tools/(syncdeps|genprecommitconfig)$
            prepends:
              args:
                - --strict
            appends:
              additional_dependencies:
                - gamesheet-sdk-py[mypy,tools]

  pre-commit-hook-sync:
    description: Pre-Commit Hook Sync
    repos:

      - name: pre-commit-ci-config
        repo: https://github.com/pre-commit-ci/pre-commit-ci-config

      - name: sync-pre-commit-deps
        repo: https://github.com/pre-commit/sync-pre-commit-deps
