---
# .genprecommitconfig.yaml - Configuration for tools/genprecommitconfig
#
# Run: ./tools/genprecommitconfig
# See: tools/README.md

globals:
  blacklisted_hooks:
    - check-byte-order-marker
    - check-symlinks
    - check-xml
    - double-quote-string-fixer
    - editorconfig-checker-system
    - fix-encoding-pragma
    - forbid-new-submodules
    - pip-compile
    - requirements-txt-fixer
    - ruff
    - semgrep
    - sort-simple-yaml

ci:
  autofix_commit_msg: 'style: Auto-fixes from pre-commit.ci'
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: 'chore(deps): Update pre-commit hooks'
  autoupdate_schedule: weekly
  submodules: false
  # Skipped on pre-commit.ci only. Keep this list minimal — add an entry only
  # when a specific pre-commit.ci run fails on that hook. Everything skipped
  # here still runs in GitHub Actions, which has no tier limit.
  #
  #   pyroma      introspects via `python -m build`, and pre-commit.ci's bundled
  #               Python has no ensurepip, so the build venv cannot be created
  #   semgrep-ci  the semgrep repo env is 332 MiB, over the 250 MiB tier limit,
  #               and this is the only id keeping that repo in the config (the
  #               plain `semgrep` id is blacklisted), so skipping it here is
  #               enough to keep the env from being built at all
  #   ty          entry is `uv check`, which syncs the project environment when
  #               it runs; pre-commit.ci has no network during hook execution
  skip:
    - identity
    - pyroma
    - semgrep-ci
    - ty

categories:
  meta:
    description: Hook Management
    repos:

      - name: meta
        repo: meta

      - name: sync-pre-commit-deps
        repo: https://github.com/pre-commit/sync-pre-commit-deps

  dependencies:
    description: Lockfile Synchronization
    repos:

      - name: uv
        repo: https://github.com/astral-sh/uv-pre-commit
        rev: installed
        hooks:
          - id: uv-audit
            overrides:
              stages:
                - manual
          - id: uv-export
            overrides:
              stages:
                - manual

  checks:
    description: Low-level Checks
    repos:

      - name: pre-commit-hooks
        repo: https://github.com/pre-commit/pre-commit-hooks
        hooks:
          - id: check-added-large-files
            overrides:
              exclude: ^uv\.lock$
          - id: detect-aws-credentials
            prepends:
              args:
                - --allow-missing-credentials
          - id: file-contents-sorter
            overrides:
              files: ^custom-dictionary\.txt$
          - id: pretty-format-json
            prepends:
              args:
                - --autofix
                - --no-sort-keys
          - id: name-tests-test
            overrides:
              exclude: ^tests/(cli/roster_helpers|fixtures/constants|helpers/cli|helpers/constants|helpers/endpoints|helpers/mocks|helpers/payloads)\.py$
            prepends:
              args:
                - --pytest-test-first

      - name: pygrep-hooks
        repo: https://github.com/pre-commit/pygrep-hooks
        hooks:
          - id: text-unicode-replacement-char
            overrides:
              exclude: ^\.pre-commit-config\.yaml$

      - name: editorconfig-checker
        repo: https://github.com/editorconfig-checker/editorconfig-checker.python

  configuration:
    description: Configuration Validation
    repos:

      - name: format-json
        repo: https://github.com/jsh9/format-json
        hooks:
          - id: format-json
            prepends:
              args:
                - --autofix
                - --indent
                - '2'

      - name: yamlfix
        repo: https://github.com/lyz-code/yamlfix

      - name: yamllint
        repo: https://github.com/adrienverge/yamllint

      - name: pyproject-fmt
        repo: https://github.com/tox-dev/pyproject-fmt

      - name: validate-pyproject
        repo: https://github.com/abravalheri/validate-pyproject

      - name: pyroma
        repo: https://github.com/regebro/pyroma

  markdown:
    description: Markdown Formatting
    repos:

      - name: mdformat
        repo: https://github.com/hukkin/mdformat
        hooks:
          - id: mdformat
            appends:
              additional_dependencies:
                - gamesheet-sdk-py[mdformat]

      - name: markdown-heading-numbering
        repo: https://github.com/jsh9/markdown-heading-numbering
        hooks:
          - id: markdown-heading-numbering
            overrides:
              exclude: ^CHANGELOG\.md$

      - name: markdown-toc-creator
        repo: https://github.com/jsh9/markdown-toc-creator

      - name: pymarkdown
        repo: https://github.com/jackdewinter/pymarkdown

  security:
    description: Secret and Vulnerability Scans
    repos:

      - name: detect-secrets
        repo: https://github.com/yelp/detect-secrets

      - name: semgrep
        repo: https://github.com/semgrep/pre-commit

  format:
    description: Python Formatting
    repos:

      - name: ruff
        repo: https://github.com/astral-sh/ruff-pre-commit
        hooks:
          - id: ruff-check
            prepends:
              args:
                - --fix

  quality:
    description: Code Quality
    repos:

      - name: vulture
        repo: https://github.com/jendrikseipp/vulture

      - name: interrogate
        repo: https://github.com/econchick/interrogate
        hooks:
          - id: interrogate
            overrides:
              pass_filenames: false

      - name: codespell
        repo: https://github.com/codespell-project/codespell

      - name: blocklint
        repo: https://github.com/princetonuniversity/blocklint

  architecture:
    description: Dependencies and Complexity Metrics
    repos:

      - name: deptry
        repo: https://github.com/osprey-oss/deptry
        hooks:
          - id: deptry
            overrides:
              language: python
            appends:
              additional_dependencies:
                - gamesheet-sdk-py[deptry]

      - name: xenon
        repo: https://github.com/rubik/xenon

  types:
    description: Static Type Checks
    repos:

      - name: ty
        repo: https://github.com/astral-sh/ty-pre-commit
        hooks:
          - id: ty
            prepends:
              args:
                - --fix
                # `uv check` syncs the project environment itself, so without
                # the tools extra `packaging`/`tomlkit`/`ruamel-yaml` are
                # unresolvable and everything in tools/ infers as `Unknown`.
                - --extra
                - tools

  commits:
    description: Commit Standards
    repos:

      - name: conventional-pre-commit
        repo: https://github.com/compilerla/conventional-pre-commit

      - name: pre-commit-ci-config
        repo: https://github.com/pre-commit-ci/pre-commit-ci-config
