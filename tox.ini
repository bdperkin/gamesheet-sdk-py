[tox]
requires =
    tox>=4.21
env_list =
    py314
    py313
    py312
    py311
    lint
    type
    pylint
    security
    files-check
    docs
    docs-lint

[testenv]
description = Run the pytest suite under {base_python}
package = editable
extras =
    dev
commands =
    pytest --cov {posargs}

[testenv:lint]
description = Python style checks (black --check, isort --check, flake8 via Flake8-pyproject)
skip_install = true
deps =
    Flake8-pyproject>=1.2
    black>=26.3
    flake8>=7.1
    isort>=5.13
commands =
    black --check src tests
    isort --check src tests
    flake8 src tests

[testenv:type]
description = Type-check with mypy --strict
extras =
    dev
commands =
    mypy src tests

[testenv:pylint]
description = Lint with pylint (config in pyproject.toml)
deps =
    pylint>=4
extras =
    dev
commands =
    pylint src tests

[testenv:security]
description = Security scan with bandit (config in [tool.bandit])
skip_install = true
deps =
    bandit[toml]>=1.7
commands =
    bandit -c pyproject.toml -r src

[testenv:files-check]
description = Non-Python file checks (codespell, yamllint, validate-pyproject, editorconfig-checker, mdformat --check)
skip_install = true
deps =
    codespell>=2.4
    editorconfig-checker>=3.6
    mdformat>=0.7
    mdformat-gfm>=0.4
    packaging
    pymarkdownlnt
    pyproject-fmt
    tomli
    tox-ini-fmt
    validate-pyproject>=0.25
    yamllint>=1.38
commands =
    codespell
    yamllint .
    validate-pyproject pyproject.toml
    pyproject-fmt pyproject.toml
    tox-ini-fmt tox.ini
    ec
    pymarkdown scan .
    mdformat .

[testenv:docs]
description = Build the HTML documentation (two-pass; strict on second pass)
extras =
    docs
commands =
    sphinx-build -b html docs docs/_build/html
    sphinx-build -b html -n -W --keep-going docs docs/_build/html

[testenv:docs-lint]
description = Lint Sphinx source files with sphinx-lint
extras =
    docs
commands =
    sphinx-lint -i _build -i _autosummary docs

[testenv:fix]
description = Apply auto-formatters in place (isort, black, mdformat)
skip_install = true
deps =
    black>=26.3
    isort>=5.13
    mdformat>=0.7
    mdformat-gfm>=0.4
commands =
    isort src tests
    black src tests
    mdformat CLAUDE.md README.md docs

[testenv:docs-epub]
description = Build the EPUB documentation
extras =
    docs
commands =
    sphinx-build -b epub docs docs/_build/epub

[testenv:docs-man]
description = Build the man-page documentation
extras =
    docs
commands =
    sphinx-build -b man docs docs/_build/man

[testenv:docs-pdf]
description = Build the PDF documentation (requires LaTeX / pdflatex / latexmk on PATH)
extras =
    docs
commands =
    sphinx-build -b latex docs docs/_build/latex
    make -C docs/_build/latex all-pdf
allowlist_externals =
    make

[testenv:docs-linkcheck]
description = Check for broken external links in the documentation
extras =
    docs
commands =
    sphinx-build -b linkcheck docs docs/_build/linkcheck

[testenv:docs-doctest]
description = Run doctest examples embedded in the documentation
extras =
    docs
commands =
    sphinx-build -b doctest docs docs/_build/doctest

[testenv:docs-serve]
description = Live-reload preview at http://127.0.0.1:8000
extras =
    docs
commands =
    sphinx-autobuild docs docs/_build/html {posargs}
