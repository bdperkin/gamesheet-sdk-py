[tox]
requires =
    tox>=4.2
env_list =
    autopep8
    flake8
    absolufy-imports
    add-trailing-comma
    autoflake
    bandit
    black
    blacken-docs
    blocklint
    codespell
    deptry
    docformatter
    docs
    docs-lint
    docs-linkcheck
    docs-doctest
    docs-epub
    docs-man
    docs-pdf
    docs-serve
    editorconfig-checker
    interrogate
    isort
    mdformat
    mypy
    pydocstyle
    pylint
    pymarkdown
    pyproject-fmt
    pyrefly
    pyright
    pyroma
    pytest
    pyupgrade
    radon-{cc, raw, mi, hal}
    refurb
    semgrep
    ssort
    tox-ini-fmt
    unimport
    validate-pyproject
    vulture
    yamllint
    pre-commit
    py3{14, 13, 12, 11}
skip_missing_interpreters = true

[testenv]
description = Install the package under {base_python}
download = true
package = deps-only
commands_pre =
    python --version
    pip --version
commands =
    pip install -e . {posargs}
    gamesheet-admin --version
    gamesheet-teams --version
allowlist_externals =
    rm
labels = tests

[testenv:autopep8]
description = Automatically formats Python code to conform to the PEP 8 style guide by fixing layout issues.
extras =
    autopep8
commands_pre =
    autopep8 --version
commands =
    autopep8 --diff . {posargs}
labels = code_style_-_formatting_-automated_fixers-

[testenv:flake8]
description = Combines PyFlakes, pycodestyle, and McCabe to check style compliance and basic logic errors.
extras =
    flake8
commands_pre =
    flake8 --version
commands =
    flake8 {posargs}
labels = code_quality_linters_-_static_analysis

[testenv:absolufy-imports]
description = Automatically converts relative imports in a Python project into absolute imports.
extras =
    absolufy-imports
commands_pre =
    pip show --version absolufy-imports
commands =
    absolufy-imports {posargs}
labels = code_style_-_formatting_-automated_fixers-

[testenv:add-trailing-comma]
description = A simple tool that automatically adds trailing commas to Python multi-line function calls and literals.
extras =
    add-trailing-comma
commands_pre =
    pip show --version add-trailing-comma
commands =
    add-trailing-comma {posargs}
labels = code_style_-_formatting_-automated_fixers-

[testenv:autoflake]
description = Automatically removes unused imports and unused variables from Python code.
extras =
    autoflake
commands_pre =
    autoflake --version
commands =
    autoflake . {posargs}
labels = code_cleaners_-_dead_code_detectors

[testenv:bandit]
description = Scans Python source code to find common security flaws and vulnerabilities (like hardcoded passwords or insecure functions).
extras =
    bandit
commands_pre =
    bandit --version
commands =
    bandit --configfile pyproject.toml --recursive . {posargs}
labels = security-_metrics_-_complexity

[testenv:black]
description = An aggressive, highly opinionated, zero-configuration auto-formatter that reformats entire Python files to a strict aesthetic.
extras =
    black
commands_pre =
    black --version
commands =
    black --line-length=110 --check --diff . {posargs}
labels = code_style_-_formatting_-automated_fixers-

[testenv:blacken-docs]
description = Applies the `black` code formatter to Python code snippets embedded inside Markdown or reStructuredText documentation.
extras =
    blacken-docs
commands_pre =
    pip show --version blacken-docs
commands =
    blacken-docs {posargs}
labels = documentation_-_docstring_tools

[testenv:blocklint]
description = A simple linter that flags the use of non-inclusive words (like 'whitelist' or 'master') in code comments or strings.
extras =
    blocklint
commands_pre =
    pip show --version blocklint
commands =
    blocklint {posargs}
labels = code_quality_linters_-_static_analysis

[testenv:codespell]
description = A lightweight tool designed to quickly fix common misspellings in text and code documentation.
extras =
    codespell
commands_pre =
    codespell --version
commands =
    codespell {posargs}
labels = documentation_-_docstring_tools

[testenv:deptry]
description = Checks your Python project dependencies to spot unused, missing, or transitively used packages.
package = editable
extras =
    deptry
commands_pre =
    deptry --version
commands =
    deptry . {posargs}
labels = code_cleaners_-_dead_code_detectors

[testenv:docformatter]
description = Automatically reformats Python docstrings to follow PEP 257 description and spacing conventions.
extras =
    docformatter
commands_pre =
    docformatter --version
commands =
    docformatter --check --diff . {posargs}
labels = documentation_-_docstring_tools

[testenv:docs]
description = Build the HTML documentation (two-pass; strict on second pass)
package = editable
extras =
    docs
commands_pre =
    sphinx-build --version
    sphinx-apidoc --version
commands =
    rm -rf docs/_build docs/reference/_autosummary
    python docs/generate_api_docs.py
    sphinx-build -b html docs docs/_build/html
    rm -rf docs/_build docs/reference/_autosummary
    python docs/generate_api_docs.py
    sphinx-build -b html -n --keep-going docs docs/_build/html
allowlist_externals =
    rm
labels = docs

[testenv:docs-lint]
description = Lint Sphinx source files with sphinx-lint and check API doc freshness
package = editable
extras =
    docs
commands_pre =
    sphinx-lint --version
    sphinx-apidoc --version
commands =
    python docs/generate_api_docs.py
    python docs/check_api_freshness.py
    sphinx-lint -i _build -i _autosummary docs
labels = docs

[testenv:docs-linkcheck]
description = Check for broken external links in the documentation
package = editable
extras =
    docs
commands_pre =
    sphinx-build --version
commands =
    rm -rf docs/_build docs/reference/_autosummary
    sphinx-build -b linkcheck docs docs/_build/linkcheck
allowlist_externals =
    rm
labels = docs

[testenv:docs-doctest]
description = Run doctest examples embedded in the documentation
package = editable
extras =
    docs
commands_pre =
    sphinx-build --version
commands =
    rm -rf docs/_build docs/reference/_autosummary
    sphinx-build -b doctest docs docs/_build/doctest
allowlist_externals =
    rm
labels = docs

[testenv:docs-epub]
description = Build the EPUB documentation
package = editable
extras =
    docs
commands_pre =
    sphinx-build --version
commands =
    rm -rf docs/_build docs/reference/_autosummary
    sphinx-build -b epub docs docs/_build/epub
allowlist_externals =
    rm
labels = docs

[testenv:docs-man]
description = Build the man-page documentation
package = editable
extras =
    docs
commands_pre =
    sphinx-build --version
commands =
    rm -rf docs/_build docs/reference/_autosummary
    sphinx-build -b man docs docs/_build/man
allowlist_externals =
    rm
labels = docs

[testenv:docs-pdf]
description = Build the PDF documentation (requires LaTeX / pdflatex / latexmk on PATH)
package = editable
extras =
    docs
commands_pre =
    sphinx-build --version
commands =
    rm -rf docs/_build docs/reference/_autosummary
    sphinx-build -b latex docs docs/_build/latex
    make -C docs/_build/latex all-pdf
allowlist_externals =
    make
    rm
labels = docs

[testenv:docs-serve]
description = Live-reload preview at http://127.0.0.1:8000
package = editable
extras =
    docs
commands_pre =
    sphinx-autobuild --version
    sphinx-apidoc --version
commands =
    rm -rf docs/_build docs/reference/_autosummary
    python docs/generate_api_docs.py
    sphinx-autobuild docs docs/_build/html --watch src/gamesheet_sdk {posargs}
allowlist_externals =
    rm
labels = docs

[testenv:editorconfig-checker]
description = A tool to ensure your code adheres to the definitions laid out in your `.editorconfig` file.
extras =
    editorconfig-checker
commands_pre =
    ec --version
commands =
    ec {posargs}
labels = configuration_file_linters_-_formatters

[testenv:interrogate]
description = Measures and flags the percentage of your code (modules, classes, methods) that lacks documentation.
extras =
    interrogate
commands_pre =
    interrogate --version
commands =
    interrogate {posargs}
labels = documentation_-_docstring_tools

[testenv:isort]
description = Automatically sorts, groups, and tidies your Python import statements alphabetically.
extras =
    isort
commands_pre =
    isort --version
commands =
    isort --profile=black --check --diff . {posargs}
labels = code_style_-_formatting_-automated_fixers-

[testenv:mdformat]
description = An opinionated automatic formatter for Markdown files to ensure consistent rendering and styling.
base_python = python3.13
extras =
    mdformat
commands_pre =
    mdformat --version
commands =
    mdformat --check . {posargs}
labels = documentation_-_markdown_tools

[testenv:mypy]
description = The foundational tool for checking optional static type hints (`typing`) in Python code to catch bugs before execution.
package = editable
extras =
    mypy
commands_pre =
    mypy --version
commands =
    mypy --strict . {posargs}
labels = type_checkers

[testenv:pydocstyle]
description = A static analysis tool that checks whether your Python docstrings conform to PEP 257 style conventions.
extras =
    pydocstyle
commands_pre =
    pydocstyle --version
commands =
    pydocstyle {posargs}
labels = documentation_-_docstring_tools

[testenv:pylint]
description = An exceptionally thorough and highly customizable linter that checks for errors, code smells, and design issues.
package = editable
extras =
    pylint
commands_pre =
    pylint --version
commands =
    pylint --reports y src tools {posargs}
labels = code_quality_linters_-_static_analysis

[testenv:pymarkdown]
description = Scans Markdown files to ensure they adhere to strict style rules and standard specification guidelines.
extras =
    pymarkdown
commands_pre =
    pymarkdown version
commands =
    pymarkdown scan . {posargs}
labels = documentation_-_markdown_tools

[testenv:pyproject-fmt]
description = An automated formatter for `pyproject.toml` files to keep dependencies and tables consistent.
extras =
    pyproject-fmt
commands_pre =
    pyproject-fmt --version
commands =
    pyproject-fmt pyproject.toml {posargs}
labels = configuration_file_linters_-_formatters

[testenv:pyrefly]
description = A structural static analysis tool aimed at evaluating architectural health, modern syntax, and styling flaws.
package = editable
extras =
    pyrefly
commands_pre =
    pyrefly --version
commands =
    pyrefly check {posargs}
labels = code_quality_linters_-_static_analysis

[testenv:pyright]
description = A command-line wrapper for Microsoft's Pyright, a rapid, standards-compliant static type checker for large Python codebases.
package = editable
extras =
    pyright
commands_pre =
    pyright --version
commands =
    pyright {posargs}
labels = type_checkers

[testenv:pyroma]
description = Rates your Python project's packaging configuration (`setup.py` or `pyproject.toml`) for compliance with PyPI best practices.
extras =
    pyroma
commands_pre =
    pip show --version pyroma
commands =
    pyroma . {posargs}
labels = configuration_file_linters_-_formatters

[testenv:pytest]
description = Run the pytest suite under {base_python}
package = editable
extras =
    pytest
commands_pre =
    pytest --version
commands =
    pytest --cov {posargs}
labels = tests

[testenv:pyupgrade]
description = Automatically upgrades older Python syntax features to match newer language versions.
extras =
    pyupgrade
commands_pre =
    pip show --version pyupgrade
commands =
    pyupgrade --py311-plus {posargs}
labels = code_style_-_formatting_-automated_fixers-

[testenv:refurb]
description = Points out sections of your code that can be written more cleanly, safely, or elegantly using modern Python features.
extras =
    refurb
commands_pre =
    refurb --version
commands =
    refurb . {posargs}
labels = code_quality_linters_-_static_analysis

[testenv:semgrep]
description = Static analysis tool used to find bugs, detect security vulnerabilities, and enforce coding standards in source code.
extras =
    semgrep
commands_pre =
    semgrep --version
commands =
    semgrep scan \
      --config=p/security-audit \
      --config=p/secrets \
      --config=p/python \
      --config=p/dockerfile \
      --sarif \
      --output=semgrep-results.sarif \
      --verbose {posargs}
labels = security-_metrics_-_complexity

[testenv:ssort]
description = Reorders the top-level statements (functions, classes) in a Python file so that dependent items come after their definitions.
extras =
    ssort
commands_pre =
    ssort --version
commands =
    ssort {posargs}
labels = code_style_-_formatting_-automated_fixers-

[testenv:tox-ini-fmt]
description = A lightweight tool that automatically fixes and formats the styling of `tox.ini` files.
extras =
    tox-ini-fmt
commands_pre =
    pip show --version tox-ini-fmt
commands =
    tox-ini-fmt tox.ini {posargs}
labels = configuration_file_linters_-_formatters

[testenv:unimport]
description = A targeted tool designed specifically to find and securely erase unused import statements.
extras =
    unimport
commands_pre =
    unimport --version
commands =
    unimport --check --diff {posargs}
labels = code_cleaners_-_dead_code_detectors

[testenv:validate-pyproject]
description = Validates `pyproject.toml` files against schemas to ensure they are structurally valid for packaging tools.
extras =
    validate-pyproject
commands_pre =
    validate-pyproject --version
commands =
    validate-pyproject pyproject.toml {posargs}
labels = configuration_file_linters_-_formatters

[testenv:vulture]
description = Scans Python codebases to find completely unused classes, functions, and variables that can be safely deleted.
extras =
    vulture
commands_pre =
    vulture --version
commands =
    vulture . {posargs}
labels = code_cleaners_-_dead_code_detectors

[testenv:yamllint]
description = Checks YAML files for syntax validity, key duplication, and cosmetic issues like line length and spaces.
extras =
    yamllint
commands_pre =
    yamllint --version
commands =
    yamllint --config-data relaxed . {posargs}
labels = configuration_file_linters_-_formatters

[testenv:pre-commit]
description = Run code formatters, linters, and security checks before a commit is finalized
extras =
    dev
commands_pre =
    pre-commit --version
commands =
    pre-commit run --all-files
labels = pre-commit

[testenv:radon-{cc,raw,mi,hal}]
description = Computes various code metrics, including Maintainability Index and Cyclomatic Complexity, to identify bloated or confusing code.
extras =
    radon
commands_pre =
    radon --version
commands =
    cc: radon cc --show-complexity --average . {posargs}
    raw: radon raw . {posargs}
    mi: radon mi --show . {posargs}
    hal: radon hal . {posargs}
labels = security-_metrics_-_complexity

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
